<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<meta name="color-scheme" content="dark">
<title>Gravity Lab 重力實驗室</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2305080d'/%3E%3Cg fill='none' stroke='%23e3b97c' stroke-width='1.4'%3E%3Cellipse cx='16' cy='16' rx='12' ry='4.8' transform='rotate(-28 16 16)'/%3E%3Cellipse cx='16' cy='16' rx='12' ry='4.8' transform='rotate(40 16 16)' opacity='.55'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23e3b97c'/%3E%3C/svg%3E">
<style>
/* GRAVITY LAB — an orrery you can rewrite.
   Palette: night sky, polished brass (time, "now") and verdigris (things you can touch); blocks are enamel inlays.
   Layout: the universe is full-bleed; one rail along the bottom holds time and the tray switches; every panel is a tray
   (a small window) that can be dragged, folded to its bar, resized and closed. */
:root{
  --night:#05080d; --glass:rgba(12,19,27,.84); --solid:#0d151e; --raise:#152130;
  --line:rgba(196,216,230,.13); --line2:rgba(196,216,230,.26);
  --bone:#e8eef0; --muted:#8d9ba7; --dim:#5f6d79;
  --verd:#8fe0cc; --verd-ink:#06221b; --brass:#e3b97c; --brass-ink:#2a1c06; --coral:#ef8f80;
  --bk-event:#b9791c; --bk-body:#1c8f7a; --bk-world:#3170c4; --bk-control:#c25b37; --bk-value:#6b57c6; --bk-cond:#5c8a2b; --bk-var:#b24a73;
  --bk-group:#1f9ec2; --bk-law:#9446ad; --bk-my:#5d6b7f; --bk-data:#958a1e;
  --font:"Avenir Next","Segoe UI Variable Text","Segoe UI","PingFang TC","Hiragino Sans","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --tap:44px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--night);color:var(--bone);font:13px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums lining-nums}
body{position:fixed;inset:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation}
button:disabled{opacity:.38;cursor:default}
:focus{outline:none}
:focus-visible{outline:2px solid var(--verd);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;font-weight:500}
svg.ic{width:20px;height:20px;display:block;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
#gl,#ov{position:fixed;inset:0;width:100%;height:100%;display:block}
#gl{touch-action:none}
#ov{pointer-events:none}
.layer{position:fixed;inset:0;display:none}
body[data-route="title"] #titleLayer,body[data-route="home"] #homeLayer,body[data-route="lab"] #labLayer{display:block}
body[data-route="home"] #gl,body[data-route="home"] #ov,body[data-route="title"] #ov{visibility:hidden}
#labLayer{pointer-events:none}
#labLayer>*{pointer-events:auto}
body.clean #labLayer>*:not(#cleanExit):not(#recBadge){display:none!important}
.hidden{display:none!important}

/* ---------- shared controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line2);background:rgba(255,255,255,.04);color:var(--bone);white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
@media (hover:hover){.btn:hover{background:rgba(255,255,255,.08)}}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--verd);border-color:transparent;color:var(--verd-ink);font-weight:600}
@media (hover:hover){.btn.primary:hover{background:#a4ebd9}}
.btn.brass{background:var(--brass);border-color:transparent;color:var(--brass-ink);font-weight:600}
.btn.danger{color:var(--coral);border-color:rgba(239,143,128,.35)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--muted)}
@media (hover:hover){.btn.quiet:hover{color:var(--bone);background:rgba(255,255,255,.06)}}
.btn.small{min-height:32px;padding:0 11px;font-size:12px}
.btn.block{display:flex;width:100%}
.iconbtn{width:var(--tap);height:var(--tap);display:grid;place-items:center;border-radius:50%;color:var(--bone);transition:background .15s}
@media (hover:hover){.iconbtn:hover{background:rgba(255,255,255,.08)}}
.iconbtn.on{color:var(--verd)}
.seg{display:inline-flex;padding:3px;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.25);max-width:100%}
.seg button{min-height:34px;padding:0 13px;border-radius:999px;color:var(--muted);white-space:nowrap}
.seg button.on{background:rgba(143,224,204,.16);color:var(--verd)}
.chip{display:inline-flex;align-items:center;min-height:32px;padding:0 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:rgba(255,255,255,.03);white-space:nowrap}
.chip.on{color:var(--verd);border-color:rgba(143,224,204,.45);background:rgba(143,224,204,.1)}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.field>label,.field>.lab{color:var(--muted);flex:none;max-width:46%}
.field .ctl{display:flex;align-items:center;gap:6px;min-width:0;flex:1;justify-content:flex-end}
.inp{height:36px;min-width:0;padding:0 10px;border-radius:9px;border:1px solid var(--line2);background:rgba(0,0,0,.3);color:var(--bone);font-size:16px}
.inp.num{width:104px;text-align:right}
.inp.wide{width:100%}
select.inp{padding-right:6px;max-width:150px;font-size:14px}
.switch{position:relative;width:46px;height:28px;border-radius:999px;background:rgba(255,255,255,.12);flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#dfe6ea;transition:transform .15s}
.switch.on{background:var(--verd)}
.switch.on::after{transform:translateX(18px);background:#06221b}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--line2);border-radius:3px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-10px;border-radius:50%;background:var(--verd);border:3px solid #0d151e}
input[type=range]::-moz-range-track{height:3px;background:var(--line2);border-radius:3px}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--verd);border:3px solid #0d151e}
.note{color:var(--muted);font-size:12px;line-height:1.5}
.sec{padding:14px 0;border-top:1px solid var(--line)}
.sec:first-child{border-top:0;padding-top:4px}
.sec>h3{font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:500}
.rowwrap{display:flex;flex-wrap:wrap;gap:7px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;align-items:baseline}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right}
.kv dd.warn{color:var(--coral)}

/* ---------- title ---------- */
#titleLayer{background:transparent;overflow:hidden;--entry-x:50%;--entry-y:64%;--entry-roll:-4deg;--hx:50%;--hy:43%}
#titleStill{position:absolute;inset:0;background:#000 center 43%/cover no-repeat;transition:opacity .8s}
#titleLayer.live #titleStill{opacity:0}
#titleShade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 43%,transparent 24%,rgba(0,0,0,.03) 63%,rgba(0,0,0,.26) 100%);pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;color:#f4ecdf}
.brand svg{width:30px;height:30px;color:var(--brass)}
.brand b{font-weight:500;letter-spacing:.26em;font-size:14px}
#titleTop{position:absolute;left:max(22px,var(--sal));right:max(22px,var(--sar));top:max(20px,var(--sat));display:flex;align-items:center;justify-content:space-between;filter:drop-shadow(0 2px 8px #000)}
.langsel{height:40px;padding:0 10px;border-radius:999px;border:1px solid rgba(235,217,188,.2);background:rgba(6,7,9,.42);color:#eee4d5;font-size:13px}
#startWrap{position:absolute;left:var(--entry-x);top:var(--entry-y);width:240px;height:100px;transform:translate(-50%,-50%) rotate(var(--entry-roll))}
#startBtn{position:absolute;inset:0;border-radius:50%;color:#fff3df;isolation:isolate}
#startBtn::before{content:"";position:absolute;inset:6px 27px 2px;background:radial-gradient(ellipse,rgba(3,4,5,.67) 0%,rgba(3,4,5,.46) 30%,rgba(3,4,5,.13) 55%,transparent 73%);border-radius:50%;z-index:-1}
#startBtn svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 4px rgba(255,199,119,.27));transition:transform .3s,filter .3s}
#startBtn span{position:absolute;top:33px;left:0;right:0;text-align:center;font-size:17px;font-weight:300;letter-spacing:.34em;text-indent:.34em;text-shadow:0 1px 6px #000,0 0 20px #1b0f00;transition:letter-spacing .3s,text-indent .3s}
#startBtn:focus-visible svg{transform:scaleX(1.06);filter:drop-shadow(0 0 7px rgba(255,216,157,.56))}
@media (hover:hover){#startBtn:hover svg{transform:scaleX(1.06);filter:drop-shadow(0 0 7px rgba(255,216,157,.56))}}
#startBtn:focus-visible span{letter-spacing:.45em;text-indent:.45em}
@media (hover:hover){#startBtn:hover span{letter-spacing:.45em;text-indent:.45em}}
#startBtn:active svg{transform:scaleX(.94)}
#startBtn:focus-visible{outline:1px solid #f3d8ac;outline-offset:5px}
#titlePause{position:absolute;left:max(14px,var(--sal));bottom:max(12px,var(--sab));color:#afaaa0;font-size:12px}
#burst{position:absolute;left:var(--hx);top:var(--hy);width:0;height:0;pointer-events:none}
#burst i{position:absolute;left:0;top:0;width:100vmax;height:100vmax;border-radius:50%;transform:translate(-50%,-50%) scale(.04);opacity:0}
#burst .halo{background:radial-gradient(circle,rgba(255,229,168,.47) 0%,rgba(255,178,75,.33) 8%,rgba(210,106,41,.24) 19%,rgba(156,54,24,.08) 32%,transparent 49%);mix-blend-mode:screen}
#burst .ring{width:48vmax;height:48vmax;border:2px solid rgba(255,230,187,.65);box-shadow:0 0 24px rgba(255,210,140,.33),inset 0 0 35px rgba(231,135,61,.33)}
#veil{position:absolute;inset:0;background:#020203;opacity:0;pointer-events:none}
#titleLayer.go #startWrap{animation:tOut .9s ease-out both}
#titleLayer.go #titlePause{opacity:0}
#titleLayer.go #burst .halo{animation:tGlow .9s linear both}
#titleLayer.go #burst .ring{animation:tRing .9s cubic-bezier(.16,.6,.3,1) both}
#titleLayer.go #veil{animation:tVeil .9s ease-in both}
@keyframes tOut{0%{opacity:1}33%,100%{opacity:0}}
@keyframes tGlow{0%,58%{opacity:0;transform:translate(-50%,-50%) scale(.08)}66%{opacity:.78}100%{opacity:0;transform:translate(-50%,-50%) scale(1.9)}}
@keyframes tRing{0%,59%{opacity:0;transform:translate(-50%,-50%) scale(.1)}63%{opacity:.85}100%{opacity:0;transform:translate(-50%,-50%) scale(3.4)}}
@keyframes tVeil{0%,83%{opacity:0}100%{opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ---------- home ---------- */
#homeLayer{overflow-y:auto;-webkit-overflow-scrolling:touch;background:radial-gradient(120% 80% at 80% -10%,#101b28 0%,#070b11 55%,#05080d 100%);animation:fadeIn .35s ease-out}
.home{max-width:1080px;margin:0 auto;padding:max(18px,var(--sat)) max(20px,var(--sar)) calc(40px + var(--sab)) max(20px,var(--sal))}
.home-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:34px}
.home h1{font-size:30px;font-weight:400;letter-spacing:.01em;line-height:1.2}
.home-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.home-head p{color:var(--muted);margin-top:6px;max-width:46ch}
.home-actions{display:flex;gap:8px;flex-wrap:wrap}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ucard{display:grid;grid-template-columns:72px 1fr auto;align-items:center;gap:14px;padding:12px 8px 12px 12px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.025);text-align:left;transition:border-color .15s,background .15s;position:relative}
@media (hover:hover){.ucard:hover{border-color:var(--line2);background:rgba(255,255,255,.05)}}
.ucard .open{position:absolute;inset:0;border-radius:18px}
.port{width:72px;height:72px;border-radius:50%;background:#000 center/cover;box-shadow:0 0 0 1px rgba(227,185,124,.45),0 0 0 4px rgba(227,185,124,.08),inset 0 0 14px #000;overflow:hidden;flex:none}
.port.empty{display:grid;place-items:center;color:var(--brass)}
.ucard h3{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ucard .meta{color:var(--muted);font-size:12px;margin-top:3px}
.ucard .meta span{display:block}
.ucard .more{position:relative;z-index:1;color:var(--muted)}
.ucard.new{border-style:dashed;border-color:rgba(143,224,204,.4);color:var(--verd)}
.ucard.new h3{color:var(--verd)}
.empty-note{color:var(--muted);padding:6px 2px 0}
.home h2{font-size:18px;margin:40px 0 4px}
.home h2+p{color:var(--muted);margin-bottom:14px;max-width:60ch}
.xlist{border-top:1px solid var(--line);counter-reset:x}
.xrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;width:100%;padding:13px 4px;border-bottom:1px solid var(--line);text-align:left;transition:background .15s}
@media (hover:hover){.xrow:hover{background:rgba(255,255,255,.035)}}
.xrow .n{width:28px;height:28px;border-radius:50%;border:1px solid rgba(227,185,124,.5);color:var(--brass);display:grid;place-items:center;font-size:13px}
.xrow b{font-weight:500;font-size:15px;display:block}
.xrow span{color:var(--muted);font-size:12.5px}
.xrow svg{color:var(--dim)}
.home-foot{margin-top:34px;color:var(--dim);font-size:12px;display:flex;gap:16px;flex-wrap:wrap}
.home-foot button{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tpl{padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);text-align:left;min-height:96px;display:flex;flex-direction:column;gap:5px;transition:border-color .15s,background .15s}
@media (hover:hover){.tpl:hover{border-color:rgba(143,224,204,.5);background:rgba(143,224,204,.06)}}
.tpl b{font-weight:500;font-size:14px}
.tpl span{color:var(--muted);font-size:12px;line-height:1.45}

/* ---------- lab HUD: a slim top row, the clock, one rail along the bottom ---------- */
#topRow{position:absolute;left:max(4px,var(--sal));right:max(4px,var(--sar));top:max(2px,var(--sat));height:44px;display:flex;align-items:center;gap:0;pointer-events:none;text-shadow:0 1px 6px #000;z-index:30}
#labLayer>#topRow{pointer-events:none}
#topRow>*{pointer-events:auto}
#topRow .iconbtn{width:40px;height:40px;flex:none}
#uName{font-size:15px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:8px 6px 8px 2px;border-radius:8px}
#saveDot{font-size:11.5px;color:var(--muted);margin-left:2px;white-space:nowrap;flex:none}
#saveDot.dirty{color:var(--brass)}
#topRow .sp{flex:1;min-width:4px;pointer-events:none}
#clock{position:absolute;left:max(16px,var(--sal));top:calc(max(2px,var(--sat)) + 44px);pointer-events:none;text-shadow:0 1px 8px #000}
#labLayer>#clock,#labLayer>#vars{pointer-events:none}
#clock .t{font-size:19px;font-weight:300;letter-spacing:.01em;color:#f3ead9;line-height:1.2}
#clock .s{font-size:11.5px;color:var(--muted);min-height:17px}
#clock .s.warn{color:var(--brass)}
#vars{position:absolute;left:max(16px,var(--sal));top:calc(max(2px,var(--sat)) + 90px);display:flex;flex-direction:column;gap:5px;align-items:flex-start;pointer-events:none}
.varchip{padding:4px 9px;border-radius:9px;background:rgba(10,16,23,.72);border:1px solid var(--line);font-size:12px}
.varchip b{font-weight:500;color:var(--muted);margin-right:8px}
.varchip i{font-style:normal;color:var(--brass);margin-left:8px}
.varchip i.b{color:#f0d3a4}
.varchip.law{border-color:rgba(148,70,173,.65);background:rgba(36,16,44,.78);max-width:min(78vw,420px);white-space:normal;line-height:1.45}
.varchip.law span{color:#e2c4ee}
.engine{display:flex;align-items:center;gap:10px;margin:10px 0 8px;padding:10px 12px;border-radius:12px;border:1px solid rgba(148,70,173,.55);background:rgba(36,16,44,.5)}
.engine>svg{flex:none;width:20px;height:20px;color:#e2c4ee}
.engine>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:13px}
.engine>div b{font-weight:500}
.engine>div span{color:var(--muted);font-size:12px;line-height:1.4}
#rail{position:absolute;left:0;right:0;bottom:max(8px,var(--sab));padding:0 max(6px,var(--sar)) 0 max(6px,var(--sal));display:flex;justify-content:center;z-index:30}
#labLayer>#rail{pointer-events:none}
body.short #rail{justify-content:flex-start}
#railIn{display:flex;align-items:center;gap:1px;height:56px;padding:0 5px;max-width:100%;border-radius:20px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#playBtn{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;color:var(--brass-ink);background:radial-gradient(circle at 35% 30%,#f6d8a5,#d9a964 70%);box-shadow:0 0 0 3px rgba(227,185,124,.2),0 4px 14px rgba(0,0,0,.5);margin:0 3px 0 1px;transition:transform .1s}
#playBtn:active{transform:scale(.95)}
#playBtn svg{width:22px;height:22px;fill:currentColor;stroke:none}
#rateBtn{min-width:62px;height:46px;padding:0 6px;border-radius:13px;text-align:center;line-height:1.15;flex:none}
@media (hover:hover){#rateBtn:hover{background:rgba(255,255,255,.06)}}
#rateBtn b{display:block;font-weight:500;font-size:13.5px;color:#f3ead9;white-space:nowrap}
#rateBtn span{display:block;font-size:10px;color:var(--muted);white-space:nowrap}
#rateBtn span.warn{color:var(--brass)}
#rail .iconbtn{width:40px;height:46px;border-radius:13px;flex:none}
#rail .step{display:none}
#rail .div{width:1px;height:26px;background:var(--line2);margin:0 4px;flex:none}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:46px;height:48px;flex:none;border-radius:13px;color:var(--bone);font-size:10px;line-height:1;white-space:nowrap;position:relative}
@media (hover:hover){.tool:hover{background:rgba(255,255,255,.07)}}
.tool svg{width:20px;height:20px}
.tool.on{color:var(--verd)}
.tool.on::after{content:"";position:absolute;left:50%;bottom:2px;width:14px;height:2px;margin-left:-7px;border-radius:2px;background:var(--verd)}
@media (min-width:520px){#rail .step{display:grid;width:34px}#rateBtn{min-width:74px}}
@media (min-width:720px){.tool{flex-direction:row;width:auto;height:44px;padding:0 12px;gap:7px;font-size:13px}.tool.on::after{bottom:4px}}
/* a phone held sideways: the rail stays as narrow as on an upright phone, so trays can stand beside it */
body.short .tool{flex-direction:column;width:46px;height:48px;padding:0;gap:3px;font-size:10px}
body.short .tool.on::after{bottom:2px}
body.short #rail .step{display:none}
body.short #rateBtn{min-width:62px}
@media (max-width:372px){.tool{width:41px}#rateBtn{min-width:54px;padding:0 3px}#rail .iconbtn.rw{width:36px}#railIn{padding:0 3px}}
#banner{position:absolute;left:max(10px,var(--sal));right:max(10px,var(--sar));top:calc(max(2px,var(--sat)) + 94px);margin:0 auto;max-width:460px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 8px 8px 14px;border-radius:16px;z-index:32;background:var(--glass);border:1px solid rgba(143,224,204,.4);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.45)}
#banner .txt{min-width:0;line-height:1.3}
#banner .txt b{display:block;font-weight:500;color:var(--verd)}
#banner .txt span{color:var(--muted);font-size:12px}
#toasts{position:absolute;left:calc(50% - var(--rest-rx,0px) / 2);transform:translateX(-50%);bottom:calc(max(8px,var(--sab)) + 70px + var(--rest,0px));transition:bottom .18s,left .18s;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;width:min(92vw,520px,calc(100vw - var(--rest-rx,0px) - 2 * var(--ub-w,0px) - 16px));z-index:40}
.toast{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:14px;background:rgba(14,22,31,.94);border:1px solid var(--line2);box-shadow:0 10px 30px rgba(0,0,0,.5);pointer-events:auto;animation:toastIn .2s ease-out;max-width:100%}
.toast .tag{color:var(--brass);font-weight:600}
.toast button{color:var(--verd);font-weight:500;white-space:nowrap}
.toast.out{opacity:0;transition:opacity .3s}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#userBtns{position:absolute;right:calc(max(10px,var(--sar)) + var(--rest-rx,0px));bottom:calc(max(8px,var(--sab)) + 68px + var(--rest-r,0px));transition:bottom .18s,right .18s;display:flex;flex-direction:column;gap:8px;align-items:flex-end;z-index:8}
#labLayer>#userBtns{pointer-events:none}
#userBtns>*{pointer-events:auto}
.ubtn{min-height:42px;padding:0 16px;border-radius:12px;background:var(--bk-event);color:#fff;font-weight:500;box-shadow:0 3px 0 rgba(0,0,0,.35),0 8px 20px rgba(0,0,0,.4)}
.ubtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.abtag{position:absolute;display:flex;align-items:center;gap:6px;padding:3px 9px 3px 4px;border-radius:999px;background:rgba(10,16,23,.7);border:1px solid var(--line);font-size:12px;color:var(--muted);pointer-events:auto;z-index:4}
.abtag b,.win-hd .ab{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;background:rgba(255,255,255,.1);color:var(--bone);flex:none}
.abtag.on{border-color:rgba(143,224,204,.55);color:var(--verd)}
.abtag.on b{background:var(--verd);color:var(--verd-ink)}
#announce{position:absolute;left:50%;top:26%;transform:translate(-50%,-50%);padding:18px 26px;border-radius:18px;background:rgba(14,22,31,.95);border:1px solid var(--brass);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6);min-width:240px;max-width:86vw;animation:toastIn .25s ease-out;z-index:36}
#announce.fail{border-color:var(--coral)}
#announce h3{font-size:20px;color:var(--brass);margin-bottom:8px}
#announce.fail h3{color:var(--coral)}
#announce .rows{display:grid;gap:4px;margin-bottom:14px;color:var(--bone)}
#announce .rows span{color:var(--muted);margin-right:8px}
.xcard h3{font-size:16px;line-height:1.4;margin-bottom:6px}
.xcard p{color:#c6d1d8;margin-top:6px;line-height:1.55}
.xcard p.m{color:var(--muted);font-size:12px}
.xcard .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
#cleanExit{position:absolute;right:max(10px,var(--sar));top:max(8px,var(--sat));opacity:.55;z-index:40}
#recBadge{position:absolute;left:50%;top:max(10px,var(--sat));transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;border-radius:999px;background:rgba(14,22,31,.9);border:1px solid var(--coral);color:var(--coral);z-index:40}
#recBadge i{width:9px;height:9px;border-radius:50%;background:var(--coral);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.pop{position:fixed;z-index:45;max-width:min(92vw,340px);padding:12px 14px 14px;border-radius:16px;background:rgba(14,22,31,.97);border:1px solid var(--line2);box-shadow:0 18px 50px rgba(0,0,0,.6);animation:toastIn .14s ease-out}
.ratepop h3{font-size:12px;color:var(--muted);margin-bottom:6px}
.ratepop .stepper{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.ratepop .stepper b{font-size:18px;font-weight:400;color:#f3ead9;white-space:nowrap}
.ratepop .stepper .iconbtn{border:1px solid var(--line2)}
.ratepop .chip{min-height:34px}

/* ---------- trays: every panel is a small window floating over the universe ---------- */
#wins{position:absolute;inset:0;z-index:10}
#labLayer>#wins{pointer-events:none}
.win{position:absolute;display:flex;flex-direction:column;min-width:0;pointer-events:auto;overflow:hidden;background:rgba(11,18,26,.975);border:1px solid var(--line2);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:winIn .16s ease-out}
.win.front{border-color:rgba(143,224,204,.36);box-shadow:0 18px 54px rgba(0,0,0,.62)}
.win.dragging,.win.sizing{opacity:.74;animation:none;box-shadow:0 26px 70px rgba(0,0,0,.72)}
@keyframes winIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.win-bar{flex:none;position:relative;display:flex;align-items:center;gap:6px;min-height:44px;padding:0 3px 0 12px;cursor:grab;touch-action:none;background:linear-gradient(rgba(255,255,255,.055),rgba(255,255,255,.015));border-bottom:1px solid var(--line)}
.win-bar:active{cursor:grabbing}
.win-bar::before{content:"";position:absolute;left:50%;top:4px;width:28px;height:3px;margin-left:-14px;border-radius:3px;background:rgba(255,255,255,.2)}
.win.folded .win-bar{border-bottom-color:transparent}
.win-ic{display:grid;place-items:center;color:var(--verd);flex:none}
.win-ic svg{width:18px;height:18px}
.win-hd{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.win-hd h2{flex:1;min-width:0;font-size:14.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win-hd .sub{display:block;font-size:11.5px;color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.win-hd .who{flex:1;min-width:0}
.win-hd .who h2{flex:none}
.win-hd .orb{width:30px;height:30px;box-shadow:inset -5px -4px 9px rgba(0,0,0,.75),inset 1px 1px 4px rgba(255,255,255,.12)}
.win-hd .orb.probe{width:12px;height:12px;margin:9px}
.win-hd .orb.ring{margin:0 7px}
.win-extra{display:flex;align-items:center;gap:2px;flex:none}
.win-extra .btn.small{min-height:32px;padding:0 11px}
.win-bar .iconbtn{width:38px;height:38px;flex:none}
.win-fold svg{transition:transform .16s}
.win-fold.up svg{transform:rotate(180deg)}
.win-strip{flex:none}
.win-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 14px 16px;overscroll-behavior:contain}
.win.flush>.win-body{padding:0;display:flex;flex-direction:column;overflow:hidden}
.win.folded>.win-body,.win.folded>.win-grip{display:none}
.win-grip{position:absolute;right:0;bottom:0;width:28px;height:28px;cursor:nwse-resize;touch-action:none;z-index:6}
.win-grip::after{content:"";position:absolute;right:5px;bottom:5px;width:9px;height:9px;border-right:2px solid rgba(255,255,255,.36);border-bottom:2px solid rgba(255,255,255,.36);border-radius:0 0 4px 0}
/* the small view of the other universe: no box of its own, the picture is drawn underneath; the whole of it is the handle */
.win.viewport{background:none;border-color:transparent;box-shadow:0 12px 34px rgba(0,0,0,.55);border-radius:0;overflow:visible;animation:none}
.win.viewport.front{border-color:transparent}
.win.viewport.dragging,.win.viewport.sizing{opacity:1}
.win.viewport>.win-bar{position:absolute;inset:0;min-height:0;padding:6px;align-items:flex-start;gap:4px;background:none;border:0}
.win.viewport>.win-bar::before{display:none}
.win.viewport .win-hd{flex:none;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;background:rgba(10,16,23,.74);border:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap}
.win.viewport .win-hd .ab.b{background:var(--brass);color:var(--brass-ink)}
.win.viewport .win-tools{margin-left:auto;display:flex;gap:4px}
.win.viewport.w-xs .win-hd{padding:3px}
.win.viewport.w-xs .win-hd>span:not(.ab){display:none}
#popBtn{position:absolute;width:36px;height:36px;background:rgba(10,16,23,.7);border:1px solid var(--line);z-index:4}
#popBtn svg{width:17px;height:17px}
.win.viewport .win-bar .iconbtn{width:30px;height:30px;background:rgba(10,16,23,.74);border:1px solid var(--line)}
.win.viewport .win-bar .iconbtn svg{width:16px;height:16px}
.win.viewport>.win-body,.win.viewport>.win-strip{display:none}
.win-tools:empty{display:none}
body.rewinding .win:not(.viewport){display:none}
body.rewinding #rail,body.rewinding #userBtns{display:none}

/* library */
.catrow{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 8px;scrollbar-width:none;flex:none}
.catrow::-webkit-scrollbar{display:none}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;padding:2px 14px 16px;overflow-y:auto;flex:1;min-height:0;align-content:start}
.lib{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 6px 10px;border-radius:14px;border:1px solid transparent;background:rgba(255,255,255,.03);text-align:center;transition:background .15s,border-color .15s}
@media (hover:hover){.lib:hover{background:rgba(255,255,255,.07)}}
.lib.on{border-color:var(--verd);background:rgba(143,224,204,.1)}
.lib b{font-weight:500;font-size:12.5px;line-height:1.25}
.lib span{font-size:11px;color:var(--muted)}
.orb{width:46px;height:46px;border-radius:50%;background:#555 center/200% 100%;box-shadow:inset -7px -5px 12px rgba(0,0,0,.75),inset 2px 2px 5px rgba(255,255,255,.12);position:relative;flex:none}
.orb.star{box-shadow:0 0 16px 2px var(--glow,#ffcf7a),inset 0 0 10px rgba(255,255,255,.6)}
.orb.bh{background:#000;box-shadow:0 0 0 3px #000,0 0 0 5px #c9782a,0 0 14px 4px rgba(233,150,60,.55)}
.orb.wh{background:#fff;box-shadow:0 0 16px 4px #cfeaff}
.orb.probe{background:var(--verd);width:14px;height:14px;margin:16px;box-shadow:0 0 12px var(--verd)}
.orb.ring::after{content:"";position:absolute;left:-28%;right:-28%;top:38%;height:24%;border-radius:50%;border:3px solid rgba(214,196,160,.7);transform:rotate(-18deg)}
.orb.pic{box-shadow:none;background-color:#000}
.libwrap{position:relative;display:grid}
.libdel{position:absolute;right:2px;top:2px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:rgba(10,16,23,.7)}
.libdel svg{width:15px;height:15px}
.libopt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px 8px;flex:none;color:var(--muted)}

/* inspector */
.insp-acts{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 9px;scrollbar-width:none}
.insp-acts::-webkit-scrollbar{display:none}
.insp-acts .btn{min-height:36px;padding:0 12px;flex:none}
.win:not(.folded) .insp-acts{border-bottom:1px solid var(--line)}

/* ---------- blocks ---------- */
.bk-editor{display:flex;flex-direction:column;flex:1;min-height:0}
/* The three scrolling areas keep a hair of transparency on purpose: a fully opaque box floating in the middle of the
   WebGL picture is taken as an occluder, and a software compositor then cuts its hole in the wrong (mirrored) place. */
.bk-ws{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;background:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/100% 26px,rgba(10,17,24,.985);position:relative;overscroll-behavior:contain}
.bk-canvas{display:flex;flex-direction:column;align-items:flex-start;gap:22px;padding:16px 60px 110px 14px;min-width:100%;width:max-content;min-height:100%}
.bk-empty{color:var(--muted);padding:18px 16px;max-width:36ch;line-height:1.6}
.bk-empty b{color:var(--bone);font-weight:500;display:block;margin-bottom:4px;font-size:15px}
.bk-script{display:flex;flex-direction:column;align-items:flex-start;position:relative}
.bk-script.loose{opacity:.62}
.bk-script.off{opacity:.4}
.bk{position:relative;color:#fff;font-size:13.5px;line-height:1.2;touch-action:pan-x pan-y;cursor:grab;--c:var(--bk-body);-webkit-touch-callout:none}
.bk[data-cat=event]{--c:var(--bk-event)}.bk[data-cat=body]{--c:var(--bk-body)}.bk[data-cat=world]{--c:var(--bk-world)}.bk[data-cat=control]{--c:var(--bk-control)}.bk[data-cat=value]{--c:var(--bk-value)}.bk[data-cat=cond]{--c:var(--bk-cond)}.bk[data-cat=var]{--c:var(--bk-var)}
.bk[data-cat=group]{--c:var(--bk-group)}.bk[data-cat=law]{--c:var(--bk-law)}.bk[data-cat=my]{--c:var(--bk-my)}.bk[data-cat=data]{--c:var(--bk-data)}
.bk-row{display:flex;align-items:center;flex-wrap:nowrap;gap:6px;min-height:38px;padding:5px 11px;background:var(--c);white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -2px 0 rgba(0,0,0,.22)}
.bk.stack>.bk-row,.bk.cap>.bk-row{border-radius:7px}
.bk.stack,.bk.cblock,.bk.cap{margin-top:1px}
/* puzzle bump under stack blocks, dent on top */
.bk.stack::after,.bk.cblock::after{content:"";position:absolute;left:16px;bottom:-5px;width:20px;height:5px;background:var(--c);border-radius:0 0 5px 5px;z-index:2;box-shadow:inset 0 -2px 0 rgba(0,0,0,.22)}
.bk.stack>.bk-row::before,.bk.cap>.bk-row::before,.bk.cblock>.bk-row:first-child::before{content:"";position:absolute;left:16px;top:0;width:20px;height:5px;background:rgba(0,0,0,.3);border-radius:0 0 5px 5px}
.bk.hat>.bk-row{border-radius:18px 18px 7px 7px;padding-top:9px;min-height:44px}
.bk.hat::after{content:"";position:absolute;left:16px;bottom:-5px;width:20px;height:5px;background:var(--c);border-radius:0 0 5px 5px;z-index:2;box-shadow:inset 0 -2px 0 rgba(0,0,0,.22)}
.bk.cblock>.bk-row{border-radius:7px 7px 7px 0}
.bk.cblock>.bk-row.mid{border-radius:0 7px 7px 0}
.bk-mouth{margin-left:14px;border-left:14px solid var(--c);margin-left:0;padding:1px 0 6px 0;min-height:30px;min-width:120px;display:flex;flex-direction:column;align-items:flex-start;position:relative}
.bk-mouth>.bk{margin-left:0}
.bk-foot{height:14px;width:118px;background:var(--c);border-radius:0 7px 7px 7px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.22)}
.bk.num,.bk.bool{display:inline-flex;margin:-2px 0}
.bk.num>.bk-row{border-radius:999px;min-height:30px;padding:3px 10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.bk.bool>.bk-row{min-height:30px;padding:3px 16px;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%);box-shadow:none}
.bk-slot{display:inline-flex;align-items:center;min-height:26px}
/* a block that picks a body: the corners cut off, the same shape as the hole it fits (a body menu) */
.bk.bref>.bk-row{min-height:30px;padding:3px 13px;clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 9px,100% calc(100% - 9px),calc(100% - 9px) 100%,9px 100%,0 calc(100% - 9px),0 9px);box-shadow:none}
.bk-slot.hot>.bk>.bk-row{box-shadow:inset 0 0 0 3px #fff}
.bk-slot.body.hot>select.bk-f{box-shadow:0 0 0 3px #fff;background-color:#fff4}
/* advanced blocks carry a small spark at their top right */
.bk.adv.stack>.bk-row::after,.bk.adv.cap>.bk-row::after,.bk.adv.hat>.bk-row::after,.bk.adv.cblock>.bk-row:first-child::after{content:"";position:absolute;right:6px;top:6px;width:5px;height:5px;transform:rotate(45deg);background:rgba(255,255,255,.62);border-radius:1px;pointer-events:none}
.bk.missing>.bk-row{background:repeating-linear-gradient(135deg,var(--c) 0 8px,rgba(0,0,0,.25) 8px 12px);opacity:.8}
.bk.bk-chip{margin-left:2px;cursor:grab}
.bk.bk-chip>.bk-row{min-height:26px;padding:2px 10px;font-size:12.5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.45)}
.bk.num.bk-chip>.bk-row{border-radius:999px}
.bk-slot.bool.empty{width:38px;height:24px;background:rgba(0,0,0,.28);clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%)}
.bk-slot.hot>.bk-f,.bk-slot.bool.empty.hot{box-shadow:0 0 0 3px #fff;background:#fff8}
.bk-f{height:28px;border:0;border-radius:999px;background:#fff;color:#16202b;padding:0 9px;font-size:14px;text-align:center;min-width:38px;max-width:190px}
.bk-f.txt{border-radius:7px;text-align:left;min-width:70px}
select.bk-f{background:rgba(0,0,0,.26);color:#fff;border-radius:7px;padding:0 4px 0 8px;font-size:13.5px;max-width:170px;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);background-position:calc(100% - 11px) 12px,calc(100% - 6px) 12px;background-size:5px 5px;background-repeat:no-repeat;padding-right:20px}
select.bk-f option{color:#111;background:#fff}
.bk-f.bad{box-shadow:0 0 0 2px var(--coral)}
.bk-tag{margin-left:6px;height:24px;padding:0 8px;border-radius:999px;background:rgba(0,0,0,.3);color:#fff;font-size:11.5px;font-weight:600;letter-spacing:.02em}
.bk-tag.off{background:rgba(0,0,0,.5);color:#ffd7cf}
.bk.fired>.bk-row{animation:fired .7s ease-out}
@keyframes fired{0%{box-shadow:0 0 0 4px #fff,0 0 22px 6px #fff}100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -2px 0 rgba(0,0,0,.22)}}
.bk-ghost{position:fixed;left:0;top:0;z-index:999;pointer-events:none;opacity:.94;filter:drop-shadow(0 12px 16px rgba(0,0,0,.55));will-change:transform}
.bk-ghost .bk-script,.bk-ghost{display:flex;flex-direction:column;align-items:flex-start}
.bk-drop{position:absolute;height:5px;border-radius:5px;background:#fff;box-shadow:0 0 10px 2px rgba(255,255,255,.7);pointer-events:none;z-index:5}
.bk-pal{position:relative;flex:none;display:flex;gap:10px;align-items:center;overflow-x:auto;overflow-y:hidden;padding:10px 14px;background:rgba(15,25,36,.985);border-top:1px solid var(--line2);min-height:66px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.bk-pal .bk{touch-action:pan-x;flex:none}
.win.w-lg .bk-pal .bk{touch-action:pan-y}
.bk-pal .bk-f{pointer-events:none}
.bk-pal .bk-mouth{min-height:10px;min-width:60px;padding-bottom:2px}
.bk-pal .bk-foot{height:9px}
.win.w-lg .bk-pal{flex-wrap:wrap;overflow-y:auto;max-height:36%;align-content:flex-start}
.bk-pal.trash{background:rgba(239,143,128,.16);border-top-color:var(--coral)}
.bk-pal.trash>*{opacity:.25}
.bk-pal.trash::before{content:attr(data-trash);position:absolute;left:0;right:0;text-align:center;color:var(--coral);font-weight:600;pointer-events:none}
.bk-cats{flex:none;display:flex;gap:4px;overflow-x:auto;padding:6px 30px 6px 8px;background:rgba(11,19,27,.985);scrollbar-width:none}
.bk-cats::-webkit-scrollbar{display:none}
.bk-cat{display:flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:999px;color:var(--muted);white-space:nowrap}
.bk-cat i{width:11px;height:11px;border-radius:50%;background:var(--c)}
.bk-cat.on{background:rgba(255,255,255,.09);color:var(--bone)}
.bk-cat:not(.adv)+.bk-cat.adv{margin-left:12px;position:relative}
.bk-cat:not(.adv)+.bk-cat.adv::before{content:"";position:absolute;left:-8px;top:9px;bottom:9px;width:1px;background:var(--line2)}
/* the advanced switch stays at the start of the category strip */
.bk-advsw{position:sticky;left:-8px;z-index:2;flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 10px;margin:0 6px 0 -8px;border-radius:0 999px 999px 0;background:rgba(11,19,27,.985);color:var(--muted);white-space:nowrap;box-shadow:6px 0 10px rgba(11,19,27,.95)}
.bk-advsw i{position:relative;width:28px;height:16px;border-radius:999px;background:rgba(255,255,255,.14);transition:background .15s}
.bk-advsw i::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.bk-advsw.on{color:var(--bone)}
.bk-advsw.on i{background:rgba(143,224,204,.35)}
.bk-advsw.on i::after{transform:translateX(12px);background:var(--verd)}
@media (prefers-reduced-motion:reduce){.bk-advsw i,.bk-advsw i::after{transition:none}}
.bk-pdiv{flex:none;align-self:stretch;display:flex;align-items:center;padding:0 2px 0 12px;border-left:1px solid var(--line2);color:var(--muted);font-size:11.5px}
.win.w-lg .bk-pdiv{flex-basis:100%;border-left:0;border-top:1px solid var(--line2);padding:8px 0 0}
.bk-varbtn.solid{display:inline-flex;align-items:center;gap:6px;border-style:solid;border-color:rgba(149,138,30,.9);background:rgba(149,138,30,.28)}
.bk-varbtn.solid svg{width:16px;height:16px}
.bk-varbtn{flex:none;height:34px;padding:0 12px;border-radius:999px;border:1px dashed rgba(255,255,255,.4);color:#fff}

.bk-list{display:flex;flex-direction:column;align-items:flex-start;min-height:8px;min-width:120px}
.bk-val{color:var(--brass);font-size:13px;white-space:nowrap}
/* making a block of your own */
.dlg.pp p{color:var(--muted);font-size:13px;line-height:1.55;margin:4px 0 12px}
.pp-head{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px}
.pp-head b{font-weight:500}
.pp-list{display:flex;flex-direction:column;gap:8px}
.pp-row{display:flex;align-items:center;gap:8px}
.pp-row .inp{flex:1;min-width:0}
.pp-row .seg button{padding:0 10px}
.pp-prev{margin:16px 0 4px;padding:14px 12px;border-radius:12px;background:rgba(10,17,24,.985);overflow-x:auto}
.pp-prev .bk{cursor:default}
.pp-n,.pp-b{display:inline-block;min-width:34px;height:24px;line-height:24px;padding:0 8px;text-align:center;font-size:12.5px}
.pp-n{border-radius:999px;background:#fff;color:#16202b}
.pp-b{background:rgba(0,0,0,.26);border-radius:6px}
/* measurement charts */
.dv-empty{padding:4px 2px;color:var(--muted);line-height:1.6}
.dv-empty b{display:block;color:var(--bone);font-weight:500;font-size:15px}
.dv-empty p{margin:4px 0 12px;max-width:38ch}
.dv-leg{margin:0 0 10px}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--verd) 0 4px,transparent 4px 7px)!important}
.dv-panel{margin-bottom:14px}
.dv-head{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;min-width:0}
.dv-head b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dv-kind{color:var(--dim);font-size:11.5px;white-space:nowrap}
.dv-val{margin-left:auto;color:var(--brass);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.dv-chart{height:128px}
.dv-chart.xy{height:200px}
.dv-lists h3{font-size:13px;font-weight:500;color:var(--muted);margin:6px 0 8px}
.dv-list{display:grid;grid-template-columns:auto auto 1fr;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.dv-len{color:var(--muted);font-size:12px;white-space:nowrap}
.dv-tail{color:var(--brass);font-size:12px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.bk-loose-note{color:var(--muted);font-size:11.5px;margin-top:8px;max-width:30ch;white-space:normal}

/* ---------- parallel ---------- */
.chart{width:100%;height:150px;display:block;border-radius:10px;background:rgba(0,0,0,.28)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.cmp{display:grid;grid-template-columns:1fr auto auto;gap:6px 16px;align-items:baseline}
.cmp .h{color:var(--muted);font-size:12px;text-align:right}
.cmp .k{color:var(--muted)}
.cmp .v{text-align:right}
.loglist{display:grid;gap:0}
.logrow{display:grid;grid-template-columns:auto auto 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);align-items:baseline}
.logrow time{color:var(--brass);font-size:12px;white-space:nowrap}
.logrow .u{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:11px}

/* ---------- rewind ---------- */
#rewind{position:absolute;left:50%;transform:translateX(-50%);bottom:max(8px,var(--sab));z-index:35;width:min(94vw,520px);padding:14px 16px 12px;border-radius:20px;background:rgba(14,22,31,.96);border:1px solid var(--brass);box-shadow:0 16px 50px rgba(0,0,0,.6)}
#rewind .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
#rewind .top b{font-weight:500;color:var(--brass);font-size:15px}
#rewind .top span{color:var(--muted);font-size:12px}
#rewind input[type=range]::-webkit-slider-thumb{background:var(--brass)}
#rewind input[type=range]::-moz-range-thumb{background:var(--brass)}
#rewind .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
#rewind .acts .sp{flex:1}


/* ---------- dialogs ---------- */
#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(2,4,7,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:18px 18px calc(18px + var(--kb,0px));animation:fadeIn .15s}
.dlg{width:min(100%,440px);max-height:min(88vh,720px);overflow-y:auto;border-radius:20px;background:var(--solid);border:1px solid var(--line2);padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.dlg.wide{width:min(100%,720px)}
.dlg h2{font-size:18px;margin-bottom:8px}
.dlg p{color:#c6d1d8;line-height:1.55}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;flex-wrap:wrap;position:sticky;bottom:-20px;padding:12px 0 20px;margin-bottom:-20px;background:linear-gradient(rgba(13,21,30,0),var(--solid) 26%)}
.dlg .inp.wide{margin-top:12px}
.dlg img{max-width:100%;max-height:54vh;border-radius:12px;display:block;margin:10px auto}
.dlg textarea{width:100%;height:180px;margin-top:10px;border-radius:10px;border:1px solid var(--line2);background:#070c12;color:var(--bone);padding:10px;font-size:12px;resize:vertical}
.menu{display:grid;gap:2px;margin-top:6px}
.menu button{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 10px;border-radius:10px;text-align:left}
@media (hover:hover){.menu button:hover{background:rgba(255,255,255,.06)}}
.menu button.danger{color:var(--coral)}
.credits{display:grid;gap:10px;margin-top:10px}
.credits div{color:#c6d1d8;line-height:1.55}
.credits b{display:block;font-weight:500;color:var(--bone)}
.steps{display:grid;gap:12px;margin-top:10px}
.steps>div{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}
.steps>div>svg{color:var(--verd);margin-top:1px}
.steps b{font-weight:500;display:block}
.steps span{color:var(--muted);display:block;line-height:1.5}
#fatal{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:#05080d;z-index:99;text-align:center}
#fatal div{max-width:44ch;display:grid;gap:10px}
details.sec>summary{cursor:pointer;color:var(--muted);font-size:12px;list-style:none;display:flex;align-items:center;gap:6px;min-height:32px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"";width:7px;height:7px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin:0 4px 0 2px}
details.sec[open]>summary::before{transform:rotate(45deg)}
input[type=color]{width:44px;height:36px;padding:2px;border-radius:9px;border:1px solid var(--line2);background:rgba(0,0,0,.3)}
.field .ctl input[type=range]{max-width:170px}
.field .ctl .seg{overflow-x:auto;scrollbar-width:none}
.field .ctl .seg::-webkit-scrollbar{display:none}
/* ---------- challenges: brass medals for what you earn, verdigris for what you can touch ---------- */
.chhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:40px 0 4px}
.chhead h2{margin:0}
.chhead+p{color:var(--muted);margin-bottom:14px;max-width:60ch}
.chtotal{display:inline-flex;align-items:center;gap:6px;color:var(--brass);font-size:13px}
.chtotal svg{width:15px;height:15px;fill:var(--brass);stroke:var(--brass)}
.chlist{display:grid;grid-template-columns:1fr;border-top:1px solid var(--line)}
@media (min-width:760px){.chlist{grid-template-columns:1fr 1fr;column-gap:28px}}
.chrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:12px 4px;border-bottom:1px solid var(--line);text-align:left;transition:background .15s}
@media (hover:hover){.chrow:hover{background:rgba(255,255,255,.035)}}
.chrow .medal{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);color:var(--muted)}
.chrow.won .medal{border-color:rgba(227,185,124,.7);color:var(--brass);background:radial-gradient(circle at 35% 30%,rgba(246,216,165,.16),rgba(217,169,100,.04) 70%)}
.chrow .tx{min-width:0}
.chrow .tx b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chrow .tx b i{font-style:normal;color:var(--brass);font-size:12.5px;margin-right:7px}
.chrow .tx span{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
.stars{display:inline-flex;gap:2px;flex:none}
.stars i{display:block}
.stars svg{width:20px;height:20px;stroke:var(--dim);fill:none;stroke-width:1.4;transition:fill .2s,stroke .2s}
.stars.small svg{width:15px;height:15px}
.stars i.on svg{fill:var(--brass);stroke:var(--brass)}
.stars i.lit svg{animation:starPop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes starPop{0%{transform:scale(.3);opacity:.2}60%{transform:scale(1.25);filter:drop-shadow(0 0 10px rgba(246,216,165,.9))}100%{transform:scale(1)}}

body.chal #toasts{top:calc(max(2px,var(--sat)) + 112px);bottom:auto}
#chGoal{position:absolute;left:max(16px,var(--sal));top:calc(max(2px,var(--sat)) + 88px);display:flex;align-items:flex-start;gap:6px;max-width:min(62vw,360px);font-size:12.5px;line-height:1.35;color:#ecd2a6;text-shadow:0 1px 8px #000;pointer-events:none}
#labLayer>#chGoal{pointer-events:none}
#chGoal svg{width:15px;height:15px;margin-top:1px;color:var(--brass)}
#chBar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(8px,var(--sab)) + 66px);width:min(470px,calc(100vw - 16px));padding:10px 12px;border-radius:18px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:31}
#chBar .tool-row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center}
#chBar .tic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(143,224,204,.5);color:var(--verd)}
#chBar .txt{min-width:0;line-height:1.3}
#chBar .txt b{display:block;font-weight:500;font-size:14px}
#chBar .txt span{display:block;color:var(--muted);font-size:12px}
#chBar .step{font-size:11px;color:var(--brass);border:1px solid rgba(227,185,124,.45);border-radius:999px;padding:2px 8px;white-space:nowrap}
#chBar .status{color:var(--muted);font-size:12px;margin-top:7px;padding-left:46px}
#chBar .status.big{font-size:13.5px;color:var(--bone);margin-top:0;padding-left:2px}
#chBar .status:empty{display:none}
#chBar .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-left:46px}
#chBar.m-run .chips{padding-left:0}
#chBar .chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:5px 12px;border-radius:999px;border:1px solid var(--line2);font-size:12.5px;color:var(--verd)}
#chBar .chip.jump{color:var(--brass);border-color:rgba(227,185,124,.55)}
#chBar .chip svg{width:16px;height:16px}
#chBar .knobs{display:grid;grid-template-columns:1.25fr 1fr;gap:8px}
#chBar .knob{display:flex;align-items:center;justify-content:space-between;height:54px;border-radius:15px;border:1px solid var(--line2);background:rgba(255,255,255,.025)}
#chBar .knob .iconbtn{width:42px;height:52px;border-radius:14px;color:var(--verd)}
#chBar .knob .chkv{flex:1;min-width:0;text-align:center;line-height:1.2}
#chBar .knob .kl{display:block;font-size:10.5px;color:var(--muted)}
#chBar .knob .val{display:block;font-size:15.5px;font-weight:500;color:#f3ead9;white-space:nowrap}
#chBar .knob .snap{display:block;font-size:12px;color:var(--verd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:17px}
#chBar .read{margin:9px 2px 2px;font-size:13px;min-height:19px;color:var(--bone)}
#chBar .read.good{color:var(--verd)}
#chBar .read.bad{color:var(--coral)}
#chBar .acts{display:flex;align-items:center;gap:6px;margin-top:8px}
#chBar .acts .sp,.chcard .acts .sp,#chBar .done-row .sp{flex:1}
#chBar .btn.fire{min-width:118px;min-height:44px;font-size:15px}
#chBar .schednote{margin:0 2px 8px;font-size:12px;color:var(--brass)}
#chBar .lasttag{font-size:11px;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:2px 8px}
#chBar .done-row{display:flex;align-items:center;gap:8px}
#chBar .done-row .bad{color:var(--coral);font-weight:500}
.chcard{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(max(8px,var(--sab)) + 66px);width:min(440px,calc(100vw - 16px));max-height:calc(100% - 150px - var(--sat) - var(--sab));overflow:auto;overscroll-behavior:contain;padding:18px 18px 14px;border-radius:20px;background:rgba(12,19,27,.95);border:1px solid var(--line2);box-shadow:0 20px 60px rgba(0,0,0,.6);z-index:36;animation:cardIn .24s ease-out}
body.roomy .chcard.brief{top:50%;bottom:auto;transform:translate(-50%,-50%);animation:fadeIn .2s ease-out}
body.short .chcard{bottom:auto;top:50%;transform:translate(-50%,-50%);max-height:calc(100% - 16px);animation:fadeIn .2s ease-out}
@keyframes cardIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
.chcard .lv{display:flex;align-items:center;gap:9px;color:var(--brass);font-size:12.5px;margin-bottom:8px}
.chcard .lv .badge{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(227,185,124,.6)}
.chcard .lv .badge svg{width:18px;height:18px}
.chcard h2{font-size:23px;font-weight:500;line-height:1.25}
.chcard .goal{font-size:14.5px;margin-top:4px;color:#f3ead9}
.chcard .story{color:var(--muted);font-size:13px;line-height:1.6;margin-top:10px}
.chcard .starlist{list-style:none;margin:12px 0 0;padding:10px 0 0;border-top:1px solid var(--line)}
.chcard .starlist li{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:12.5px;color:var(--bone)}
.chcard .starlist .stars{width:51px}
.chcard .best{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--brass)}
.chcard .hint{margin-top:12px;padding:9px 11px;border-radius:10px;background:rgba(143,224,204,.07);border-left:2px solid var(--verd);font-size:13px;line-height:1.55}
.chcard .acts{display:flex;align-items:center;gap:6px;margin-top:14px;flex-wrap:wrap}
.chcard .btn.on{color:var(--verd)}
.chcard.result{text-align:center}
.chcard.result>.stars{justify-content:center;gap:8px;margin:2px 0 8px}
.chcard.result>.stars svg{width:38px;height:38px;stroke-width:1.2}
.chcard.result h2{color:var(--brass)}
.chcard.result h2.bad{color:var(--coral)}
.chcard.result .metric{margin-top:6px;display:flex;align-items:baseline;justify-content:center;gap:8px;color:var(--muted)}
.chcard.result .metric b{font-size:19px;font-weight:500;color:#f3ead9}
.chcard.result .note{color:var(--muted);font-size:12.5px;margin-top:2px}
.chcard.result .why{font-size:14.5px;margin-top:6px}
.chcard.result .starlist,.chcard.result .fact,.chcard.result .hint{text-align:left}
.chcard.result .fact{color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
body.short #chBar{left:auto;right:max(8px,var(--sar));transform:none;bottom:max(8px,var(--sab));width:min(400px,52vw)}
body.short #chGoal{max-width:44vw}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---- probe cameras: a tray whose boxes are holes the renderer paints the pictures into ---- */
.win.pcam{background:none}
.win.pcam>.win-bar{background:linear-gradient(rgba(255,255,255,.05),rgba(255,255,255,.012)),rgba(11,18,26,.975)}
.pc-grid{position:relative;display:grid;grid-template-columns:repeat(3,1fr)}
.pc-grid.one{grid-template-columns:1fr}
.pc-slot{position:relative;aspect-ratio:4/3;cursor:pointer;outline:none;box-shadow:inset 0 0 0 1px rgba(5,8,13,.9),inset 0 0 0 2px rgba(196,216,230,.06)}
.pc-grid.one .pc-slot{width:100%;aspect-ratio:16/10;max-height:calc(100vh - 210px);cursor:grab;touch-action:none}
.pc-grid.one .pc-slot:active{cursor:grabbing}
.pc-slot:focus-visible{box-shadow:inset 0 0 0 2px var(--verd)}
@media (hover:hover){.pc-grid:not(.one) .pc-slot:hover{box-shadow:inset 0 0 0 1px rgba(5,8,13,.9),inset 0 0 0 2px rgba(143,224,204,.45)}}
.pc-lab{position:absolute;left:5px;top:5px;min-width:22px;padding:0 7px;border-radius:999px;background:rgba(5,8,13,.7);color:var(--bone);font-size:11.5px;line-height:19px;text-align:center;pointer-events:none}
.pc-foot{background:rgba(11,18,26,.975);border-top:1px solid var(--line);padding:6px 11px 8px}
.pc-note{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-dirs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin:0 -2px 6px;padding:0 2px}
.pc-dirs::-webkit-scrollbar{display:none}
.pc-dirs .chip{flex:none;min-height:30px;padding:0 11px;gap:5px;font-size:12.5px}
.pc-dirs .chip svg{width:15px;height:15px}
.pc-dirs .pc-all{color:var(--verd)}
.pc-lostmsg{display:none}
.win.pcam.lost .pc-slot{background:var(--pc-noise) 0 0/96px 96px;image-rendering:pixelated;animation:pcNoise .26s steps(3) infinite;cursor:default}
.win.pcam.lost .pc-lostmsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:rgba(5,8,13,.4);pointer-events:none;text-align:center;padding:0 12px}
.pc-lostmsg b{font-size:16px;font-weight:600;letter-spacing:.06em;color:#fff;text-shadow:0 1px 8px #000}
.pc-lostmsg span{font-size:12px;color:var(--bone);text-shadow:0 1px 5px #000}
@keyframes pcNoise{0%{background-position:0 0}33%{background-position:-37px 19px}67%{background-position:29px -41px}100%{background-position:11px 7px}}
@media (prefers-reduced-motion:reduce){.win.pcam.lost .pc-slot{animation:none}}

/* ---- window controls: minimise, full screen, pull from any side ---- */
.win-bar .iconbtn.win-min svg,.win-bar .iconbtn.win-full svg{width:17px;height:17px}
.win.w-sm .win-bar .iconbtn{width:34px;height:34px}
.win-rz{position:absolute;z-index:6;touch-action:none}
.rz-w{left:0;top:46px;bottom:26px;width:11px;cursor:ew-resize}
.rz-e{right:0;top:46px;bottom:28px;width:11px;cursor:ew-resize}
.rz-s{left:26px;right:28px;bottom:0;height:11px;cursor:ns-resize}
.rz-sw{left:0;bottom:0;width:26px;height:26px;cursor:nesw-resize}
.rz-sw::after{content:"";position:absolute;left:5px;bottom:5px;width:9px;height:9px;border-left:2px solid rgba(255,255,255,.3);border-bottom:2px solid rgba(255,255,255,.3);border-radius:0 0 0 4px}
.win.folded>.win-rz,.win.full>.win-rz,.win.full>.win-grip{display:none}
.win.viewport>.win-rz{z-index:7}
.win.minimized{display:none!important}
.win.full{border-radius:12px;animation:winFull .16s ease-out}
.win.full .win-bar{cursor:default}
.win.full .win-bar::before{display:none}
@keyframes winFull{from{opacity:.6;transform:scale(.97)}to{opacity:1;transform:none}}

/* ---- the dock: minimised windows wait down the left side ---- */
#windock{position:absolute;left:6px;display:flex;flex-direction:column;gap:7px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;z-index:4;padding:2px 2px 4px;pointer-events:auto}
#windock::-webkit-scrollbar{display:none}
#windock:empty{display:none}
#windock .dk{position:relative;display:flex;flex-direction:column;align-items:stretch;width:80px;padding:0;border-radius:12px;color:var(--bone);text-align:center;animation:dkIn .2s ease-out;flex:none}
#windock .dk-ic{display:grid;place-items:center;height:40px;border-radius:12px 12px 0 0;background:rgba(11,18,26,.94);border:1px solid var(--line2);border-bottom:0;color:var(--verd)}
#windock .dk-ic svg{width:21px;height:21px}
#windock .dk-ic .orb{width:20px;height:20px;margin:0}
#windock .dk-view{display:block;aspect-ratio:4/3;border-radius:12px 12px 0 0;border:1px solid var(--line2);border-bottom:0;box-shadow:inset 0 0 0 1px rgba(5,8,13,.85)}
#windock .dk-t{display:block;padding:3px 6px 4px;border-radius:0 0 12px 12px;background:rgba(11,18,26,.94);border:1px solid var(--line2);border-top:1px solid var(--line);font-size:11px;line-height:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#windock .dk:hover .dk-t,#windock .dk:focus-visible .dk-t{color:var(--verd)}
#windock .dk:focus-visible{outline:2px solid var(--verd);outline-offset:1px}
#windock .dk:active{transform:scale(.96)}
@keyframes dkIn{from{opacity:0;transform:translateX(-14px) scale(.9)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#windock .dk,.win.full{animation:none}}
body.clean #windock{display:none}

/* the probe cameras' pictures grow with a window given its own height (or full screen) */
.win.pcam.fixedh .pc-grid{flex:1;min-height:0;grid-template-rows:repeat(2,minmax(0,1fr))}
.win.pcam.fixedh .pc-grid.one{grid-template-rows:minmax(0,1fr)}
.win.pcam.fixedh.tall .pc-grid:not(.one){grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,minmax(0,1fr))}
.win.pcam.fixedh .pc-slot,.win.pcam.fixedh .pc-grid.one .pc-slot{aspect-ratio:auto;max-height:none;height:100%}
.pc-foot .pc-row{display:flex;align-items:center;gap:10px;min-width:0}
.pc-foot .pc-row .seg{flex:none;padding:2px}
.pc-foot .pc-row .seg button{min-height:28px;padding:0 10px;font-size:12px}
.pc-foot .pc-row .pc-note{flex:1;min-width:0}

</style>

<script>
(function(){
"use strict";
// ---- 00_util.js ----
// ============================================================================
// GRAVITY LAB — util: constants, vectors, formatting, rng
// ============================================================================
const G_SI = 6.67430e-11;
const AU = 1.495978707e11, DAY = 86400, HOUR = 3600, YEAR = 365.25 * DAY;
const M_SUN = 1.98841e30, M_EARTH = 5.97217e24, M_JUP = 1.89813e27, M_MOON = 7.34579e22;
const R_SUN = 6.9634e8, R_EARTH = 6.371008e6, R_JUP = 6.9911e7;
const LD = 3.844e8, C_LIGHT = 299792458, LY = 9.4607304725808e15;
const TAU = Math.PI * 2, DEG = Math.PI / 180;
const MODEL_VERSION = 1, SAVE_VERSION = 1;

const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);
const smoother = (t) => t * t * t * (t * (t * 6 - 15) + 10);
const isNum = (x) => typeof x === 'number' && Number.isFinite(x);

// ---- vec3 on plain arrays (allocating; not used in the integrator hot loop) ----
const V = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
  mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
  addmul: (a, b, s) => [a[0] + b[0] * s, a[1] + b[1] * s, a[2] + b[2] * s],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  len: (a) => Math.hypot(a[0], a[1], a[2]),
  len2: (a) => a[0] * a[0] + a[1] * a[1] + a[2] * a[2],
  dist: (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]),
  norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]); return l > 0 ? [a[0] / l, a[1] / l, a[2] / l] : [0, 0, 0]; },
  lerp: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t],
  copy: (a) => [a[0], a[1], a[2]],
  // any unit vector perpendicular to a
  perp: (a) => { const n = V.norm(a); const t = Math.abs(n[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0]; return V.norm(V.cross(t, n)); },
  finite: (a) => Array.isArray(a) && a.length === 3 && isNum(a[0]) && isNum(a[1]) && isNum(a[2]),
};

// ---- seeded rng (mulberry32); state is one uint32 so it serialises trivially ----
function rngNext(holder) {
  holder.seed = (holder.seed + 0x6D2B79F5) | 0;
  let t = Math.imul(holder.seed ^ (holder.seed >>> 15), 1 | holder.seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function newSeed() { return (Math.random() * 4294967296) >>> 0; }

let _uidCounter = 0;
function uid(prefix) {
  _uidCounter = (_uidCounter + 1) % 1e6;
  return (prefix || 'x') + Date.now().toString(36) + _uidCounter.toString(36) + Math.floor(Math.random() * 1296).toString(36);
}
function deepClone(o) { return o === undefined ? undefined : JSON.parse(JSON.stringify(o)); }

// ---- number formatting ----
function sig(x, n) {
  if (!isNum(x)) return '—';
  if (x === 0) return '0';
  n = n || 3;
  const a = Math.abs(x);
  if (a >= 1e7 || a < 1e-4) {
    const e = Math.floor(Math.log10(a));
    const m = x / Math.pow(10, e);
    return trimZeros(m.toFixed(Math.max(0, n - 1))) + '×10' + superscript(e);
  }
  const d = Math.max(0, n - 1 - Math.floor(Math.log10(a)));
  const s = x.toFixed(Math.min(d, 8));
  return a >= 1000 ? groupThousands(trimZeros(s)) : trimZeros(s);
}
function trimZeros(s) { return s.indexOf('.') >= 0 ? s.replace(/\.?0+$/, '') : s; }
function groupThousands(s) { const p = s.split('.'); p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ','); return p.join('.'); }
function superscript(e) { const m = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' }; return String(e).split('').map(c => m[c] || c).join(''); }

// ---- unit tables (value = SI factor) ----
const UNITS = {
  mass: { me: M_EARTH, ms: M_SUN, mj: M_JUP, mm: M_MOON, kg: 1 },
  dist: { km: 1e3, re: R_EARTH, ld: LD, au: AU, rs: R_SUN, m: 1, ly: LY },
  speed: { kms: 1e3, mps: 1 },
  time: { s: 1, min: 60, h: HOUR, d: DAY, y: YEAR },
};
const UNIT_LABEL = {
  me: ['地球質量', 'Earth masses', '地球質量'], ms: ['太陽質量', 'solar masses', '太陽質量'], mj: ['木星質量', 'Jupiter masses', '木星質量'],
  mm: ['月球質量', 'Moon masses', '月の質量'], kg: ['kg', 'kg', 'kg'],
  km: ['km', 'km', 'km'], re: ['地球半徑', 'Earth radii', '地球半径'], ld: ['地月距離', 'lunar distances', '地球‐月の距離'], au: ['AU', 'AU', 'AU'],
  rs: ['太陽半徑', 'solar radii', '太陽半径'], m: ['m', 'm', 'm'], ly: ['光年', 'light-years', '光年'],
  kms: ['km/s', 'km/s', 'km/s'], mps: ['m/s', 'm/s', 'm/s'],
  s: ['秒', 's', '秒'], min: ['分', 'min', '分'], h: ['小時', 'h', '時間'], d: ['日', 'days', '日'], y: ['年', 'years', '年'],
  x: ['倍（目前）', '× current', '倍（現在）'],
};

// ---- 05_i18n.js ----
// ============================================================================
// i18n — three languages. Strings are [繁中, English, 日本語].
// ============================================================================
const LANGS = ['zh', 'en', 'ja'];
const LANG_NAMES = ['繁體中文', 'English', '日本語'];
const LANG_HTML = ['zh-Hant', 'en', 'ja'];
let LANG = 0;
const STR = {};
function addStrings(o) { for (const k in o) STR[k] = o[k]; }
function pickLang(arr) { return Array.isArray(arr) ? (arr[LANG] != null ? arr[LANG] : arr[0]) : arr; }
// T('key', {name:'x'}) → localized string with {name} replaced
function T(key, vars) {
  let s = STR[key];
  if (s === undefined) return key;
  s = pickLang(s);
  if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
  return s;
}
function unitLabel(u) { return pickLang(UNIT_LABEL[u] || [u, u, u]); }

addStrings({
  u_year: ['年', 'yr', '年'], u_day: ['天', 'd', '日'], u_hour: ['時', 'h', '時間'], u_min: ['分', 'min', '分'], u_sec: ['秒', 's', '秒'],
  u_kyr: ['千年', 'kyr', '千年'], u_wan: ['萬年', '×10⁴ yr', '万年'], u_myr: ['百萬年', 'Myr', '百万年'], u_gyr: ['億年', '×10⁸ yr', '億年'],
  per_sec: ['/秒', '/s', '/秒'],
});

// ---- quantity formatting (auto unit) ----
function fmtMass(kg) {
  if (!isNum(kg)) return '—';
  const a = Math.abs(kg);
  if (a === 0) return '0';
  if (a >= 0.05 * M_SUN) return sig(kg / M_SUN, 3) + ' M☉';
  if (a >= 1e-4 * M_EARTH) return sig(kg / M_EARTH, 3) + ' M⊕';
  return sig(kg, 3) + ' kg';
}
function fmtDist(m) {
  if (!isNum(m)) return '—';
  const a = Math.abs(m);
  if (a >= 0.1 * LY) return sig(m / LY, 3) + ' ' + unitLabel('ly');
  if (a >= 0.01 * AU) return sig(m / AU, 3) + ' AU';
  if (a >= 1000) return sig(m / 1000, 3) + ' km';
  return sig(m, 3) + ' m';
}
function fmtSpeed(v) {
  if (!isNum(v)) return '—';
  const a = Math.abs(v);
  if (a >= 100 || a === 0) return sig(v / 1000, 3) + ' km/s';
  return sig(v, 3) + ' m/s';
}
// elapsed time, two most significant units
function fmtTime(s) {
  if (!isNum(s)) return '—';
  const neg = s < 0; s = Math.abs(s);
  let out;
  const y = s / YEAR;
  if (y >= 1e8) out = sig(y / 1e8, 3) + ' ' + T('u_gyr');
  else if (y >= 1e6) out = sig(y / 1e6, 3) + ' ' + T('u_myr');
  else if (y >= 1e4) out = LANG === 1 ? sig(y / 1e3, 3) + ' kyr' : sig(y / 1e4, 3) + ' ' + T('u_wan');
  else if (y >= 100) out = Math.floor(y).toLocaleString('en-US') + ' ' + T('u_year');
  else if (y >= 1) { const yi = Math.floor(y), d = Math.floor((s - yi * YEAR) / DAY); out = yi + ' ' + T('u_year') + ' ' + d + ' ' + T('u_day'); }
  else if (s >= DAY) { const d = Math.floor(s / DAY), h = Math.floor((s - d * DAY) / HOUR); out = d + ' ' + T('u_day') + ' ' + h + ' ' + T('u_hour'); }
  else if (s >= HOUR) { const h = Math.floor(s / HOUR), m = Math.floor((s - h * HOUR) / 60); out = h + ' ' + T('u_hour') + ' ' + m + ' ' + T('u_min'); }
  else if (s >= 60) { const m = Math.floor(s / 60); out = m + ' ' + T('u_min') + ' ' + Math.floor(s - m * 60) + ' ' + T('u_sec'); }
  else out = sig(s, 3) + ' ' + T('u_sec');
  return (neg ? '−' : '') + out;
}
// a duration as a single unit (for rates): 86400 → "1 日"
function fmtSpan(s) {
  if (!isNum(s)) return '—';
  const a = Math.abs(s);
  if (a >= YEAR * 0.999) return sig(s / YEAR, 3) + ' ' + T('u_year');
  if (a >= DAY * 0.999) return sig(s / DAY, 3) + ' ' + T('u_day');
  if (a >= HOUR * 0.999) return sig(s / HOUR, 3) + ' ' + T('u_hour');
  if (a >= 59.99) return sig(s / 60, 3) + ' ' + T('u_min');
  return sig(s, 3) + ' ' + T('u_sec');
}
function fmtRate(simPerSec) { return fmtSpan(simPerSec) + T('per_sec'); }

// blackbody-ish colour for a star temperature (K) → [r,g,b] 0..1 (display approximation)
function tempColor(T) {
  const t = clamp(T, 1800, 40000) / 100;
  let r, g, b;
  r = t <= 66 ? 255 : 329.698727446 * Math.pow(t - 60, -0.1332047592);
  g = t <= 66 ? 99.4708025861 * Math.log(t) - 161.1195681661 : 288.1221695283 * Math.pow(t - 60, -0.0755148492);
  b = t >= 66 ? 255 : t <= 19 ? 0 : 138.5177312231 * Math.log(t - 10) - 305.0447927307;
  return [clamp(r, 0, 255) / 255, clamp(g, 0, 255) / 255, clamp(b, 0, 255) / 255];
}
function hexToRgb(h) {
  if (Array.isArray(h)) return h;
  const s = String(h || '#888888').replace('#', '');
  const n = parseInt(s.length === 3 ? s.split('').map(c => c + c).join('') : s, 16);
  return [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
}
function rgbToHex(c) { return '#' + c.map(x => ('0' + Math.round(clamp(x, 0, 1) * 255).toString(16)).slice(-2)).join(''); }

// ---- 25_blocks.js ----
// ============================================================================
// Blocks — the "laws of your universe" language: definitions + interpreter.
//
// program = { scripts:[ {id, tag:'AB'|'A'|'B', off, hat:block|null, body:[block], expr:block|null} ], vars:[name],
//             procs:[ {id, name, params:[{t:'num'|'body', n}]} ], lists:[name] }
// block   = { id, op, a:{arg: literal | block}, sub:[block], sub2:[block] }
// Scripts run in simulation time. Each universe keeps its own runtime (u.rt).
// Two layers share this one language: the basic blocks, and the advanced ones (26_blocks_adv.js, `adv: true`) that open

const BLOCKS = {};

  ['body', ['天體', 'Bodies', '天体']],
  ['world', ['宇宙', 'Universe', '宇宙']],
  ['control', ['控制', 'Control', '制御']],
  ['value', ['數值', 'Values', '数値']],
  ['cond', ['條件', 'Conditions', '条件']],
  ['var', ['變數', 'Variables', '変数']],

defBlock('b_mass', 'body', 'stack', ['把 %b 的質量設為 %n %u', 'set mass of %b to %n %u', '%b の質量を %n %u にする'],
  { b: A_BODY, n: aNum(2), u: aUnit('mass', 'x', true) }, {
  run(cx, a) {
    const b = bkBody(cx, a.b); if (!b) return;
    const n = bkNum(cx, a.n), old = b.m, val = a.u === 'x' ? old * n : n * UNIT_FACTOR[a.u];
    if (!isNum(val) || val < 0) return;

    b.m = val; if (visOf(b).vis === 'bh') b.r = Math.max(1, schwarzschildRadius(val));

  } });
defBlock('b_massramp', 'body', 'stack', ['把 %b 的質量在 %t %tu 內慢慢變成 %n %u', 'change mass of %b to %n %u over %t %tu', '%b の質量を %t %tu かけて %n %u にする'],
  { b: A_BODY, t: aNum(20), tu: aUnit('time', 'y'), n: aNum(0.4), u: aUnit('mass', 'x', true) }, {
  run(cx, a) {
    const b = bkBody(cx, a.b); if (!b) return;
    const n = bkNum(cx, a.n), to = a.u === 'x' ? b.m * n : n * UNIT_FACTOR[a.u], dur = Math.max(0, bkNum(cx, a.t) * UNIT_FACTOR[a.tu]);
    if (!isNum(to) || to < 0) return;
    cx.u.tweens = cx.u.tweens.filter(tw => !(tw.id === b.id && tw.prop === 'm'));
    if (dur <= 0) { const old = b.m; b.m = to; cx.u.dirty(); bkLog(cx, { type: 'set', id: b.id, prop: 'm', from: old, to }); return; }
    cx.u.tweens.push({ id: b.id, prop: 'm', from: b.m, to, t0: cx.u.t, t1: cx.u.t + dur });
    bkLog(cx, { type: 'ramp', id: b.id, prop: 'm', from: b.m, to, dur });
  } });

defBlock('b_speed', 'body', 'stack', ['把 %b 的速度設為 %n %u', 'set speed of %b to %n %u', '%b の速さを %n %u にする'],

const PUSH_DIRS = [['fwd', ['前進方向', 'forward', '進行方向']], ['back', ['後退方向', 'backward', '逆方向']], ['out', ['遠離母天體', 'away from its primary', '主星から外へ']],

defBlock('b_push', 'body', 'stack', ['推 %b 一下：%n %u 往 %dir', 'push %b by %n %u %dir', '%b を %dir に %n %u 押す'],
  { b: A_BODY, n: aNum(1), u: aUnit('speed', 'kms'), dir: aEnum(PUSH_DIRS) }, {
  run(cx, a) {
    const b = bkBody(cx, a.b); if (!b || b.pin) return;
    const dv = bkNum(cx, a.n) * UNIT_FACTOR[a.u]; if (!isNum(dv)) return;
    const par = cx.u.parentOf(b);
    let d = null;
    if (a.dir === 'up') d = [0, 1, 0]; else if (a.dir === 'down') d = [0, -1, 0];
    else if (a.dir === 'out' || a.dir === 'in') { if (par) d = V.mul(V.norm(V.sub(b.p, par.p)), a.dir === 'out' ? 1 : -1); }
    else { const rel = V.sub(b.v, par ? (par.pin ? [0, 0, 0] : par.v) : [0, 0, 0]); if (V.len(rel) > 0) d = V.mul(V.norm(rel), a.dir === 'fwd' ? 1 : -1); }
    if (!d) return;
    b.v = V.addmul(b.v, d, dv); cx.u.dirty(); bkLog(cx, { type: 'push', id: b.id, dv });
  } });
defBlock('b_pushto', 'body', 'stack', ['推 %b 一下：%n %u %way %c', 'push %b by %n %u %way %c', '%b を %c %way %n %u 押す'],

const BECOME_KINDS = [['bh', ['黑洞', 'a black hole', 'ブラックホール']], ['ns', ['中子星', 'a neutron star', '中性子星']], ['star', ['恆星', 'a star', '恒星']],
  ['rock', ['岩石天體', 'a rocky body', '岩石天体']], ['gas', ['氣體行星', 'a gas giant', 'ガス惑星']]];
function becomeKind(u, b, kind) {
  const keep = bodyName(b), m = Math.abs(b.m);
  if (kind === 'bh') { b.key = 'blackhole'; b.r = Math.max(1, schwarzschildRadius(m)); }
  else if (kind === 'ns') { b.key = 'neutronstar'; b.r = 1.2e4; }
  else if (kind === 'star') { b.key = 'custom_star'; const ms = Math.max(0.05, m / M_SUN); b.r = R_SUN * Math.pow(ms, 0.8); b.vo = { temp: clamp(5772 * Math.pow(ms, 0.55), 2400, 30000), lum: Math.pow(ms, 3.5) }; }
  else if (kind === 'gas') { b.key = 'custom_gas'; b.r = R_JUP * clamp(Math.pow(Math.max(m, 1e20) / M_JUP, 0.12), 0.25, 1.3); }
  else { b.key = 'custom_rock'; b.r = Math.max(10, Math.cbrt(3 * Math.max(m, 1) / (4 * Math.PI * 5000))); }
  if (kind !== 'star') b.vo = null;
  b.repel = false; b.name = keep; u.dirty();
}
defBlock('b_become', 'body', 'stack', ['把 %b 變成 %k（質量不變）', 'turn %b into %k (same mass)', '%b を %k に変える（質量はそのまま）'], { b: A_BODY, k: aEnum(BECOME_KINDS) }, {
  run(cx, a) { const b = bkBody(cx, a.b); if (!b) return; becomeKind(cx.u, b, a.k); bkLog(cx, { type: 'become', id: b.id, kind: a.k }); } });
defBlock('b_add', 'body', 'stack', ['在離 %b %n %u 的地方加入 %k（圓軌道）', 'add %k orbiting %b at %n %u', '%b から %n %u の所に %k を加える（円軌道）'],
  { b: A_BODY, n: aNum(1), u: aUnit('dist', 'au'), k: { t: 'kind', d: 'earth' } }, {
  run(cx, a) {

    const ang = cx.u.rand() * TAU, p = V.add(b.p, [Math.cos(ang) * d, 0, -Math.sin(ang) * d]);
    const nb = cx.u.addBody({ key: a.k, p, origin: 'block' }); if (!nb) return;
    nb.v = cx.u.circularVelocity(p, nb.m, b, [0, 1, 0]); cx.u.dirty();
    if (cx.th) cx.th.made = nb.id;
    bkLog(cx, { type: 'add', id: nb.id, name: bodyName(nb) });
  } });

defBlock('b_bounce', 'body', 'stack', ['讓 %b 從 %c 彈開', 'bounce %b off %c', '%b を %c から跳ね返す'], { b: A_BODY, c: A_BODY }, {
  run(cx, a) {
    const b = bkBody(cx, a.b), c = bkBody(cx, a.c); if (!b || !c || b === c) return;
    const n = V.norm(V.sub(b.p, c.p)), vb = b.pin ? [0, 0, 0] : b.v, vc = c.pin ? [0, 0, 0] : c.v;
    const vn = V.dot(V.sub(vb, vc), n); if (!(vn < 0)) return;
    let mb = Math.abs(b.m), mc = Math.abs(c.m);
    if (b.pin) mb = Infinity; if (c.pin) mc = Infinity;
    let fb, fc;
    if (mb === Infinity) { fb = 0; fc = 2; } else if (mc === Infinity || mb + mc === 0 || mb === 0) { fb = 2; fc = 0; }
    else if (mc === 0) { fb = 0; fc = 2; } else { fb = 2 * mc / (mb + mc); fc = 2 * mb / (mb + mc); }
    if (!b.pin) b.v = V.addmul(b.v, n, -fb * vn);
    if (!c.pin) c.v = V.addmul(c.v, n, fc * vn);
    cx.u.markHandled(b.id, c.id);       // this script decided the outcome; the universe's own collision rule stays out of it
    cx.u.dirty(); bkLog(cx, { type: 'bounce', id: b.id, off: c.id });
  } });
defBlock('b_pin', 'body', 'stack', ['把 %b %mode', '%mode %b', '%b を %mode'], { b: A_BODY, mode: aEnum([['pin', ['固定在原地', 'pin in place', 'その場に固定する']], ['free', ['放開', 'release', '解放する']]]) }, {

defBlock('b_grav', 'body', 'stack', ['把 %b 的引力 %sw', 'turn gravity of %b %sw', '%b の重力を %sw'], { b: A_BODY, sw: aEnum([['off', ['關掉', 'off', 'オフにする']], ['on', ['打開', 'on', 'オンにする']]]) }, {

function launchProbe(u, from, dir, speed, opts) {
  opts = opts || {};
  const key = opts.key || 'probe', c = CATALOG[key];
  const r = isNum(opts.r) ? opts.r : c.r;

  const nb = u.addBody({ key, m: isNum(opts.m) ? opts.m : c.m, r, p, v: V.addmul(from.pin ? [0, 0, 0] : from.v, dir, speed), origin: 'launch', name: opts.name });
  return nb;
}
defBlock('b_launch', 'body', 'stack', ['從 %b 朝 %c 發射探測器，速度 %n km/s', 'launch a probe from %b toward %c at %n km/s', '%b から %c へ探査機を発射（%n km/s）'],

function mkBlock(op, a, sub, sub2) { const b = newBlock(op, a); if (sub) b.sub = sub; if (sub2) b.sub2 = sub2; return b; }

function moonStateAt(days, mu) {
  const L = 218.316 + 13.176396 * days, wbar = 83.353 + 0.1114036 * days, Om = 125.044 - 0.0529538 * days;
  const st = keplerState(mu, 3.844e8, 0.0549, 5.145 * DEG, Om * DEG, (wbar - Om) * DEG, (((L - wbar) % 360 + 360) % 360) * DEG);

}

// Sun + chosen planets at their approximate real positions for a date
function buildSolar(u, opts) {
  opts = opts || {};
  const days = isNum(opts.days) ? opts.days : j2000Days(Date.now());
  const planets = opts.planets || ['mercury', 'venus', 'earth', 'mars', 'jupiter', 'saturn', 'uranus', 'neptune'];
  const sun = u.addBody({ key: 'sun', origin: 'template' });
  const out = { sun };
  for (const key of planets) {
    const c = CATALOG[key];
    const fam = key === 'earth' && opts.moon !== false ? CATALOG.moon.m : 0;
    const st = catalogHelioState(key, days, G_SI * (sun.m + c.m + fam));
    const b = u.addBody({ key, p: st.r, v: st.v, origin: 'template' });
    out[key] = b;
    if (key === 'earth') {
      b.spin0 = gmstRad(days);
      if (opts.moon !== false) {
        const ms = moonStateAt(days, G_SI * (c.m + CATALOG.moon.m)), f = CATALOG.moon.m / (c.m + CATALOG.moon.m);
        b.p = V.addmul(b.p, ms.r, -f); b.v = V.addmul(b.v, ms.v, -f);
        const moon = u.addBody({ key: 'moon', p: V.add(b.p, ms.r), v: V.add(b.v, ms.v), origin: 'template' });
        moon.spinH = TAU * Math.sqrt(Math.pow(3.844e8, 3) / (G_SI * (c.m + CATALOG.moon.m))) / HOUR;

    }
  }
  for (const key of (opts.moons || [])) {
    const par = out[CATALOG[key].orbit.p]; if (!par) continue;
    const m = addCatalogChild(u, key, par); if (m) { out[key] = m; if (CATALOG[key].sync) faceParent(m, par); }
  }
  u.recenter();
  return out;
}
function starProps(ms) { return { r: R_SUN * Math.pow(ms, ms < 1 ? 0.9 : 0.7), temp: clamp(5772 * Math.pow(ms, 0.55), 2400, 30000), lum: Math.pow(ms, 3.5) }; }

  const sp = starProps(ms);

}
const ROCK_COLS = [['#b08d6e', '#6e5847'], ['#9a8f86', '#5d554f'], ['#c2a27c', '#7c6248'], ['#8fa0a8', '#566269'], ['#b3705a', '#6f4336'], ['#a9a58f', '#676452']];
const GAS_COLS = [['#d2b48c', '#9a7450'], ['#c9d6e3', '#7f96b0'], ['#e0c9a0', '#b58e63'], ['#9ec7d6', '#5d8fa6'], ['#d99a7a', '#9a5a44'], ['#b9b0d9', '#7a70a8']];
function buildRandomSystem(u, opts) {
  opts = opts || {};
  const R = () => u.rand();
  const ms = [0.35, 0.6, 0.8, 1.0, 1.0, 1.3, 1.8][Math.floor(R() * 7)];
  const starName = pickLang(['主星', 'Star', '主星']);
  const stars = [];
  if (opts.binary) {
    const m2 = ms * (0.4 + 0.5 * R()), a = (0.25 + 0.35 * R()) * AU, mu = G_SI * (ms + m2) * M_SUN, st = keplerState(mu, a, 0.1 + 0.25 * R(), 0, 0, 0, R() * TAU);
    const r = eclToWorld(st.r), v = eclToWorld(st.v), f = m2 / (ms + m2);
