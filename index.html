    stars.push(addStar(u, starName + ' B', m2, V.mul(r, 1 - f), V.mul(v, 1 - f)));
  } else stars.push(addStar(u, starName, ms, [0, 0, 0], [0, 0, 0]));

  const snow = 2.7 * AU * Math.sqrt(lum);
  let a = (opts.binary ? 2.2 : 0.28 + 0.25 * R()) * AU * Math.max(0.6, Math.sqrt(lum));
  const n = 3 + Math.floor(R() * 5), letters = 'bcdefghij';
  for (let i = 0; i < n; i++) {
    const giant = a > snow * (0.7 + 0.5 * R());
    const ice = !giant && a > snow * 1.6;
    const key = giant ? 'custom_gas' : ice ? 'custom_ice' : 'custom_rock';
    const m = giant ? M_EARTH * Math.pow(10, 1.1 + 1.7 * R()) : M_EARTH * Math.pow(10, -1.2 + 1.9 * R());
    const r = giant ? R_JUP * clamp(Math.pow(m / M_JUP, 0.25), 0.3, 1.2) : R_EARTH * Math.pow(m / M_EARTH, 0.28);
    const cols = (giant ? GAS_COLS : ROCK_COLS)[Math.floor(R() * 6)];
    const st = keplerState(G_SI * (Mtot + m), a, 0.08 * R() * R(), 3 * DEG * R(), R() * TAU, R() * TAU, R() * TAU);
    const vo = { col: cols[0], col2: cols[1] };

    if (!giant && !ice && m > 0.3 * M_EARTH && a > 0.6 * AU * Math.sqrt(lum) && a < 1.8 * AU * Math.sqrt(lum)) { vo.vis = 'rock'; vo.atm = { c: [0.4, 0.6, 1.0], k: 0.7 }; }

    if (giant && R() < 0.6 && b) {

        const am = b.r * (6 + 9 * k + 6 * R()), mm = M_MOON * (0.2 + 1.5 * R()), ph = R() * TAU;

// throwaway-world helpers used to construct encounters by running time backwards (gravity is time-reversible)
function runWorld(w, T) { let rem = T; while (rem > 0) { const dt = Math.min(rem, w.idealDt()); w.step(dt); rem -= dt; } }

defTemplate('x_capture', (s) => {

defTemplate('x_impact', (s) => {

  const w = scratchWorld(), E = w.addBody({ key: 'earth', origin: 'template' });

defTemplate('x_roche', (s) => {
  // the Moon on a circle a little outside its Roche limit; B brakes it so that every lap dips inside
  const u = s.A, E = u.addBody({ key: 'earth', origin: 'template' });
  const lim = ROCHE_K * CATALOG.moon.r * Math.cbrt(E.m / CATALOG.moon.m), d = 1.15 * lim;
  const M = u.addBody({ key: 'moon', p: [d, 0, 0], origin: 'template' });
  M.v = u.circularVelocity(M.p, M.m, E, [0, 1, 0]);
  M.spinH = TAU * Math.sqrt(d * d * d / (G_SI * (E.m + M.m))) / HOUR; faceParent(M, E); M.tilt = 6.68;
  u.recenter();
  s.program.scripts.push(mkScript('B', mkBlock('ev_start'), [mkBlock('b_push', { b: M.id, n: 0.48, u: 'kms', dir: 'back' })]));
  // inside the limit time runs slower, so the pieces can be seen coming off
  const km = Math.round(lim / 1e5) * 100;
  s.program.scripts.push(mkScript('AB', mkBlock('ev_dist', { a: M.id, b: E.id, cmp: 'lt', n: km, u: 'km' }), [mkBlock('w_warp', { n: 20, u: 'min' })]));
  s.program.scripts.push(mkScript('AB', mkBlock('ev_dist', { a: M.id, b: E.id, cmp: 'gt', n: km, u: 'km' }), [mkBlock('w_warp', { n: 1, u: 'h' })]));
  return { follow: E.id, dist: 1.45e8, pitch: 1.08, yaw: 0.3, warp: HOUR, fork: true, compare: [M.id, E.id] };
});

function createSessionFromTemplate(key, name) {
  const tpl = TEMPLATES[key] || TEMPLATES.blank;
  const s = new Session();
  s.template = tpl.key;
  const cfg = tpl.build(s) || {};
  s.name = name || T('tpl_' + tpl.key);
  s.warp = cfg.warp || DAY;
  s.cam = { follow: cfg.follow || null, dist: cfg.dist || 3 * AU, yaw: isNum(cfg.yaw) ? cfg.yaw : 0.5, pitch: isNum(cfg.pitch) ? cfg.pitch : 0.9, target: [0, 0, 0] };
  indexProgram(s.program);
  s.genesis = { t: s.A.t, A: s.A.serialize() };
  if (cfg.fork) { s.B = s.A.clone(); s.B.idp = 'c'; s.viewMode = 'split'; s.active = 'B'; }
  if (cfg.compare) { s.compare.body = cfg.compare[0]; s.compare.ref = cfg.compare[1]; }
  s.origin = s.capture();
  s.dirty = true;
  return s;
}

// ---- 36_challenges.js ----
// ============================================================================
// Challenges: ten levels with a goal that is checked automatically, a limited
// tool (launch, push or place, used once or twice), and one to three stars.
// Every level was solved with this same engine before its stars were set
// (tests/t_challenges.cjs replays a solution for each).
// This file holds the rules; 61_challenge_ui.js is the interface.
//
// A level says: how its world is built, which tools the player gets, how to judge every step (watch), how fast time should
// run at each moment (warp: it slows down where something is about to happen), where the camera should look (view), and
// which body the predicted path is measured against (focus).
// ============================================================================
const CHALLENGES = {}, CHALLENGE_ORDER = [];
function defChallenge(key, d) { d.key = key; CHALLENGES[key] = d; CHALLENGE_ORDER.push(key); }

// ---- numbers as a challenge shows them: as many digits as one step of the fine-tune buttons needs ----------------------------
function chDigits(step, unit) { return Math.max(0, Math.ceil(-Math.log10(step / unit) - 1e-9)); }
function chSpeed(v, step) {
  if (!isNum(v)) return '—';
  const a = Math.abs(v), s = step > 0 ? step : a >= 1000 ? 10 : a >= 100 ? 1 : a >= 10 ? 0.1 : 0.01;
  if (a >= 999.5) return (v / 1000).toFixed(clamp(chDigits(s, 1000), 1, 3)) + ' km/s';
  return v.toFixed(clamp(chDigits(s, 1), 0, 3)) + ' m/s';
}
function chKm(m) { if (!isNum(m)) return '—'; const k = m / 1000; return (Math.abs(k) >= 100 ? Math.round(k).toLocaleString('en-US') : k.toFixed(Math.abs(k) >= 10 ? 1 : 2)) + ' km'; }
function chNum(x, d) { return isNum(x) ? x.toFixed(d) : '—'; }

// One attempt at one level: builds the world into a fresh session, applies the player's actions (fire), watches every
// step (watch) and decides the result. Reset starts the same level again from its first state.
class ChallengeRun {
  constructor(key) {
    this.key = key; this.def = CHALLENGES[key]; this.attempt = 1;
    if (!this.def) throw new Error('no such challenge: ' + key);
  }
  create(name) {
    const s = new Session(), d = this.def;
    s.template = 'ch:' + this.key; s.ephemeral = true; s.challenge = this; this.s = s; this.ids = {};
    const cfg = d.build(this, s) || {};
    this.cfg = cfg;
    s.name = name || this.key; s.warp = cfg.warp || DAY;
    s.cam = { follow: cfg.follow || null, dist: cfg.dist || 3 * AU, yaw: isNum(cfg.yaw) ? cfg.yaw : 0.5, pitch: isNum(cfg.pitch) ? cfg.pitch : 0.9, target: cfg.target || [0, 0, 0] };
    indexProgram(s.program);
    for (const u of s.universes()) { u.log = []; u.notes = []; u.hits = []; }
    s.genesis = { t: s.A.t, A: s.A.serialize() };
    s.origin = s.capture();
    s.dirty = false;
    s.watch = (u, notes) => this.watch(u, notes);
    this.begin();
    return s;
  }
  // a fresh attempt: the tools are full again, nothing has been decided
  begin() {
    this._tools = this.def.tools(this);
    this.st = {}; this.tool = 0; this.left = (this._tools[0] || {}).n || 0; this.result = null; this.t0 = null; this.tFire = null;
    this.sum = { launch: 0, push: 0, all: 0 }; this.fired = []; this.lastBody = null; this.sched = null;
    if (this.def.start) this.def.start(this);
    this.planStop();
  }
  // A push planned while the braking point is still ahead waits for it: it is kept relative to where the body will be
  // (along its way around the reference body, outward from it, and across the plane) and made the moment the body gets
  // there, inside the same step that lands on that time.
  frameAt(r, n) { const Rh = V.norm(V.sub(r, V.mul(n, V.dot(r, n)))); return { R: Rh, H: V.norm(V.cross(n, Rh)) }; }
  schedule(dir, speed, n) {
    const t = this.current(); if (!t || !t.stop || this.stopT === null || this.stopHit || !this.coast || !(speed > 0)) return false;
    const fr = this.frameAt(this.coast.at, n);
    this.sched = { speed, n: V.copy(n), loc: [V.dot(dir, fr.H), V.dot(dir, fr.R), V.dot(dir, n)], ti: this.tool };
    if (this.s.stopAt == null && this.U().t < this.stopT) this.s.stopAt = this.stopT;
    return true;
  }
  // the direction a scheduled push points in, for a body at relative position r
  schedDir(sc, r) { const fr = this.frameAt(r, sc.n); return V.norm(V.add(V.add(V.mul(fr.H, sc.loc[0]), V.mul(fr.R, sc.loc[1])), V.mul(sc.n, sc.loc[2]))); }
  fireScheduled() {
    const sc = this.sched, t = this.current(); this.sched = null; if (!sc || !t || sc.ti !== this.tool) return null;
    const b = this.toolBody(t), ref = t.snapRef ? this.U().byId(this.ids[t.snapRef]) : null; if (!b || !ref) return null;
    const out = this.fire({ dir: this.schedDir(sc, V.sub(b.p, ref.p)), speed: sc.speed });
    if (out) this.fired[this.fired.length - 1].sched = true;
    return out;
  }
  // A tool marked stop: 'peri' or 'apex' does not ask the player to catch the right moment. The coming path of the body it
  // works on is run ahead in a copy of the world, and time will stop by itself exactly where that body comes closest to
  // (or farthest from) the reference body: the braking point, drawn on the path before it is reached.
  planStop() {
    this.stopT = null; this.coast = null; this.stopHit = false;
    if (this.s) this.s.stopAt = null;
    const t = this.current(); if (!t || !t.stop || !this.s) return;
    const u = this.U(), b = this.toolBody(t), ref = t.snapRef ? u.byId(this.ids[t.snapRef]) : null; if (!b || !ref) return;
    const w = Universe.deserialize(u.serialize()); w.rt = null; w.log = [];
    const B = w.byId(b.id), F = w.byId(ref.id), H = t.coast || DAY, peri = t.stop === 'peri';
    const pts = [V.sub(B.p, F.p)], hist = []; let tt = 0, n = 0, best = -1;
    while (tt < H && n < 30000) {
      const dt = Math.min(w.idealDt(), H - tt, H / 600); if (!(dt > 0)) break;
      w.step(dt); w.settle(); tt += dt; n++;
      if (!w.byId(B.id)) break;
      const rel = V.sub(B.p, F.p), d = V.len(rel), last = pts[pts.length - 1];
      hist.push([u.t + tt, d, rel, V.sub(B.v, F.pin ? [0, 0, 0] : F.v)]);
      if (best < 0 || (peri ? d < hist[best][1] : d > hist[best][1])) best = hist.length - 1;
      if (V.dist(rel, last) > 0.012 * Math.max(V.len(rel), V.len(last), 1) || V.dot(V.norm(rel), V.norm(last)) < 0.9993) pts.push(rel);
      if (peri && best >= 0 && d > 8 * hist[best][1] && hist.length - best > 20) break;       // well on its way out again
    }
    if (best < 1 || best >= hist.length - 1) return;        // no turning point ahead within reach
    pts.push(hist[hist.length - 1][2]);
    // the turning point between two samples: the top of a parabola through the three around it
    const [t0, d0] = hist[best - 1], [t1, d1, r1] = hist[best], [t2, d2] = hist[best + 1], den = (t0 - t1) * (t0 - t2) * (t1 - t2);
    let ts = t1;
    if (den !== 0) { const A = (t2 * (d1 - d0) + t1 * (d0 - d2) + t0 * (d2 - d1)) / den, Bq = (t2 * t2 * (d0 - d1) + t1 * t1 * (d2 - d0) + t0 * t0 * (d1 - d2)) / den; if (A !== 0) ts = clamp(-Bq / (2 * A), t0, t2); }
    this.stopT = ts; this.coast = { pts, at: r1, atV: hist[best][3], t: ts, kind: t.stop, ref: ref.id, body: b.id };
    this.s.stopAt = ts;
  }
  reset() {
    const s = this.s; s.pause(); s.restoreState(s.origin); s.history = []; s.redo = null; s.warp = this.cfg.warp || DAY;
    this.attempt++; this.begin();
  }
  U() { return this.s.A; }
  body(name) { return this.s.A.byId(this.ids[name]); }
  tools() { return this._tools || (this._tools = this.def.tools(this)); }
  // the tool in hand, or null when every action of this attempt is used up
  current() { const t = this.tools()[this.tool]; return t && this.left > 0 && !this.result ? t : null; }
  // the body a tool works from (launch) or on (push); null for place
  toolBody(t) {
    if (!t) return null;
    const u = this.U(), id = t.type === 'launch' ? this.ids[t.from] : t.type === 'push' ? (t.target === 'launched' ? (this.lastBody && this.lastBody.id) : this.ids[t.target]) : null;
    return id ? u.byId(id) : null;
  }
  // What an action would add to a world (the real one or a copy for the predicted path): a new body, or a change of velocity.
  // a: { dir, speed } for launch/push, { p, v } for place.
  applyTo(u, t, a) {
    if (t.type === 'launch') {
      const from = u.byId(this.ids[t.from]); if (!from) return null;
      const r = t.mass > 0 ? Math.max(10, Math.cbrt(3 * t.mass / (4 * Math.PI * 3000))) : CATALOG.probe.r, dir = V.norm(a.dir);
      return u.addBody({ key: t.mass > 0 ? 'rock' : 'probe', m: t.mass || 0, r, p: V.addmul(from.p, dir, from.r * 1.02 + r), v: V.addmul(from.pin ? [0, 0, 0] : from.v, dir, a.speed), origin: 'launch', name: t.name || pickLang(['探測器', 'Probe', '探査機']) });
    }
    if (t.type === 'push') {
      const id = t.target === 'launched' ? (this.lastBody && this.lastBody.id) : this.ids[t.target], b = id ? u.byId(id) : null; if (!b) return null;
      b.v = V.addmul(b.v, V.norm(a.dir), a.speed); u.dirty();
      return b;
    }
    if (t.type === 'place') return u.addBody(Object.assign({}, t.spec, { p: V.copy(a.p), v: V.copy(a.v), origin: 'placed' }));
    return null;
  }
  // apply one action for real. Returns the body it made or moved.
  fire(a) {
    const t = this.current(); if (!t) return null;
    const u = this.U(), b = this.applyTo(u, t, a); if (!b) return null;
    if (t.type === 'launch') { this.sum.launch += a.speed; this.sum.all += a.speed; }
    else if (t.type === 'push') { this.sum.push += a.speed; this.sum.all += a.speed; u.logEvent({ type: 'push', id: b.id, dv: a.speed, auto: 0 }); }
    this.lastBody = b; this.fired.push({ type: t.type, id: b.id, speed: a.speed || 0, t: u.t, dir: a.dir ? V.copy(a.dir) : null, p: a.p ? V.copy(a.p) : null, v: a.v ? V.copy(a.v) : null });
    if (this.t0 === null) this.t0 = u.t;
    this.tFire = u.t;
    if (--this.left <= 0) { this.tool++; this.left = (this.tools()[this.tool] || {}).n || 0; }
    if (this.def.fired) this.def.fired(this, t, b, a);
    this.planStop();         // the next tool may have its own braking point
    return b;
  }
  // after every step, with the collisions and break-ups that step produced
  watch(u, notes) {
    if (this.result || u !== this.s.A) return;
    if (this.stopT !== null && !this.stopHit && u.t >= this.stopT - 1e-6) {
      this.stopHit = true;
      if (this.sched) this.fireScheduled();        // made right here; the next tool's own stop (if any) replaces this one
    }
    let r = this.def.watch ? this.def.watch(this, u, notes) : null;
    if (!r) {
      const lim = this.def.limit, t0 = this.def.limitFrom === 'start' ? 0 : this.t0;
      if (lim && t0 !== null && u.t - t0 >= lim) r = this.def.timeout ? this.def.timeout(this, u) : { fail: 'time' };
    }
    if (r) this.finish(r);
  }
  // r: { fail: reason } or { win: true, metric }
  finish(r) {
    if (this.result) return;
    const m = this.def.metric;
    if (r.win) {
      const val = isNum(r.metric) || r.metric === Infinity ? r.metric : (m && m.val ? m.val(this) : null);
      this.result = { ok: true, metric: val, stars: this.starsFor(val), t: this.U().t };
    } else this.result = { ok: false, reason: r.fail, arg: r.arg || null, metric: isNum(r.metric) ? r.metric : null, stars: 0, t: this.U().t };
    // the interface hears it with the other effects of this frame; time keeps going for a moment so the outcome can be seen
    this.s.fx.push({ type: 'decided', seen: true });
  }
  starsFor(val) {
    const m = this.def.metric; if (!m || !m.stars) return 1;
    const better = (x, th) => isNum(x) && (m.low ? x <= th * (1 + 1e-9) : x >= th * (1 - 1e-9));
    return 1 + (better(val, m.stars[0]) ? 1 : 0) + (better(val, m.stars[1]) ? 1 : 0);
  }
  // how fast time should run now (simulated seconds per real second), and where the camera should look
  warpNow() { const d = this.def, u = this.U(); return d.warp ? d.warp(this, u) : (this.cfg.warp || DAY); }
  viewNow() { const d = this.def; return d.view ? d.view(this, this.U()) : null; }
  // the body whose path is worth remembering between attempts
  actorId() { const d = this.def; if (d.actor) return d.actor(this); if (this.lastBody) return this.lastBody.id; const t = this.tools()[0], b = this.toolBody(t); return b ? b.id : null; }
}

// ---- small pieces shared by the levels -------------------------------------------------------------------------
// Earth and Moon on a circular orbit around their common centre, the Moon on +x and moving towards −z (counterclockwise from above)
function chEarthMoon(u) {
  const mu = G_SI * (M_EARTH + M_MOON), a = 3.844e8, v = Math.sqrt(mu / a), f = M_MOON / (M_EARTH + M_MOON);
  const e = u.addBody({ key: 'earth', p: [-a * f, 0, 0], v: [0, 0, v * f], origin: 'template' });
  const m = u.addBody({ key: 'moon', p: [a * (1 - f), 0, 0], v: [0, 0, -v * (1 - f)], origin: 'template' });
  m.spinH = TAU * Math.sqrt(a * a * a / mu) / HOUR; faceParent(m, e); m.tilt = 6.68;
  return { e, m };
}
// a direction in the system plane, counterclockwise from +x seen from above
function chDir(deg) { const r = deg * DEG; return [Math.cos(r), 0, -Math.sin(r)]; }
const chHitBy = (n, id) => !!(n.gone && n.gone.indexOf(id) >= 0);          // this body ended in that collision
function chOrbits(u, b, around) { const el = u.orbitOf(b, around); return el && el.bound && el.rp > around.r * 1.02 ? el : null; }
const chD = (u, i, j) => { const a = u.byId(i), b = u.byId(j); return a && b ? V.dist(a.p, b.p) : NaN; };
const chV = (u, i, j) => { const a = u.byId(i), b = u.byId(j); return a && b ? V.dist(a.pin ? [0, 0, 0] : a.v, b.pin ? [0, 0, 0] : b.v) : NaN; };
// moving away from the other body?
const chAway = (u, i, j) => { const a = u.byId(i), b = u.byId(j); return !!(a && b && V.dot(V.sub(a.p, b.p), V.sub(a.v, b.pin ? [0, 0, 0] : b.v)) > 0); };
// Time slowed to what the picture can show: a fixed share of the view's width per real second, at the speed the actor is
// going. Far out and slow it races; close in and fast it crawls.
function chGovern(dist, vrel, k, lo, hi) { return clamp(k * 0.828 * dist / Math.max(vrel, 1e-9), lo, hi); }

// ---- 1. Hit the Moon ---------------------------------------------------------------------------------------------
defChallenge('c_moon', {
  icon: 'rocket',
  build(R, s) { const o = chEarthMoon(s.A); R.ids.earth = o.e.id; R.ids.moon = o.m.id; return { follow: o.e.id, dist: 1.05e9, pitch: 1.12, yaw: 0.55, warp: 2 * HOUR }; },
  tools: () => [{ type: 'launch', from: 'earth', mass: 0, n: 1, vmin: 10600, vmax: 14000, curve: 1, vstep: 10, astep: 0.25, preview: 5 * DAY }],
  focus: (R) => R.ids.moon, rel: 'earth', limit: 6 * DAY,
  view: (R) => ({ follow: R.ids.earth, dist: 1.05e9 }),
  readout(R, pv) {
    if (pv.hit) return pv.hit.id === R.ids.moon ? { text: T('chp_hit_good', { name: pv.hit.other }), tone: 'good' } : { text: T(pv.hit.id === R.ids.earth ? 'chp_fall' : 'pred_hit', { name: pv.hit.other }), tone: 'bad' };
    return null;
  },
  watch(R, u, notes) {
    const p = R.lastBody; if (!p) return null;
    for (const n of notes) if (chHitBy(n, p.id)) return n.id === R.ids.moon ? { win: true } : { fail: n.id === R.ids.earth ? 'fell' : 'time' };
    const d = chD(u, p.id, R.ids.moon); if (!isNum(d)) return null;
    if (!(d >= R.st.dmin)) R.st.dmin = d;
    // past the Moon and getting farther: it is not coming back in time
    if (u.t - R.t0 > 0.5 * DAY && d > Math.max(2 * R.st.dmin, 1e8) && chAway(u, p.id, R.ids.moon)) return { fail: chAway(u, p.id, R.ids.earth) ? 'time' : 'fell' };
    return null;
  },
  start(R) { R.st.dmin = Infinity; },
  warp(R, u) { const p = R.lastBody; if (!p) return 2 * HOUR; const d = chD(u, p.id, R.ids.moon); return isNum(d) ? 3 * HOUR * clamp(d / 6e7, 0.15, 1) : 3 * HOUR; },

// ---- 2. Save the Earth: deflect an asteroid --------------------------------------------------------------------------

// ---- 3. Into orbit: launch, then a sideways push at the top ---------------------------------------------------------------
defChallenge('c_orbit', {

// ---- 4. Stop at Mars: one brake to stay in orbit -----------------------------------------------------------------------------
defChallenge('c_capture', {
  icon: 'planet',
  build(R, s) {
    const u = s.A, ma = u.addBody({ key: 'mars', p: [0, 0, 0], v: [0, 0, 0], origin: 'template' }), mu = G_SI * ma.m;
    // a hyperbola with periapsis 4000 km from the centre and 2.5 km/s at infinity, started 300 000 km out on the way in
    const rp = 4.0e6, vinf = 2500, d0 = 3.0e8, e = 1 + rp * vinf * vinf / mu, a = -mu / (vinf * vinf), p = a * (1 - e * e);
    const nu = -Math.acos((p / d0 - 1) / e), r = p / (1 + e * Math.cos(nu)), hh = Math.sqrt(mu * p);
    const vr = mu / hh * e * Math.sin(nu), vt = mu / hh * (1 + e * Math.cos(nu));
    const pr = u.addBody({ key: 'probe', m: 0, r: CATALOG.probe.r, name: pickLang(['探測器', 'Probe', '探査機']), p: [r * Math.cos(nu), 0, -r * Math.sin(nu)], v: [vr * Math.cos(nu) - vt * Math.sin(nu), 0, -(vr * Math.sin(nu) + vt * Math.cos(nu))], origin: 'template' });
    R.ids.mars = ma.id; R.ids.probe = pr.id;
    return { follow: ma.id, dist: 3.6 * d0, pitch: 1.2, yaw: 0.2, warp: HOUR };
  },
  tools: () => [{ type: 'push', target: 'probe', n: 1, vmax: 2500, curve: 2, vstep: 5, astep: 0.5, snaps: ['pro', 'retro', 'out', 'in'], snapRef: 'mars', preview: 5 * DAY, stop: 'peri', coast: 2.5 * DAY }],
  focus: (R) => R.ids.mars, rel: 'mars',
  readout(R, pv) {
    const m = R.body('mars'), el = pv.el0; if (!m || !el) return null;
    if (pv.hit || el.rp < m.r * 1.01) return { text: T('chp_crash_m'), tone: 'bad' };
    if (!el.bound) return { text: T('chp_escape'), tone: 'bad' };
    if (el.ra > 1.5e8) return { text: T('chp_escape'), tone: 'bad' };
    return { text: T('chp_cap_ok', { d: fmtDist(el.ra - m.r) }), tone: 'good' };
  },
  view(R, u) {
    const p = u.byId(R.ids.probe), m = u.byId(R.ids.mars); if (!p || !m) return { follow: R.ids.mars, dist: 5.2e8 };
    if (R.st.P) { const el = u.orbitOf(p, m); if (el && el.bound) return { follow: R.ids.mars, dist: clamp(2.4 * el.ra, 2e7, 1.1e9) }; }
    return { follow: R.ids.mars, dist: clamp(3.6 * V.dist(p.p, m.p), 1.6e7, 1.1e9) };
  },
  watch(R, u, notes) {
    const p = u.byId(R.ids.probe), m = u.byId(R.ids.mars);
    for (const n of notes) if (chHitBy(n, R.ids.probe)) return { fail: 'crash' };
    if (!p || !m) return { fail: 'crash' };
    if (!R.fired.length) return V.dist(p.p, m.p) > 3.3e8 && chAway(u, R.ids.probe, R.ids.mars) ? { fail: 'escape' } : null;
    if (!R.st.P) {
      // Mars and the probe alone: the orbit after the push says for sure what happens, but the verdict waits until it has
      // been seen (a probe pushed early is still on its way in)
      const el = u.orbitOf(p, m);
      if (el && el.bound && el.rp >= m.r * 1.01 && el.ra <= 1.5e8) { R.st.P = el.period; R.st.tEnd = u.t + Math.min(2 * el.period, 6 * DAY); }
      else if (el && el.rp < m.r * 1.01) return null;            // on its way down: the collision says so
      else return V.dist(p.p, m.p) > 1.5e8 && chAway(u, R.ids.probe, R.ids.mars) ? { fail: 'escape' } : null;
    }
    return u.t >= R.st.tEnd ? { win: true } : null;
  },
  warp(R, u) {
    if (R.st.P) return clamp(R.st.P / 4.5, 60, 8 * HOUR);
    const v = this.view(R, u); return chGovern(v.dist, chV(u, R.ids.probe, R.ids.mars), 0.2, 120, 10 * HOUR);
  },
  status(R, u) {
    const p = u.byId(R.ids.probe), m = u.byId(R.ids.mars); if (!p || !m) return '';
    if (R.st.P) { const laps = Math.min(2, 6 * DAY / R.st.P); return T('chs_laps_m', { n: chNum(clamp((u.t - R.st.tEnd) / R.st.P + laps, 0, laps), 1) }); }
    return T('chs_alt_m', { d: fmtDist(V.dist(p.p, m.p) - m.r) });

// ---- 5. Free return around the Moon -----------------------------------------------------------------------------------------------

  icon: 'return',
  build(R, s) { const o = chEarthMoon(s.A); R.ids.earth = o.e.id; R.ids.moon = o.m.id; return { follow: o.e.id, dist: 1.1e9, pitch: 1.12, yaw: 0.55, warp: 3 * HOUR }; },

    if (pv.home) return pv.fFar ? { text: T('chp_free_ok', { d: fmtDist(pv.fmin - m.r) }), tone: 'good' } : { text: T('chp_free_front'), tone: 'bad' };
    if (pv.short || (pv.hit && pv.hit.id === R.ids.earth)) return { text: T('chp_free_short'), tone: 'bad' };
    return pv.done ? { text: T('chp_noreturn', { d: fmtDist(pv.fmin - m.r) }), tone: 'bad' } : null;
  },
  // Round the Moon's far side (within 60 000 km of it), then come back within 20 000 km of Earth. Hitting Earth itself would
  // be a target a few metres per second wide, scattered over the map; coming back near it is a band you can find.
  watch(R, u, notes) {

    for (const n of notes) if (chHitBy(n, p.id)) return { fail: n.id === R.ids.moon ? 'moon' : n.id === R.ids.earth ? (R.st.after ? 'front' : 'fell') : 'time' };
    const P = u.byId(p.id); if (!m || !e || !P) return null;
    const d = V.dist(P.p, m.p), de = V.dist(P.p, e.p);
    if (!(d >= R.st.dmin)) { R.st.dmin = d; R.st.far = V.dot(V.sub(P.p, m.p), V.sub(m.p, e.p)) > 0; }
    if (!R.st.after && R.st.dmin < 6e7 && d > 1.5 * R.st.dmin) R.st.after = true;
    if (R.st.after && de < FREE_HOME) return R.st.far ? { win: true, metric: R.st.dmin - m.r } : { fail: 'front' };
    if (!R.st.after && u.t - R.t0 > 0.5 * DAY && de < FREE_HOME && !chAway(u, p.id, R.ids.earth)) return { fail: 'fell' };
    if (de > 1.4e9) return { fail: 'time' };        // flung far out: it will not be back in time
    return null;
  },
  pvStep(R, w, pv, b) {
    const m = w.byId(R.ids.moon), e = w.byId(R.ids.earth); if (!m || !e) return;

    if (!pv.after && pv.fmin < 6e7 && d > 1.5 * pv.fmin) pv.after = true;
    if (pv.after && de < FREE_HOME) { pv.home = true; pv.stop = true; }
    else if (!pv.after && pv.t > 0.5 * DAY && de < FREE_HOME) { pv.short = true; pv.stop = true; }
  },
  start(R) { R.st.dmin = Infinity; R.st.far = false; R.st.after = false; },
  warp(R, u) { const p = R.lastBody; if (!p) return 3 * HOUR; const d = chD(u, p.id, R.ids.moon); return isNum(d) ? 8 * HOUR * clamp(d / 5e7, 0.2, 1) : 8 * HOUR; },
  status(R, u) {
    const p = R.lastBody, m = u.byId(R.ids.moon), e = u.byId(R.ids.earth); if (!p || !m || !e || !u.byId(p.id)) return '';
    return T('chs_free', { e: fmtDist(Math.max(0, chD(u, p.id, R.ids.earth) - e.r)), m: fmtDist(Math.max(0, chD(u, p.id, R.ids.moon) - m.r)) });
  },

const FREE_HOME = 2e7;       // "back at Earth": within 20 000 km of its centre

// ---- 6. Birth of the Moon: a giant impact ---------------------------------------------------------------------------------------------
defChallenge('c_theia', {
  icon: 'impact',
  build(R, s) {
    const u = s.A, e = u.addBody({ key: 'earth', p: [0, 0, 0], v: [0, 0, 0], origin: 'template' });
    const th = u.addBody({ key: 'custom_rock', name: pickLang(['忒伊亞', 'Theia', 'テイア']), m: 6.42e23, r: 3.39e6, p: [6e7, 0, 0], v: [0, 0, 0], vo: { col: '#a8846a', col2: '#5e4636' }, spinH: 20, origin: 'template' });
    R.ids.earth = e.id; R.ids.theia = th.id;
    return { follow: e.id, dist: 2.1e8, pitch: 1.2, yaw: 0.4, warp: 20 * 60 };
  },
  tools: () => [{ type: 'push', target: 'theia', n: 1, vmax: 11000, curve: 1.5, vstep: 10, astep: 0.25, snaps: ['in', 'ccw', 'cw'], snapRef: 'earth', preview: 1.5 * DAY }],
  focus: (R) => R.ids.earth, rel: 'earth',
  view: (R) => ({ follow: R.ids.earth, dist: R.st.tHit ? 1.1e8 : 2.1e8 }),
  readout(R, pv) {
    if (pv.hit) return { text: T('pred_hit', { name: pv.hit.other }), tone: '' };
    if (pv.graze) return { text: T('pred_graze', { name: pv.graze.other }), tone: '' };
    return pv.done ? { text: T('chp_theia_miss'), tone: 'bad' } : null;
  },
  watch(R, u, notes) {
    for (const n of notes) if (!R.st.tHit && !n.minor && n.kind !== 'tear' && n.kind !== 'bounce' && (chHitBy(n, R.ids.theia) || n.a === R.st.name || n.b === R.st.name)) R.st.tHit = u.t;
    if (!R.st.tHit) {
      if (!R.fired.length) return null;
      // it will pass Earth by (or already did) and is on its way out
      const th = u.byId(R.ids.theia), e = u.byId(R.ids.earth); if (!th || !e) return null;
      // with only the two of them, their orbit around each other says for sure whether they will ever touch
      const el = u.orbitOf(th, e); if (!el) return null;
      const clear = el.rp > e.r + th.r, away = chAway(u, R.ids.theia, R.ids.earth);
      if ((clear && (u.t - R.t0 > 2 * HOUR || away)) || (!el.bound && away && u.t - R.t0 > 600)) return { fail: 'miss' };
      return null;
    }
    // once the pieces have settled (nothing left on its way back down), count what goes round Earth
    const age = u.t - R.st.tHit; if (age < 0.5 * DAY) return null;
    const r = chTheiaCount(u);
    if (r.pending && age < 2.5 * DAY) return null;
    if (r.survivor) return { fail: 'survived' };
    return r.mOrb > 0.01 * M_MOON ? { win: true, metric: r.mOrb / M_MOON } : { fail: 'none' };
  },
  start(R) { const th = R.body('theia'); R.st.name = th ? bodyName(th) : ''; R.st.tHit = 0; },
  warp(R, u) {
    if (R.st.tHit) return clamp(u.t - R.st.tHit, 120, 6 * HOUR);
    if (!R.fired.length) return 20 * 60;
    const d = chD(u, R.ids.theia, R.ids.earth); return isNum(d) ? clamp(3000 * d / 6e7, 120, 3000) : 3000;
  },
  status(R, u) {
    if (!R.st.tHit) { const e = u.byId(R.ids.earth), th = u.byId(R.ids.theia), d = chD(u, R.ids.theia, R.ids.earth); return isNum(d) && e && th ? T('chs_theia', { d: fmtDist(Math.max(0, d - e.r - th.r)) }) : ''; }
    return T('chs_debris', { m: chNum(chTheiaCount(u).mOrb / M_MOON, 2) });
  },
  metric: { low: false, stars: [0.15, 0.25], unit: 'num2', label: 'chm_mass', line: 'chl_mass' },
});
// what goes round the heaviest body (Earth, grown by the blow), whether anything other than debris is still about, and
// whether some piece is still on its way back down (then the count is not final yet)
function chTheiaCount(u) {
  if (!u.bodies.length) return { mOrb: 0, survivor: false, pending: false };
  const E = u.bodies.reduce((a, b) => (b.m > a.m ? b : a), u.bodies[0]); let mOrb = 0, survivor = false, pending = false;
  for (const b of u.bodies) {
    if (b === E) continue;
    if (!b.debris) survivor = true;
    const el = u.orbitOf(b, E); if (!el || !el.bound) continue;
    if (el.rp > E.r * 1.02) mOrb += b.m; else pending = true;
  }
  return { mOrb, survivor, pending };
}

// ---- 7. Tear the Moon apart in Earth's Roche limit ------------------------------------------------------------------------------------------
defChallenge('c_roche', {
  icon: 'roche',
  build(R, s) { const o = chEarthMoon(s.A); R.ids.earth = o.e.id; R.ids.moon = o.m.id; return { follow: o.e.id, dist: 1.0e9, pitch: 1.15, yaw: 0.55, warp: 4 * HOUR }; },
  ownRoche: true,
  rings(R, u) {
    const e = u.byId(R.ids.earth), m = u.byId(R.ids.moon); if (!e || !m) return [];
    const lim = ROCHE_K * m.r * Math.cbrt(e.m / m.m), inside = V.dist(m.p, e.p) < lim;
    return [{ c: e.p, r: lim, kind: 'roche', inside, label: T(inside ? 'roche_in' : 'roche_ring') }];
  },
  tools: () => [{ type: 'push', target: 'moon', n: 1, vmax: 1200, curve: 2, vstep: 2, astep: 0.25, snaps: ['pro', 'retro', 'out', 'in'], snapRef: 'earth', preview: 30 * DAY }],
  focus: (R) => R.ids.earth, rel: 'earth', limit: 30 * DAY,
  readout(R, pv) {
    if (pv.hit) return { text: T('pred_hit', { name: pv.hit.other }), tone: 'bad' };
    if (pv.torn) return { text: T('chp_torn', { t: fmtTime(pv.tornT) }), tone: 'good' };
    if (pv.tear) return { text: T('chp_tear'), tone: 'good' };
    const m = R.body('moon'), e = R.body('earth'); if (!m || !e || !pv.done) return null;
    return { text: T('chp_roche_out', { d: fmtDist(pv.fmin), lim: fmtDist(ROCHE_K * m.r * Math.cbrt(e.m / m.m)) }), tone: 'bad' };
  },
  view(R, u) { const d = chD(u, R.ids.moon, R.ids.earth); return { follow: R.ids.earth, dist: R.fired.length && isNum(d) ? clamp(3 * d, 6e7, 1e9) : 1e9 }; },
  watch(R, u, notes) {
    for (const n of notes) {
      const moonIn = chHitBy(n, R.ids.moon) || n.id === R.ids.moon;
      if (n.kind === 'tear' && n.id === R.ids.moon && R.st.torn === null) R.st.torn = u.t;
      else if (n.kind === 'roche' && chHitBy(n, R.ids.moon)) R.st.gone = u.t;
      else if (moonIn && (n.kind === 'merge' || n.kind === 'impact' || n.kind === 'shatter' || n.kind === 'graze') && (n.id === R.ids.earth || chHitBy(n, R.ids.earth) || n.b === R.st.earthName)) return { fail: 'crash' };
    }
    if (R.st.gone !== null && u.t - R.st.gone > 2 * DAY) return { win: true, metric: (R.st.gone - R.t0) / DAY };
    if (R.fired.length && R.st.gone === null) {
      // the first swing past Earth decides whether it ever gets inside: past its closest point and out again untouched
      const d = chD(u, R.ids.moon, R.ids.earth);
      if (isNum(d)) {
        if (d < R.st.dPrev) R.st.down = true;
        else if (R.st.down && d > R.st.dPrev && !R.st.peri) R.st.peri = R.st.dPrev;
        R.st.dPrev = d;
        if (R.st.peri && R.st.torn === null && d > Math.max(4e7, 2 * R.st.peri)) return { fail: 'whole' };
      }
    }
    return null;
  },
  timeout(R) { if (R.st.gone !== null) return { win: true, metric: (R.st.gone - R.t0) / DAY }; return R.st.torn !== null ? { win: true, metric: Infinity } : { fail: 'whole' }; },
  start(R) { R.st.torn = null; R.st.gone = null; R.st.dPrev = Infinity; R.st.down = false; R.st.peri = 0; const e = R.body('earth'), m = R.body('moon'); R.st.earthName = e ? bodyName(e) : ''; R.st.m0 = m ? m.m : M_MOON; },
  warp(R, u) { if (!R.fired.length) return 4 * HOUR; const d = chD(u, R.ids.moon, R.ids.earth); return isNum(d) ? clamp(1750 * Math.pow(d / 1.8e7, 2.5), 1750, 2.5 * DAY) : 6 * HOUR; },
  status(R, u) {
    const m = u.byId(R.ids.moon), e = u.byId(R.ids.earth);
    if (!m) return R.st.gone !== null ? T('chs_gone') : '';
    return T('chs_moonleft', { p: Math.round(100 * m.m / R.st.m0), d: e ? fmtDist(V.dist(m.p, e.p)) : '—' });
  },
  metric: { low: true, stars: [30, 15], unit: 'days', label: 'chm_days', line: 'chl_days' },
});

// ---- 8. Two suns: a planet around a binary star ---------------------------------------------------------------------------------------------------
const TAT_ZONE = [1.2 * AU, 1.8 * AU];
function chBinaryCentre(u, R) {
  const A = u.byId(R.ids.a), B = u.byId(R.ids.b); if (!A || !B) return null;
  const M = A.m + B.m; return { p: V.mul(V.add(V.mul(A.p, A.m), V.mul(B.p, B.m)), 1 / M), v: V.mul(V.add(V.mul(A.v, A.m), V.mul(B.v, B.m)), 1 / M), m: M };
}
defChallenge('c_tatooine', {
  icon: 'binary',
  build(R, s) {
    const u = s.A, m1 = 1.1, m2 = 0.7, a = 0.5 * AU, st = keplerState(G_SI * (m1 + m2) * M_SUN, a, 0.4, 0, 0, 0, 0.6);
    const r = eclToWorld(st.r), v = eclToWorld(st.v), f = m2 / (m1 + m2);
    const A = addStar(u, pickLang(['恆星 A', 'Star A', '恒星A']), m1, V.mul(r, -f), V.mul(v, -f));
    const B = addStar(u, pickLang(['恆星 B', 'Star B', '恒星B']), m2, V.mul(r, 1 - f), V.mul(v, 1 - f));
    u.recenter();
    R.ids.a = A.id; R.ids.b = B.id;
    return { dist: 6.2 * AU, pitch: 1.35, yaw: 0, warp: 2 * YEAR };
  },
  tools: () => [{ type: 'place', n: 1, zone: TAT_ZONE, rstep: 0.01 * AU, astep: 5, preview: 3 * YEAR,
    spec: { key: 'custom_rock', name: pickLang(['你的行星', 'Your planet', 'あなたの惑星']), m: M_EARTH, r: R_EARTH, vo: { col: '#5c8fb0', col2: '#3d6b47', vis: 'rock', atm: { c: [0.4, 0.6, 1.0], k: 0.7 } }, spinH: 24 } }],
  // a point in the plane gives a circular orbit around the centre of both stars, going round the same way they do
  placeAt(R, u, p) {
    const c = chBinaryCentre(u, R); if (!c) return null;
    const rel = V.sub(p, c.p); rel[1] = 0; const r = V.len(rel); if (!(r > 0)) return null;
    const A = u.byId(R.ids.a), hn = V.cross(V.sub(A.p, c.p), V.sub(A.v, c.v)), up = hn[1] >= 0 ? [0, 1, 0] : [0, -1, 0];
    const v = V.addmul(c.v, V.norm(V.cross(up, rel)), Math.sqrt(G_SI * (c.m + M_EARTH) / r));
    return { p: V.add(c.p, rel), v, r, c: c.p };
  },
  view: () => ({ follow: null, dist: 6.2 * AU }),
  // the predicted path keeps count of when it first leaves the zone
  pvStep(R, w, pv, b) {
    if (pv.out) return;
    const c = chBinaryCentre(w, R); if (!c) return;
    const d = V.dist(b.p, c.p); if (d < TAT_ZONE[0] || d > TAT_ZONE[1]) pv.out = pv.t || 1;
  },
  readout(R, pv) {
    if (pv.out || pv.hit) { const yrs = (pv.out || pv.t) / YEAR; return { text: T('chp_zone_out', { n: chNum(yrs, 1) }), tone: yrs < 3 ? 'bad' : '' }; }
    return pv.done ? { text: T('chp_zone_ok'), tone: 'good' } : null;
  },
  watch(R, u, notes) {
    const p = R.lastBody; if (!p) return null;
    const yrs = (u.t - R.t0) / YEAR;
    let out = notes.some(n => chHitBy(n, p.id));
    if (!out) { const c = chBinaryCentre(u, R), P = u.byId(p.id); if (!c || !P) out = true; else { const d = V.dist(P.p, c.p); out = d < TAT_ZONE[0] || d > TAT_ZONE[1]; } }
    if (out) return yrs >= 3 ? { win: true, metric: yrs } : { fail: 'short', metric: yrs };
    return yrs >= 40 ? { win: true, metric: 40 } : null;
  },
  rings(R, u) { const c = chBinaryCentre(u, R); return c ? [{ c: c.p, r: TAT_ZONE[0], r2: TAT_ZONE[1], kind: 'zone', label: T('ch_zone') }] : []; },
  status(R, u) { return R.lastBody ? T('chs_years', { n: chNum((u.t - R.t0) / YEAR, 1) }) : ''; },
  metric: { low: false, stars: [15, 40], unit: 'years', label: 'chm_years', line: 'chl_years' },
});

// ---- 9. Gravity slingshot past Jupiter, out of the Solar System ---------------------------------------------------------------------------------------
defChallenge('c_sling', {
  icon: 'sling',
  build(R, s) {
    const u = s.A, sun = u.addBody({ key: 'sun', p: [0, 0, 0], v: [0, 0, 0], origin: 'template' });
    const circ = (key, a, ph) => { const m = CATALOG[key].m, v = Math.sqrt(G_SI * (sun.m + m) / a); return u.addBody({ key, p: V.mul(chDir(ph), a), v: V.mul(chDir(ph + 90), v), origin: 'template' }); };
    const e = circ('earth', AU, 0), j = circ('jupiter', 5.2026 * AU, 105);
    e.spin0 = 0; u.recenter();
    R.ids.sun = sun.id; R.ids.earth = e.id; R.ids.jupiter = j.id;
    return { dist: 15 * AU, pitch: 1.3, yaw: 0, warp: 0.5 * YEAR };
  },
  tools: () => [{ type: 'launch', from: 'earth', mass: 0, n: 1, vmin: 12000, vmax: 15500, curve: 1, vstep: 5, astep: 0.1, snaps: ['pro'], snapRef: 'sun', preview: 5 * YEAR }],
  focus: (R) => R.ids.jupiter, rel: 'sun', limit: 15 * YEAR,
  view: () => ({ follow: null, dist: 15 * AU }),
  pvStep(R, w, pv, b) {
    const S = w.byId(R.ids.sun); if (!S) return;
    const J = w.byId(R.ids.jupiter);
    if (J && pv.fT === pv.t) pv.jside = V.dot(V.sub(b.p, J.p), V.sub(J.v, S.v)) > 0 ? 'front' : 'back';      // at its closest to Jupiter, ahead of it or behind
    const r = V.dist(b.p, S.p); pv.rmax = Math.max(pv.rmax || 0, r);
    if (!pv.esc && r > 7 * AU && 0.5 * V.len2(V.sub(b.v, S.v)) - G_SI * S.m / r > 0) { pv.esc = true; pv.stop = true; }
  },
  readout(R, pv) {
    if (pv.hit) return { text: T('pred_hit', { name: pv.hit.other }), tone: 'bad' };
    if (pv.esc) return { text: T('chp_sling_ok') + (isFinite(pv.fmin) ? '　' + T('chp_jup', { d: fmtDist(pv.fmin) }) : ''), tone: 'good' };
    if (!pv.done) return null;
    const d = fmtDist(pv.fmin);
    return { text: !(pv.fmin < 0.5 * AU) ? T('chp_jfar', { d }) : T(pv.jside === 'front' ? 'chp_jfront' : 'chp_jback', { d }), tone: 'bad' };
  },
  watch(R, u, notes) {
    const p = R.lastBody; if (!p) return null;
    for (const n of notes) if (chHitBy(n, p.id)) return { fail: 'crash', arg: n.b };
    const P = u.byId(p.id), S = u.byId(R.ids.sun); if (!P || !S) return null;
    const r = V.dist(P.p, S.p), E = 0.5 * V.len2(V.sub(P.v, S.v)) - G_SI * S.m / r;
    if (E > 0 && r > 7 * AU) return { win: true };
    // bound to the Sun and already falling back towards it: it is not getting out
    if (E < 0 && u.t - R.t0 > 0.5 * YEAR && !chAway(u, p.id, R.ids.sun)) return { fail: 'stuck' };
    return null;
  },
  timeout: () => ({ fail: 'stuck' }),
  warp(R, u) { const p = R.lastBody; if (!p) return 0.5 * YEAR; const d = chD(u, p.id, R.ids.jupiter); return isNum(d) ? YEAR * clamp(d / (0.6 * AU), 0.12, 1) : YEAR; },
  status(R, u) { const p = R.lastBody; if (!p || !u.byId(p.id)) return ''; return T('chs_sling', { s: fmtDist(chD(u, p.id, R.ids.sun)), j: fmtDist(chD(u, p.id, R.ids.jupiter)) }); },
  metric: { val: (R) => R.sum.launch, low: true, stars: [15000, 14400], unit: 'speed', step: 5, label: 'chm_launch', line: 'chl_launch' },
});

// ---- 10. Skim a black hole ---------------------------------------------------------------------------------------------------------------------------------
defChallenge('c_bh', {
  icon: 'blackhole',
  build(R, s) {
    const u = s.A, bh = u.addBody({ key: 'blackhole', p: [0, 0, 0], v: [0, 0, 0], origin: 'template' });
    const pr = u.addBody({ key: 'probe', m: 0, r: CATALOG.probe.r, name: pickLang(['探測器', 'Probe', '探査機']), p: [0.05 * AU, 0, 0], v: [0, 0, 0], origin: 'template' });
    R.ids.bh = bh.id; R.ids.probe = pr.id;
    return { follow: bh.id, dist: 0.16 * AU, pitch: 1.3, yaw: 0, warp: 30 * 60 };
  },
  tools: () => [{ type: 'push', target: 'probe', n: 1, vmax: 20000, curve: 2, vstep: 10, astep: 0.5, snaps: ['ccw', 'cw', 'out', 'in'], snapRef: 'bh', preview: 2.5 * HOUR }],
  limit: 2 * DAY, rel: 'bh',
  readout(R, pv) { return pv.hit ? { text: T('pred_swallow', { name: pv.hit.other }), tone: 'bad' } : { text: T('chp_partial', { t: fmtSpan(2.5 * HOUR) }), tone: '' }; },
  view(R, u) { const d = chD(u, R.ids.probe, R.ids.bh); return { follow: R.ids.bh, dist: isNum(d) ? clamp(4.5 * d, 6e5, 0.16 * AU) : 0.16 * AU }; },
  watch(R, u, notes) {
    const bh = u.byId(R.ids.bh), Rs = bh ? schwarzschildRadius(bh.m) : 1;
    for (const n of notes) if (chHitBy(n, R.ids.probe)) return { fail: 'swallowed' };
    const p = u.byId(R.ids.probe); if (!p || !bh) return { fail: 'swallowed' };
    const d = V.dist(p.p, bh.p), r0 = 0.05 * AU;
    if (!(d >= R.st.dmin)) R.st.dmin = d;
    if (!R.fired.length) return null;
    if (R.st.dmin < 0.1 * r0 && d > 0.5 * r0) return R.st.dmin / Rs < 100 ? { win: true, metric: R.st.dmin / Rs } : { fail: 'far', metric: R.st.dmin / Rs };
    if (R.st.dmin >= 0.1 * r0 && u.t - R.t0 > 0.5 * DAY && d > 0.9 * r0) return { fail: 'far', metric: R.st.dmin / Rs };
    return null;
  },
  start(R) { R.st.dmin = Infinity; },
  // time slows to a crawl near the hole, so the swing can be seen
  warp(R, u) { if (!R.fired.length) return 30 * 60; const v = this.view(R, u); return chGovern(v.dist, chV(u, R.ids.probe, R.ids.bh), 0.3, 1e-4, 20000); },
  rings(R, u) {
    const bh = u.byId(R.ids.bh); if (!bh) return [];
    const Rs = schwarzschildRadius(bh.m);
    return [[100, 1], [10, 2], [2, 3]].map(([k, n]) => ({ c: bh.p, r: k * Rs, kind: 'star', n, label: '★'.repeat(n) + ' ' + T('ch_rs', { n: k }) }));
  },
  status(R, u) { const bh = u.byId(R.ids.bh), d = chD(u, R.ids.probe, R.ids.bh); return isNum(d) && bh ? T('chs_bh', { n: sig(d / schwarzschildRadius(bh.m), 3) }) : ''; },
  metric: { low: true, stars: [10, 2], unit: 'rs', label: 'chm_rs', line: 'chl_rs' },
});

// a metric as shown on the result card
function chMetricText(def, x) {
  const m = def.metric; if (!m) return '';
  if (x === Infinity) return '—';
  switch (m.unit) {
    case 'speed': return chSpeed(x, m.step);
    case 'km': return chKm(x);
    case 'days': return T('ch_ndays', { n: chNum(x, 1) });
    case 'years': return T('ch_nyears', { n: chNum(x, 1) });
    case 'rs': return T('ch_rs', { n: sig(x, 3) });
    default: return chNum(x, 2);
  }
}

  c_capture_g: ['探測器正飛過火星，推一下讓它留在軌道上', 'A probe is flying past Mars. One push to keep it in orbit', '火星を通過中の探査機を、ひと押しで軌道にとどめる'],
  c_capture_1: ['進入火星軌道', 'Enter orbit around Mars', '火星の周回軌道に入る'],
  c_capture_s: ['探測器太快了，什麼都不做就會掠過火星飛走。你可以推它一次。路徑上的 ◆ 是減速點（離火星最近的地方）：從 ◆ 拖出箭頭按「排定」，探測器到了就會自動推；或按 ▶，時間會在那裡停下讓你瞄。', 'The probe is too fast: left alone it swings past Mars and leaves. You can push it once. The ◆ on its path is the braking point, its closest point to Mars: drag an arrow out of the ◆ and press Schedule, and it pushes by itself when the probe gets there. Or press ▶ and time stops there for you to aim.', '探査機は速すぎて、何もしなければ火星をかすめて去ります。押せるのは1回だけ。経路上の ◆ が減速点（火星に最も近い所）：◆ から矢印を引き出して「予約」すると、探査機が来たとき自動で押します。▶ を押せば、そこで時間が止まって狙えます。'],
  c_capture_h: ['在離火星最近的那一點，往它運動的反方向推（箭頭會吸附到「逆著運動方向」），最省力。', 'Push backwards at the point closest to Mars (the arrow snaps to "against its motion"): that costs the least.', '火星に最も近い点で、進行方向と逆に押す（矢印は「進行方向と逆」に吸い付きます）のが最も効率的です。'],
  c_capture_f: ['在跑最快的地方減速最划算，這叫歐伯特效應。真正的火星探測器都是在離火星最近時點火入軌。', 'Braking where you are fastest pays off most: the Oberth effect. Real Mars probes fire their engines at their closest point to enter orbit.', '最も速い地点で減速するのが最も得。これをオーベルト効果と呼びます。実際の火星探査機も最接近点で噴射して軌道に入ります。'],
  c_capture_x_crash: ['探測器撞上火星了', 'The probe crashed into Mars', '探査機は火星に衝突しました'],
  c_capture_x_escape: ['探測器飛走了', 'The probe flew away', '探査機は飛び去りました'],

  c_free_t: ['繞月返航', 'Free return', '月を回って帰還'],
  c_free_g: ['發射探測器，繞到月球背面，再自己飛回地球', 'Launch a probe that swings behind the Moon and comes back to Earth on its own', '月の裏側を回り、ひとりでに地球へ戻る探査機を打ち上げる'],
  c_free_1: ['從月球背面繞回地球附近', 'Round the far side and back near Earth', '月の裏を回って地球の近くへ帰る'],
  c_free_s: ['阿波羅 13 號出事時，就是靠月球的引力把太空船甩回地球。繞過月球背面、再回到離地心 2 萬公里以內就算回家。速度差幾 m/s 結果就不同，慢慢微調。', 'When Apollo 13 got into trouble, the Moon\'s gravity flung the spacecraft back to Earth. Round the far side of the Moon and come back within 20,000 km of Earth to make it home. A few m/s make a difference: fine-tune slowly.', 'アポロ13号の事故では、月の引力が宇宙船を地球へ投げ返しました。月の裏を回り、地球中心から2万km以内に戻れば帰還成功。数 m/s で結果が変わるので、ゆっくり微調整を。'],
  c_free_h: ['速度大約 11.0 km/s。先找到會撞上月球的方向，再往月球前進的方向多轉一點，讓虛線從月球背後繞過去再回到地球。', 'About 11.0 km/s. First find a direction that hits the Moon, then turn a little further the way the Moon is moving, so the dashed line passes behind it and back to Earth.', '約11.0 km/s。まず月に当たる方向を見つけ、そこから月の進む方向へ少し回して、破線が月の裏を回って地球へ戻るように。'],
  c_free_f: ['這種軌道叫「自由返回軌道」：不必再點火就會回家。阿波羅 8、10、11 號一開始都走這種軌道。', 'This is a free-return trajectory: it comes home without another burn. Apollo 8, 10 and 11 all started out on one.', 'これは自由帰還軌道と呼ばれ、追加の噴射なしで帰れます。アポロ8・10・11号も最初はこの軌道でした。'],
  c_free_x_moon: ['撞上月球了', 'It hit the Moon', '月に衝突しました'],
  c_free_x_fell: ['沒繞到月球就回到地球了', 'It came back to Earth without reaching the Moon', '月に届かず地球に戻りました'],
  c_free_x_front: ['回到地球了，但是從月球前面繞過，不是背面', 'Back at Earth, but round the near side of the Moon, not the far side', '地球に戻ったが、月の裏ではなく手前側を通りました'],
  c_free_x_time: ['探測器沒有回到地球', 'The probe did not come back to Earth', '探査機は地球に戻りませんでした'],

  c_theia_t: ['月球誕生', 'Birth of the Moon', '月の誕生'],
  c_theia_g: ['把忒伊亞撞向地球，讓碎片留在軌道上', 'Smash Theia into Earth and leave debris in orbit', 'テイアを地球にぶつけ、破片を軌道に残す'],
  c_theia_1: ['撞出繞地球的碎片', 'Leave debris circling Earth', '地球を回る破片を残す'],
  c_theia_s: ['45 億年前，一顆火星大小的行星撞上地球，噴出的碎片後來聚成了月球。推忒伊亞一下，看你能讓多少碎片留在地球周圍。', '4.5 billion years ago a Mars-sized planet hit Earth, and the debris later gathered into the Moon. Push Theia and see how much debris you can leave circling Earth.', '45億年前、火星ほどの惑星が地球に衝突し、飛び散った破片が月になりました。テイアを押して、どれだけの破片を地球の周りに残せるか試そう。'],
  c_theia_h: ['正面撞上，碎片全都會掉回來。要又快又斜地撞上去（但不能只是擦過），碎片才會被甩進軌道。', 'Head-on, everything falls back. A fast, oblique blow (but not a mere graze) flings debris into orbit.', '正面衝突では破片は全部落ちます。速く斜めに（かすめるだけでなく）ぶつけると、破片が軌道へ放り出されます。'],
  c_theia_f: ['這個「大碰撞假說」能解釋為什麼月球岩石和地球地殼這麼像。這裡的碎片簡化成十來塊；真實的碰撞會先形成一整圈碎片盤，碎片要多上許多。', 'This giant-impact hypothesis explains why Moon rocks are so like Earth\'s crust. Here the debris is simplified to about a dozen pieces; a real impact first makes a whole disc of debris, with far more of it.', 'この「ジャイアント・インパクト説」は、月の岩石が地球の地殻とよく似ている理由を説明します。ここでは破片を十数個に簡略化しています。実際の衝突ではまず破片の円盤ができ、量もずっと多くなります。'],
  c_theia_x_miss: ['沒撞上地球', 'It missed Earth', '地球に当たりませんでした'],
  c_theia_x_none: ['碎片全都掉回地球或飛走了', 'All the debris fell back or flew away', '破片はすべて落ちるか飛び去りました'],
  c_theia_x_survived: ['忒伊亞只擦過去，沒有撞碎', 'Theia only grazed Earth and was not destroyed', 'テイアはかすめただけで、壊れませんでした'],

  c_roche_t: ['撕碎月球', 'Tear the Moon apart', '月を引き裂け'],
  c_roche_g: ['讓月球減速，掉進地球的洛希極限被撕碎，但不能撞上地球', 'Slow the Moon so it dives inside Earth\'s Roche limit and is torn apart, without hitting Earth', '月を減速させ、地球のロッシュ限界に落として引き裂く。ただし地球に衝突させない'],
  c_roche_1: ['被潮汐撕下碎片', 'Pieces torn off by the tides', '潮汐で破片がはがれる'],
  c_roche_s: ['在洛希極限裡面，地球拉月球近側和遠側的力量差，會比月球自己的引力還大。月球靠近時，鏡頭會拉近，地球周圍那一圈紅色虛線就是極限。', 'Inside the Roche limit, the difference in Earth\'s pull on the near and far side of the Moon is stronger than the Moon\'s own gravity. As the Moon closes in the camera follows, and the red dashed ring around Earth is the limit.', 'ロッシュ限界の内側では、地球が月の手前側と奥側を引く力の差が、月自身の重力より強くなります。月が近づくとカメラも寄り、地球の周りの赤い破線の輪がその限界です。'],
  c_roche_h: ['往月球運動的反方向推（箭頭會吸附到「逆著運動方向」），減速大約 0.8 km/s。越接近撞上地球的邊緣，撕得越快。', 'Push against the Moon\'s motion (the arrow snaps to "against its motion"), braking about 0.8 km/s. The closer to the edge of hitting Earth, the faster it is torn.', '月の進行方向と逆に押し（矢印は「進行方向と逆」に吸い付きます）、約0.8 km/s減速。地球に衝突するぎりぎりほど速く引き裂かれます。'],
  c_roche_f: ['土星環很可能就是一顆衛星太靠近土星、被潮汐撕碎後留下來的。', 'Saturn\'s rings may well be what is left of a moon that came too close and was torn apart by tides.', '土星の環は、土星に近づきすぎて潮汐で引き裂かれた衛星の名残かもしれません。'],
  c_roche_x_crash: ['月球撞上地球了', 'The Moon hit Earth', '月が地球に衝突しました'],
  c_roche_x_whole: ['月球沒有進到洛希極限裡', 'The Moon never got inside the Roche limit', '月はロッシュ限界の内側に入りませんでした'],

  c_tatooine_t: ['雙日行星', 'Two suns', '二つの太陽'],
  c_tatooine_g: ['放一顆行星，讓它待在綠色宜居帶裡，越久越好', 'Place a planet and keep it in the green habitable zone as long as possible', '惑星を置き、緑のハビタブルゾーンにできるだけ長くとどめる'],
  c_tatooine_1: ['待在宜居帶 3 年', '3 years in the zone', 'ゾーンに3年'],
  c_tatooine_s: ['兩顆恆星互相繞轉，拉力一直在變：太靠近會被甩來甩去，太遠又太冷。點一下綠色區域，行星會繞著兩顆星的中心走圓軌道；可以再微調距離。', 'The two stars circle each other, so their pull keeps changing: too close and the planet is thrown around, too far and it freezes. Tap in the green zone and the planet circles the centre of both stars; you can fine-tune the distance.', '2つの恒星が互いに回り、引力は絶えず変わります。近すぎると振り回され、遠すぎると凍えます。緑の領域をタップすると、惑星は2星の中心を円軌道で回ります。距離は微調整できます。'],
  c_tatooine_h: ['綠色區域內側、靠近雙星的地方不穩定。試試偏外側，但還在綠色裡的位置。', 'The inner part of the green zone, near the stars, is unstable. Try further out, still inside the green.', '緑のゾーンの内側、連星に近い所は不安定。外寄りの、まだ緑の中を試して。'],
  c_tatooine_f: ['克卜勒太空望遠鏡找到好幾顆真的繞著雙星轉的行星，例如 Kepler-16b。', 'The Kepler space telescope found several real planets that orbit two stars, such as Kepler-16b.', 'ケプラー宇宙望遠鏡は、実際に連星を回る惑星をいくつも見つけました。たとえばケプラー16b。'],
  c_tatooine_x_short: ['行星不到 3 年就離開宜居帶了', 'The planet left the zone in under 3 years', '惑星は3年もたたずにゾーンを出ました'],

  c_sling_t: ['重力彈弓', 'Gravity slingshot', 'スイングバイ'],
  c_sling_g: ['發射探測器，借木星的引力飛出太陽系', 'Launch a probe and use Jupiter\'s gravity to leave the Solar System', '探査機を打ち上げ、木星の引力を借りて太陽系を脱出する'],
  c_sling_1: ['飛出太陽系', 'Leave the Solar System', '太陽系を脱出'],
  c_sling_s: ['直接飛出太陽系要 16.6 km/s，你最多只有 15.5。讓探測器從木星後方擦過，木星會把一點自己的速度借給它。', 'Leaving the Solar System directly takes 16.6 km/s, and you have at most 15.5. Let the probe pass behind Jupiter, and Jupiter lends it some of its own speed.', '直接太陽系を出るには16.6 km/s必要ですが、最大15.5しかありません。探査機に木星の後ろ側をかすめさせると、木星が自分の速度を少し分けてくれます。'],
  c_sling_h: ['順著地球繞太陽的方向發射（箭頭會吸附），再稍微往外偏。用微調讓虛線從木星後方（它前進方向的背後）擦過。', 'Launch along Earth\'s motion around the Sun (the arrow snaps to it), then turn a little outwards. Fine-tune so the dashed path passes behind Jupiter (behind its direction of travel).', '地球の公転方向へ打ち上げ（矢印が吸い付きます）、少し外向きに。微調整で、破線が木星の後ろ（進行方向の背後）をかすめるように。'],
  c_sling_f: ['航海家 1 號和 2 號就是靠木星和土星的重力彈弓飛出太陽系，現在已經在星際空間裡了。', 'Voyager 1 and 2 left the Solar System using slingshots past Jupiter and Saturn, and are now in interstellar space.', 'ボイジャー1号と2号は木星と土星のスイングバイで太陽系を出て、今は星間空間にいます。'],
  c_sling_x_crash: ['撞上了{name}', 'It hit {name}', '{name} に衝突しました'],
  c_sling_x_stuck: ['探測器沒有飛出太陽系', 'The probe did not leave the Solar System', '探査機は太陽系を出られませんでした'],

  c_bh_t: ['黑洞擦邊', 'Skim a black hole', 'ブラックホールをかすめる'],
  c_bh_g: ['推探測器一下，盡量貼近黑洞擦過去，再飛回來', 'Push the probe so it skims as close to the black hole as it can and comes back', '探査機を押して、ブラックホールにできるだけ近くかすめさせ、戻ってこさせる'],
  c_bh_1: ['貼近到 100 倍史瓦西半徑以內', 'Within 100 Schwarzschild radii', 'シュヴァルツシルト半径の100倍以内'],
  c_bh_s: ['探測器靜止在黑洞旁，什麼都不做就會直直掉進去。往旁邊推，它會繞一個又細又長的彎回來：推得越小越貼近，太小就會掉進事件視界。虛線只畫出前面一段。', 'The probe hangs still beside the black hole: left alone it falls straight in. Push it sideways and it swings round in a long, thin loop. The smaller the push, the closer it passes, but too small and it falls through the event horizon. The dashed path shows only the first part.', '探査機はブラックホールの横で静止しています。何もしなければまっすぐ落ちます。横に押すと細長い弧を描いて戻ります。押す力が小さいほど近くを通りますが、小さすぎると事象の地平面に落ちます。破線は最初の一部だけ。'],
  c_bh_h: ['往旁邊推（箭頭會吸附到「水平」）1.2 到 1.6 km/s，可以擦過不到 2 倍史瓦西半徑。', 'A sideways push (the arrow snaps to "sideways") of 1.2 to 1.6 km/s passes within 2 Schwarzschild radii.', '横向き（矢印は「水平」に吸い付きます）に1.2〜1.6 km/s押すと、シュヴァルツシルト半径の2倍以内を通過します。'],
  c_bh_f: ['這裡用的是牛頓引力。真實的黑洞在 3 倍史瓦西半徑以內沒有穩定的軌道，到 1.5 倍時連光都會繞圈。', 'This uses Newtonian gravity. Around a real black hole there are no stable orbits within 3 Schwarzschild radii, and at 1.5 even light goes in circles.', 'ここではニュートン重力を使っています。本物のブラックホールでは、シュヴァルツシルト半径の3倍より内側に安定な軌道はなく、1.5倍では光さえ円を描きます。'],
  c_bh_x_swallowed: ['探測器掉進黑洞了', 'The probe fell into the black hole', '探査機はブラックホールに落ちました'],
  c_bh_x_far: ['離黑洞太遠了（超過 100 倍史瓦西半徑）', 'Too far from the black hole (more than 100 Schwarzschild radii)', 'ブラックホールから遠すぎました（シュヴァルツシルト半径の100倍以上）'],

// ---- which way a probe faces ------------------------------------------------------------------------------------------
// The body pulling hardest on it (a massless probe pulls on nothing, so this is always somebody else).
function craftPrimary(u, b) {
  let best = null, ba = 0;
  for (const o of u.bodies) {
    if (o === b || !(o.m > 0)) continue;
    const d2 = V.len2(V.sub(o.p, b.p)); if (!(d2 > 0)) continue;
    const a = o.m / d2; if (a > ba) { ba = a; best = o; }

}
// Front is exactly the way it flies (relative to that body); down is towards the body, as square to the flight as it can be;
// right completes the set. Straight-up or resting probes keep their last heading so the picture does not spin.
const CraftAtt = {
  map: new Map(),
  of(u, b, key) {
    const k = key || b.id, prev = this.map.get(k);
    // the same moment asked again (several pictures in one frame): the same answer; a push at a stopped moment changes v
    if (prev && prev.t === u.t && prev.p[0] === b.p[0] && prev.p[1] === b.p[1] && prev.p[2] === b.p[2] && prev.v[0] === b.v[0] && prev.v[1] === b.v[1] && prev.v[2] === b.v[2]) return prev;
    const P = craftPrimary(u, b);
    let vel = P ? V.sub(b.v, P.pin ? [0, 0, 0] : P.v) : V.copy(b.v), out = P ? V.sub(b.p, P.p) : null;
    const vl = V.len(vel);
    let f = vl > 1e-9 ? V.mul(vel, 1 / vl) : null;
    if (!f) f = prev ? V.copy(prev.f) : [1, 0, 0];
    let up = out ? V.sub(out, V.mul(f, V.dot(out, f))) : null;
    if (!up || V.len(up) < 1e-6 * Math.max(1, out ? V.len(out) : 1)) {
      // flying straight at it or away from it: keep the last up if it still makes sense, otherwise the world's
      up = prev ? V.sub(prev.up, V.mul(f, V.dot(prev.up, f))) : null;
      if (!up || V.len(up) < 1e-6) { up = V.sub([0, 1, 0], V.mul(f, f[1])); if (V.len(up) < 1e-6) up = V.perp(f); }
    }
    up = V.norm(up);
    const rt = V.norm(V.cross(f, up));
    const att = { t: u.t, p: V.copy(b.p), v: V.copy(b.v), f, up, rt, primary: P ? P.id : null };
    this.map.set(k, att);
    if (this.map.size > 64) this.map.delete(this.map.keys().next().value);
    return att;
  },
  // the six directions, as world vectors: front, back, left, right, up, down
  dirs(att) { return { f: att.f, b: V.mul(att.f, -1), l: V.mul(att.rt, -1), r: att.rt, u: att.up, d: V.mul(att.up, -1) }; },
};
// angle the wings turn about the model's Z axis so the cells (+Y) face the star; s = unit vector to the star, world
function craftWingAngle(att, s) {
  if (!s) return 0;
  const sx = V.dot(s, att.f), sy = V.dot(s, att.up);
  return Math.hypot(sx, sy) > 1e-6 ? Math.atan2(-sx, sy) : 0;
}

// ============================================================================
// Trails — the path each body actually took. Points are stored relative to the
// body's dominant ("parent") body at the time, so a moon draws a loop around
// its planet instead of a wavy line around the star. Only recorded positions
// are drawn: nothing is smoothed in or invented.
// ============================================================================
const TRAIL_LEN = { long: 720, mid: 360, short: 140, off: 0 };
const TRAIL_COS = Math.cos(2.5 * DEG);

class TrailStore {
  constructor() { this.map = new Map(); this.cap = TRAIL_LEN.mid; this.frame = 'parent'; this.rev = -1; this.parents = null; this.ghost = []; }
  clear() { this.map.clear(); this.ghost.length = 0; this.rev = -1; }
  setCap(n) { if (n !== this.cap) { this.cap = n; this.map.clear(); } }
  setFrame(f) { if (f !== this.frame) { this.frame = f; this.map.clear(); this.rev = -1; } }
  _trail(id) {
    let t = this.map.get(id);
    if (!t) { t = { p: new Float32Array(this.cap * 3), t: new Float64Array(this.cap), par: new Array(this.cap), n: 0, head: 0, ld: null, lr: 0, lp: null }; this.map.set(id, t); }
    return t;
  }
  _push(t, x, y, z, time, par) {
    const i = t.head; t.p[i * 3] = x; t.p[i * 3 + 1] = y; t.p[i * 3 + 2] = z; t.t[i] = time; t.par[i] = par;
    t.head = (i + 1) % this.cap; if (t.n < this.cap) t.n++;
  }
  // refresh the cached parent of every body (call once per frame or after edits)
  refreshParents(u) {
    const par = new Array(u.bodies.length);
    for (let i = 0; i < u.bodies.length; i++) { const p = this.frame === 'parent' ? u.parentOf(u.bodies[i]) : null; par[i] = p ? p : null; }
    this.parents = par; this.rev = u.rev; this.count = u.bodies.length; this.uref = u;
  }
  // called after every physics step: cheap test, adds a point when the body has turned or moved enough
  sample(u) {
    if (!this.cap) return;
    if (!this.parents || this.uref !== u || this.count !== u.bodies.length || this.rev !== u.rev) this.refreshParents(u);
    const bs = u.bodies, time = u.t;
    for (let i = 0; i < bs.length; i++) {
      const b = bs[i], par = this.parents[i], t = this.map.get(b.id) || this._trail(b.id);
      const x = par ? b.p[0] - par.p[0] : b.p[0], y = par ? b.p[1] - par.p[1] : b.p[1], z = par ? b.p[2] - par.p[2] : b.p[2];
      const pid = par ? par.id : null;
      if (!t.n || t.lpar !== pid) { this._push(t, x, y, z, time, pid); t.lx = x; t.ly = y; t.lz = z; t.lpar = pid; continue; }
      const dx = x - t.lx, dy = y - t.ly, dz = z - t.lz, moved2 = dx * dx + dy * dy + dz * dz;
      const r2 = x * x + y * y + z * z, l2 = t.lx * t.lx + t.ly * t.ly + t.lz * t.lz;
      let add;
      if (par) { const dot = x * t.lx + y * t.ly + z * t.lz; add = dot < TRAIL_COS * Math.sqrt(r2 * l2) || moved2 > 0.0016 * l2; }
      else { const s = Math.max(Math.sqrt(l2), b.r * 30); add = moved2 > 0.0009 * s * s; }
      if (add) { this._push(t, x, y, z, time, pid); t.lx = x; t.ly = y; t.lz = z; }
    }
  }
  // drop bodies that no longer exist
  prune(u) { for (const id of Array.from(this.map.keys())) if (!u.byId(id)) this.map.delete(id); }
  // forget everything recorded after time T (used by rewind). The discarded part becomes a frozen "ghost" reference.
  truncate(T, keepGhost) {
    if (keepGhost) this.ghost.length = 0;
    for (const [id, t] of this.map) {
      const pts = [];
      let n = t.n, first = (t.head - t.n + this.cap) % this.cap, keep = 0;
      for (let k = 0; k < n; k++) { const i = (first + k) % this.cap; if (t.t[i] <= T) keep = k + 1; else if (keepGhost) pts.push(t.p[i * 3], t.p[i * 3 + 1], t.p[i * 3 + 2], t.par[i]); }
      if (keepGhost && pts.length >= 8) {
        // start the ghost where the kept trail ends so it visibly branches off
        if (keep > 0) { const i = (first + keep - 1) % this.cap; pts.unshift(t.p[i * 3], t.p[i * 3 + 1], t.p[i * 3 + 2], t.par[i]); }
        this.ghost.push({ id, pts });
      }
      if (keep < n) {
        t.n = keep; t.head = (first + keep) % this.cap;
        if (keep > 0) { const i = (first + keep - 1) % this.cap; t.lx = t.p[i * 3]; t.ly = t.p[i * 3 + 1]; t.lz = t.p[i * 3 + 2]; t.lpar = t.par[i]; }
      }
    }
  }
}

// Nothing here changes physics.

const QUALITY = {

  // a hall that is mostly air: decaying noise, darker as it dies away
  _impulse(c, sec, decay) {

  // ---- building blocks of a voice --------------------------------------------------------------------------------
  _t() { return this.ctx.currentTime + 0.006; },
  // where a voice goes: a gain (returned) → left/right → effects bus, and `wet` of it into the reverb
  _out(pan, wet, gain) {
    const c = this.ctx, g = c.createGain(); g.gain.value = gain == null ? 1 : gain;
    let node = g;
    if (pan && c.createStereoPanner) { const p = c.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); g.connect(p); node = p; }
    node.connect(this.n.sfx);

  // a gain that rises to `peak` in `a` seconds, holds, then dies away over about `rel` seconds

  _env(to, t, a, peak, hold, rel) {

  // a source plays at least until the envelope it feeds has died away (to.end), so nothing is cut off while still audible
  _osc(type, f0, f1, t, dur, to, glide) {

  },
  _noiseSrc(t, dur, to, rate) {

  _filt(type, f, q, to) { const b = this.ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; if (q != null) b.Q.value = q; b.connect(to); b.end = to.end; return b; },

  _gate(key, ms) { const now = performance.now(); if (now - (this.cool[key] || 0) < ms) return false; this.cool[key] = now; return true; },

  // ---- the sounds ---------------------------------------------------------------------------------------------------
  // a blast: a falling thump, noise through a closing low-pass, a crack at the very start, a rumble for big ones,
  // and a patter of small pieces landing after it
  _boom(s, g, pan, o) {
    const c = this.ctx, t = this._t(), len = 0.4 + 2.4 * s;
    const out = this._out(pan, 0.22 + 0.4 * s, g);
    const sub = this._env(out, t, 0.004, 0.95, 0.02, 0.25 + 1.0 * s);
    this._osc('sine', 96 - 46 * s, 31 - 9 * s, t, sub.end - t, sub, 0.16 + 0.55 * s);
    const bg = this._env(out, t, 0.005, 0.6, 0.02 + 0.08 * s, 0.3 + 1.5 * s);

    this._noiseSrc(t, bg.end - t, lp, 1 - 0.45 * s);

  },
  // short clicks of noise scattered in time: pieces landing, cracks, crumbling
  _patter(t0, span, n, g, pan, f0, f1) {
    const c = this.ctx, out = this._out(pan, 0.3, g);

  },
  // a soft merge: a low thump and a muffled whump
  _thud(s, g, pan) {
    const t = this._t(), out = this._out(pan, 0.2 + 0.25 * s, g);

  },
  // two bodies scraping past each other: a whoosh that falls in pitch and crosses the stereo field
  _scrape(s, g, pan, dust) {
    const c = this.ctx, t = this._t(), dur = 0.5 + 1.0 * s, out = this._out(pan, 0.3, g);
    let to = out;

  },
  // a black hole takes something: a pitch that falls and swells, cut off at the horizon, then a deep drop
  _swallow(s, g, pan) {
    const t = this._t(), dur = 1.0 + 0.9 * s, out = this._out(pan, 0.55, g), cut = t + dur * 0.86;
    const sw = this.ctx.createGain(); sw.connect(out);

  },
  // tides pulling a body apart: a slow groan with a wobble, and crumbling
  _creak(s, g, pan, last) {
    const c = this.ctx, t = this._t(), dur = 1.1 + 0.9 * s, out = this._out(pan, 0.45, g);
    const e = this._env(out, t, 0.25, 0.42, dur * 0.4, 0.7);

  },
  // a neutron star grows too heavy: everything rushes inward, then a deep blow and silence
  _collapse(g, pan) {
    const t = this._t(), out = this._out(pan, 0.5, g), dur = 0.9;
    const sw = this.ctx.createGain(); sw.connect(out);
    sw.gain.setValueAtTime(0.0001, t); sw.gain.exponentialRampToValueAtTime(0.6, t + dur); sw.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.02);

  },
  // billiard balls: a short rubbery bonk
  _bonk(s, g, pan) {

    this._osc('sine', f, f * 0.45, t, 0.25, this._env(out, t, 0.002, 0.6, 0, 0.14 + 0.1 * s), 0.09);
    this._osc('triangle', f * 2.4, f * 1.1, t, 0.15, this._env(out, t, 0.001, 0.18, 0, 0.06));

  },
  // a probe is lost: a click, a little static, and a falling 'signal lost'
  _lost(g, pan) {
    const t = this._t(), out = this._out(pan, 0.25, g);
    this._noiseSrc(t, 0.12, this._filt('highpass', 2200, 0.7, this._env(out, t, 0.0008, 0.35, 0.02, 0.06)));
    [1046.5, 784, 523.25].forEach((f, i) => { const ti = t + 0.09 + i * 0.11; this._osc('sine', f, f, ti, 0.12, this._env(out, ti, 0.004, 0.16, 0.04, 0.05)); });
  },
  // a small, distant crackle: a fragment falling back, another round of tidal stripping
  _tick(g, pan) { this._patter(this._t(), 0.12, 3, g * 1.6, pan, 1200, 4800); },

  // ---- events from the simulation ----------------------------------------------------------------------------------
  // f: a collision note (see 22_collide.js); ear: { pan, near } from App.earOf (near: 0 tiny or off screen … 1 fills it)
  impact(f, ear) {
    if (!this.live()) return;

    const e = f.e > 0 ? clamp((Math.log10(f.e) - 15) / 21, 0, 1) : 0;          // 10¹⁵ J (a big rock) … 10³⁶ J (stars)

    if (f.kind === 'crash') { if (this._gate('crash', 250)) { this._lost(0.9 * g, pan); if (near > 0.12) this.buzz([8], false); } return; }

    }
    // several pieces of the same blow arrive in one step: one sound, the biggest
    const now = performance.now();
    if (now - this._lastBoom.t < 90 && s <= this._lastBoom.s) return;
    this._lastBoom = { t: now, s };

      case 'impact': this._boom(s, g, pan, { crack: true, debris: true }); break;
      case 'shatter': this._boom(Math.min(1, s + 0.15), g, pan, { crack: true, debris: true }); break;

      case 'graze': this._scrape(s, g, pan, !!f.dust); break;
      case 'swallow': this._swallow(s, g, pan); break;
      case 'collapse': this._collapse(g, pan); break;

      case 'roche': this._creak(s, g, pan, true); break;

    }

        impact: s > 0.6 ? [45, 40, 80, 40, 40] : s > 0.3 ? [30, 30, 40] : [18],
        shatter: [60, 30, 110, 40, 70, 40, 30], merge: [14], graze: [10, 30, 10, 30, 10], swallow: [20, 50, 30, 50, 90],
        collapse: [30, 60, 140], tear: [8, 70, 8, 70, 8], roche: [12, 60, 20, 60, 50],
      };
      this.buzz(pats[f.kind], false);
    }
  },
  // the "announce" block, or a challenge, says how it went
  result(ok) {
    if (this.live()) { if (ok) this._win(); else this._fail(); }
    this.buzz(ok ? [15, 70, 15, 70, 35] : [40, 60, 40], false);
  },
  _bell(t, f, peak, decay, out, bright) {
    this._osc('sine', f, f, t, decay * 1.7, this._env(out, t, 0.002, peak, 0, decay));
    this._osc('sine', f * 2.76, f * 2.76, t, decay, this._env(out, t, 0.001, peak * (bright ? 0.4 : 0.22), 0, decay * 0.35));
    this._osc('sine', f * 5.4, f * 5.4, t, decay * 0.5, this._env(out, t, 0.001, peak * (bright ? 0.18 : 0.08), 0, decay * 0.12));
  },
  _win() {

    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this._bell(t + i * 0.095, f, 0.26, 1.3, out, i === 3));
    const pe = this._env(out, t + 0.05, 0.25, 0.09, 0.5, 1.4), pad = this._filt('lowpass', 900, 0.5, pe);

  },
  _fail() {

  },
  // one star of a challenge result: higher for each

  },

          this._noiseSrc(t, 0.5, this._filt('lowpass', 160, 0.7, this._env(o, t, 0.02, 0.5, 0.05 + 0.1 * s, 0.2)), 0.6);

        case 'play': case 'pause': {

          this._osc('sine', a, b, t, 0.3, this._env(o, t, 0.006, 0.6, 0.04, 0.16), 0.09);
          this._osc('sine', a * 1.5, b * 1.5, t, 0.3, this._env(o, t, 0.006, 0.2, 0.03, 0.12), 0.09);
          break;
        }
        case 'faster': case 'slower': { const o = this._out(0, 0.05, 0.15), f = kind === 'faster' ? 1250 : 850; this._osc('sine', f, f * (kind === 'faster' ? 1.12 : 0.9), t, 0.09, this._env(o, t, 0.0015, 0.7, 0, 0.05)); break; }
        case 'undo': { const o = this._out(0, 0.1, 0.34), bp = this._filt('bandpass', 2500, 1.5, this._env(o, t, 0.02, 0.5, 0, 0.1)); this._sweep(bp.frequency, 2600, 600, t, 0.15); this._noiseSrc(t, 0.25, bp); break; }

// ============================================================================
// Storage: saved universes in this browser (localStorage) + file export/import.
// A failed write never destroys the previous good copy.
// ============================================================================
const Store = {
  prefix: 'gravitylab.', mem: {}, persistent: true,
  _get(k) { try { const v = localStorage.getItem(this.prefix + k); if (v != null) return v; } catch (e) { this.persistent = false; } return k in this.mem ? this.mem[k] : null; },
  _set(k, v) { try { localStorage.setItem(this.prefix + k, v); delete this.mem[k]; return true; } catch (e) { this.mem[k] = v; return false; } },
  _del(k) { try { localStorage.removeItem(this.prefix + k); } catch (e) { /* ignore */ } delete this.mem[k]; },
  probe() { try { localStorage.setItem(this.prefix + 'probe', '1'); localStorage.removeItem(this.prefix + 'probe'); this.persistent = true; } catch (e) { this.persistent = false; } return this.persistent; },
  json(k, fallback) { const s = this._get(k); if (!s) return fallback; try { return JSON.parse(s); } catch (e) { return fallback; } },
  // ---- preferences ----
  prefs() { const p = this.json('prefs', {}); return p && typeof p === 'object' ? p : {}; },
  setPref(k, v) { const p = this.prefs(); p[k] = v; this._set('prefs', JSON.stringify(p)); },
  // ---- saves ----
  index() {
    const l = this.json('index', []);
    return (Array.isArray(l) ? l : []).filter(e => e && typeof e.id === 'string').map(e => ({
      id: e.id, name: String(e.name || '').slice(0, 60), modified: isNum(e.modified) ? e.modified : 0, bodies: isNum(e.bodies) ? e.bodies : 0,
      template: typeof e.template === 'string' ? e.template : null, forked: !!e.forked, t: isNum(e.t) ? e.t : 0,
      thumb: typeof e.thumb === 'string' && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(e.thumb) && e.thumb.length < 60000 ? e.thumb : null,
    }));
  },
  _writeIndex(l) { return this._set('index', JSON.stringify(l)); },
  // returns {ok, persisted}
  save(session, thumb) {
    let data;
    try { data = JSON.stringify(session.toSave()); } catch (e) { return { ok: false, reason: 'serialize' }; }
    const key = 'save.' + session.id;
    const persisted = this._set(key, data);          // on quota failure the old value under `key` is still intact in localStorage
    const idx = this.index().filter(e => e.id !== session.id), old = this.index().find(e => e.id === session.id);
    idx.unshift({ id: session.id, name: session.name, modified: session.modified, bodies: session.A.bodies.length, template: session.template, forked: !!session.B, t: session.A.t, thumb: thumb || (old ? old.thumb : null) });
    const pi = this._writeIndex(idx);
    if (persisted) session.dirty = false;
    return { ok: true, persisted: persisted && pi };
  },
  load(id) {
    const s = this._get('save.' + id); if (!s) throw new Error('missing');
    return Session.fromSave(JSON.parse(s));
  },
  raw(id) { return this._get('save.' + id); },
  remove(id) { this._del('save.' + id); this._writeIndex(this.index().filter(e => e.id !== id)); },
  rename(id, name) {
    const idx = this.index(), e = idx.find(x => x.id === id); if (!e) return;
    e.name = name; this._writeIndex(idx);
    try { const o = JSON.parse(this._get('save.' + id)); o.name = name; this._set('save.' + id, JSON.stringify(o)); } catch (err) { /* ignore */ }
  },
  duplicate(id) {
    const s = this.load(id), e = this.index().find(x => x.id === id);
    s.id = uid('u'); s.name = (s.name + ' ' + T('copy_suffix')).slice(0, 60); s.created = s.modified = Date.now();
    this.save(s, e ? e.thumb : null); return s.id;
  },
  // ---- custom body library ----
  customBodies() {
    const l = this.json('custom', []);
    return (Array.isArray(l) ? l : []).slice(0, 60).filter(c => c && CATALOG[c.key] && isNum(c.m) && c.m >= 0 && isNum(c.r) && c.r > 0).map(c => ({ key: c.key, name: String(c.name || '').slice(0, 48), m: c.m, r: c.r, vo: sanitizeVo(c.vo), spinH: isNum(c.spinH) ? c.spinH : 24, tilt: isNum(c.tilt) ? c.tilt : 0, repel: !!c.repel }));
  },
  addCustomBody(c) { const l = this.customBodies(); l.unshift(c); this._set('custom', JSON.stringify(l.slice(0, 60))); },
  removeCustomBody(i) { const l = this.customBodies(); l.splice(i, 1); this._set('custom', JSON.stringify(l)); },
};

// File export. Inside Claude the page may not start a download itself: it asks the host through the
// `downloads` capability and the viewer confirms. On an ordinary web host a normal browser download is used.
// Result: 'saved' | 'declined' | 'busy' | 'failed'.
const Files = {
  _cap: null,
  // asked each time: the host may attach `window.claude` after this script first ran
  hosted() { return typeof window !== 'undefined' && !!(window.claude && typeof window.claude.use === 'function'); },
  async cap() {
    if (this._cap) return this._cap;
    if (!this.hosted()) return null;
    try { this._cap = (await window.claude.use('downloads')) || null; } catch (e) { this._cap = null; }   // asking again is free: the host remembers its answer
    return this._cap;
  },
  async save(filename, data, type) {
    const cap = await this.cap();
    if (cap) {
      try { await cap.save({ filename, data }); return 'saved'; }
      catch (e) { const code = e && e.code; return code === 'declined' ? 'declined' : code === 'rate_limited' ? 'busy' : 'failed'; }
    }
    if (this.hosted()) return 'failed';               // inside the viewer's frame a direct download is ignored
    try {
      const blob = data instanceof Blob ? data : new Blob([data], { type: type || 'application/octet-stream' });
      const url = URL.createObjectURL(blob), a = h('a', { href: url, download: filename, style: { display: 'none' } });
      document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 8000);
      return 'saved';
    } catch (e) { return 'failed'; }
  },
  // pick a local file and return its text
  pickText(accept, maxBytes) {
    return new Promise((res, rej) => {
      const inp = h('input', { type: 'file', accept: accept || '.json,application/json', style: { display: 'none' } });
      inp.addEventListener('change', () => {
        const f = inp.files && inp.files[0]; inp.remove();
        if (!f) return rej(new Error('none'));
        if (f.size > (maxBytes || 6e6)) return rej(new Error('too-big'));
        const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = () => rej(new Error('read')); r.readAsText(f);
      });

    });
  },
};
function safeFileName(s) { return (String(s || 'universe').replace(/[\\/:*?"<>|\u0000-\u001f]/g, ' ').trim().slice(0, 40) || 'universe').replace(/\s+/g, '-'); }
// a text export the user can also copy by hand when downloads are not possible
let exportOpen = false;
async function exportText(filename, text, type) {
  if (exportOpen) return;                              // a second tap while the host's dialog is still open
  exportOpen = true;
  let r; try { r = await Files.save(filename, text, type); } finally { exportOpen = false; }
  if (r === 'saved') { Toast.show(T('exp_saved', { f: filename })); return; }
  if (r === 'declined') return;
  if (r === 'busy') { Toast.show(T('exp_busy')); return; }
  const ta = h('textarea', { readOnly: true, value: text.length > 400000 ? text.slice(0, 400000) : text });
  const d = h('div', { class: 'dlg wide' }, h('h2', { text: filename }), h('p', { text: T('exp_failed') }), ta,
    h('div', { class: 'acts' }, btn(T('copy_text'), async () => { try { await navigator.clipboard.writeText(text); Toast.show(T('copied')); } catch (e) { ta.focus(); ta.select(); } }, 'primary', 'copy'), btn(T('close'), () => Modal.close(), 'quiet')));
  Modal.open(d);
}
