// Title screen — the live black hole (same renderer as in the game) behind an
// elliptical start button that sits on the accretion disc. Falls back to a
// still frame when live rendering is unavailable, too slow, or motion is unwanted.
// ============================================================================
const Title = {
  host: null, live: false, paused: false, t: 0, discTime: 0, discAngle: 0, go: null, comp: null,
  quality: 'cinema', slow: 0, okFrames: 0, off: false, avg: 0,

  build(host) {
    this.host = host; clear(host); host.classList.remove('live', 'go');
    this.still = h('div', { id: 'titleStill' });
    const lang = selectEl(LANG_NAMES.map((n, i) => [String(i), n]), String(LANG), (v) => App.setLang(+v), 'langsel');
    lang.setAttribute('aria-label', 'Language');
    const ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 240 100'); svg.setAttribute('aria-hidden', 'true');
    for (const [rx, ry, w, op] of [[113, 41, 1.3, 0.92], [104, 35, 0.6, 0.4]]) {
      const e = document.createElementNS(ns, 'ellipse'); e.setAttribute('cx', '120'); e.setAttribute('cy', '50'); e.setAttribute('rx', rx); e.setAttribute('ry', ry);
      e.setAttribute('fill', 'none'); e.setAttribute('stroke', '#ffe9c4'); e.setAttribute('stroke-width', w); e.setAttribute('opacity', op); svg.append(e);
    }
    this.startBtn = h('button', { id: 'startBtn', 'aria-label': T('title_start'), onclick: () => this.start() }, svg, h('span', { text: T('title_start') }));
    this.pauseBtn = h('button', { id: 'titlePause', onclick: () => this.togglePause() });
    host.append(this.still, h('div', { id: 'titleShade' }),
      h('div', { id: 'titleTop' }, h('div', { class: 'brand' }, brandMark(), h('b', { text: 'GRAVITY LAB' })), lang),
      h('div', { id: 'startWrap' }, this.startBtn), this.pauseBtn,
      h('div', { id: 'burst' }, h('i', { class: 'halo' }), h('i', { class: 'ring' })), h('div', { id: 'veil' }));
    this.live = false; this.okFrames = 0;
    this.syncPause();
  },
  enter() {
    this.go = null; this.host.classList.remove('go');
    if (this._init === undefined) {
      this._init = true;
      const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      const coarse = window.matchMedia && matchMedia('(pointer:coarse)').matches;
      this.paused = !!reduce; this.quality = coarse ? 'high' : 'cinema';
      if (!App.glOk) this.off = true;
    }
    this.syncPause(); this.layout();
  },
  leave() { this.host.classList.remove('live'); this.live = false; this.okFrames = 0; this._last = 0; this.fine = 0; this.crawl = 0; },
  syncPause() {
    if (!this.pauseBtn) return;
    this.pauseBtn.textContent = this.off ? '' : T(this.paused ? 'title_play' : 'title_pause');
    this.pauseBtn.classList.toggle('hidden', this.off);
  },
  togglePause() { this.paused = !this.paused; this.syncPause(); this.okFrames = 0; this._last = 0; this.fine = 0; this.crawl = 0; if (this.paused) { this.host.classList.remove('live'); this.live = false; } },
  layout() {
    if (!this.host) return;
    const w = App.vw, hh = App.vh, c = this.comp = introComposition(w, hh), pose = introCameraPose(c, 0);
    const e = introProject(c, pose, [0, 0, 28.8]), o = introProject(c, pose, [0, 0, 0]);
    const st = this.host.style;
    st.setProperty('--entry-x', e.x.toFixed(1) + 'px'); st.setProperty('--entry-y', e.y.toFixed(1) + 'px'); st.setProperty('--entry-roll', (-c.roll / DEG) + 'deg');
    st.setProperty('--hx', o.x.toFixed(1) + 'px'); st.setProperty('--hy', o.y.toFixed(1) + 'px');
    const which = c.aspect >= 1.15 ? 'wide' : c.aspect >= 0.62 ? 'mid' : 'tall';
    if (this._still !== which) { this._still = which; this.still.style.backgroundImage = 'url("' + assetUrl('landing/still_' + which + '.webp') + '")'; }
    this.still.style.backgroundPosition = '50% ' + (c.cy * 100) + '%';
    // scale the button with the disc on large screens
    const k = clamp(c.shadow / 62, 0.8, 1.7);
    const wrap = this.host.querySelector('#startWrap'); if (wrap) wrap.style.transform = 'translate(-50%,-50%) rotate(' + (-c.roll / DEG) + 'deg) scale(' + k.toFixed(3) + ')';
  },
  start() {
    if (this.go) return;
    this.go = { t0: performance.now(), a0: this.discAngle, d0: this.discTime };
    this.host.classList.add('go'); Sound.ui('start');
    // the page change does not depend on the frame rate
    setTimeout(() => { if (this.go && App.route === 'title') { this.go = null; App.setRoute('home'); } }, 920);
  },
  frame(now, dt) {
    const c = this.comp; if (!c) return;
    let done = false;
    if (this.go) {
      const el = (now - this.go.t0) / 1000;
      const p = clamp(el / 0.54, 0, 1), integral = p * p * p - 0.5 * p * p * p * p;
      this.discAngle = this.go.a0 + 0.025 * el + 28 * (0.54 * integral + Math.max(0, el - 0.54));
      this.discTime = this.go.d0 + 3 * el + 48 * 0.54 * integral;
      this.t += dt;
      if (el >= 0.9) done = true;
    } else if (!this.paused) { this.t += dt; this.discTime += 3 * dt; this.discAngle += 0.025 * dt; }
    // live frames: while playing, and through the start transition only if they were already running smoothly
    if (!this.off && (this.go ? this.live && this.avg > 0 && this.avg < 0.12 : !this.paused)) {
      const phase = TAU * (this.t % 60) / 60, pose = introCameraPose(c, phase);
      let ok = false;
      try { ok = App.renderer.renderLanding({ pos: pose.position, f: pose.forward, r: pose.right, u: pose.up, fov: c.field, phase, discAngle: this.discAngle, discTime: this.discTime, quality: this.quality, adaptive: true }); }
      catch (e) { ok = false; this.off = true; }
      const n = App.renderer.noctis;
      if (n && (n.available === false || n.failure)) this.off = true;
      if (this.off) { this.host.classList.remove('live'); this.live = false; this.syncPause(); }
      else if (ok) {
        // The still frame stays up until live frames arrive at a watchable pace; a renderer that crawls is stepped
        // down quickly and, as a last resort, left on the still frame.
        this.okFrames++;
        const real = this._last ? (now - this._last) / 1000 : 0; this._last = now;
        if (this.okFrames > 1 && !this.go) {
          this.avg = this.avg ? lerp(this.avg, Math.min(real, 2), 0.15) : Math.min(real, 2);
          this.fine = real < 0.2 ? (this.fine || 0) + 1 : 0;
          this.crawl = real > 0.5 ? (this.crawl || 0) + 1 : 0;
          if (!this.live && this.fine >= 3) { this.host.classList.add('live'); this.live = true; }
          const order = ['cinema', 'high', 'standard', 'power'], i = order.indexOf(this.quality);
          const step = (to) => { this.slow = 0; this.avg = 0; this.okFrames = 0; this.fine = 0; this.crawl = 0; this._last = 0; if (to < order.length) this.quality = order[to]; else { this.paused = true; this.host.classList.remove('live'); this.live = false; this.syncPause(); } };
          if (this.crawl >= 2) step(i < 3 ? 3 : 4);
          else if (this.okFrames > 40 && this.avg > 0.06) { if (++this.slow > 50) step(i + 1); }
          else this.slow = Math.max(0, this.slow - 1);
        }
      }
    }
    if (done && this.go) { this.go = null; App.setRoute('home'); }
  },
};

  stopState() {

  },
  // run straight to the braking point (a fraction of a second of computing instead of waiting for it)
  jumpToStop() {
    const R = this.R, s = App.session; if (!R || R.stopT === null || R.stopHit) return;

  // time has stopped at the braking point: say so, and lay out the push of the last attempt if it was made right here
  reached() {

    const t = R.current(); if (!t) return;

    Toast.show(T(t.stop === 'peri' ? 'ch_at_peri' : 'ch_at_apex'), { key: 'stop', ms: 3600 });
    const L = this.last[R.tool], b = R.toolBody(t), ref = t.snapRef ? R.U().byId(R.ids[t.snapRef]) : null;

      const n = L.n || [0, 1, 0], fr = this.frameAt(b, ref, n), dir = V.norm(V.add(V.add(V.mul(fr.H, L.loc[0]), V.mul(fr.R, L.loc[1])), V.mul(n, L.loc[2])));

  // ---- planning a move ----------------------------------------------------------------------
  view() { const R = App.renderer, s = App.session; return R.views.find(v => v.tag === s.active && !v.pip) || R.views[0] || null; },
  // the world body a direction is measured against for snapping (the Sun for a launch from Earth, Mars for a probe…);

  snapDirs(t, b, n, pred) {

  dragMax() { return clamp(Math.min(App.vw, App.vh) * 0.34, 110, 230); },

  move(x, y) {

  // ---- the 2D overlay ----------------------------------------------------------------------------------
  overlay(c, now) {

  // a circle in the system plane around c, as screen points
  ringPts(vi, c, r, n) {
    const pts = [], Rr = App.renderer;
    for (let k = 0; k <= n; k++) { const a = TAU * k / n, P = [c[0] + r * Math.cos(a), c[1], c[2] - r * Math.sin(a)], sp = Rr.project(vi, P); if (!sp.visible) return null; pts.push(sp); }
    return pts;
  },
  drawRing(c, vi, ring) {
    const outer = this.ringPts(vi, ring.c, ring.r2 || ring.r, 120); if (!outer) return;
    let xmin = Infinity, xmax = -Infinity, ymin = Infinity, ymax = -Infinity, right = outer[0];
    for (const p of outer) { xmin = Math.min(xmin, p.x); xmax = Math.max(xmax, p.x); ymin = Math.min(ymin, p.y); ymax = Math.max(ymax, p.y); if (p.x > right.x) right = p; }
    const span = Math.max(xmax - xmin, ymax - ymin); if (span < 10 || span > 9000) return;
    c.save();
    if (ring.kind === 'zone') {
      const inner = this.ringPts(vi, ring.c, ring.r, 120); if (!inner) { c.restore(); return; }
      c.beginPath(); outer.forEach((p, i) => (i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y))); c.closePath();
      inner.slice().reverse().forEach((p, i) => (i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y))); c.closePath();
      c.fillStyle = 'rgba(126,214,150,.10)'; c.fill('evenodd');
      c.strokeStyle = 'rgba(140,224,164,.55)'; c.lineWidth = 1.2;
      for (const ps of [outer, inner]) { c.beginPath(); ps.forEach((p, i) => (i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y))); c.stroke(); }
    } else if (ring.kind === 'roche') {
      c.setLineDash([4, 5]); c.strokeStyle = ring.inside ? 'rgba(255,120,92,.95)' : 'rgba(240,143,128,.7)'; c.lineWidth = 1.3;
      c.beginPath(); outer.forEach((p, i) => (i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y))); c.stroke(); c.setLineDash([]);
    } else {
      const al = ring.n === 3 ? 0.9 : ring.n === 2 ? 0.7 : 0.5;
      c.setLineDash([3, 5]); c.strokeStyle = 'rgba(227,185,124,' + al + ')'; c.lineWidth = 1.2;
      c.beginPath(); outer.forEach((p, i) => (i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y))); c.stroke(); c.setLineDash([]);
    }
    if (ring.label && span > 46 && right.x < App.vw - 24 && right.y > 60 && right.y < App.vh - 60 && !this._labs.some(q => Math.abs(q - right.y) < 18)) {
      this._labs.push(right.y);
      c.font = App.labelFont(); c.textBaseline = 'middle'; c.lineJoin = 'round'; c.lineWidth = 3;
      const tw = c.measureText(ring.label).width, tx = clamp(right.x + 7, 6, App.vw - tw - 6), ty = clamp(right.y, 16, App.vh - 16);
      c.strokeStyle = 'rgba(3,6,10,.75)'; c.strokeText(ring.label, tx, ty);

  },
  // where the focus body will be when the planned path comes closest to it
  drawGhostBody(c, vi, u, pv) {

    const P = D ? V.add(D.p, pv.fAt) : pv.fAt, sp = App.renderer.project(vi, P); if (!sp.visible) return;
    const rad = clamp(F.r / Math.max(sp.z * vi.pxAngle, 1e-30), 7, 400) + 3;
    c.save(); c.setLineDash([4, 4]); c.strokeStyle = 'rgba(232,238,240,.75)'; c.lineWidth = 1.3;
    c.beginPath(); c.arc(sp.x, sp.y, rad, 0, TAU); c.stroke(); c.setLineDash([]);
    if (pv.fT > 0) {
      const txt = T('ch_then', { name: bodyName(F), t: fmtTime(pv.fT) });
      c.font = App.labelFont(); c.textAlign = 'center'; c.textBaseline = 'alphabetic'; c.lineJoin = 'round'; c.lineWidth = 3;
      const ty = clamp(sp.y + rad + 15, 14, App.vh - 6), tx = clamp(sp.x, 60, App.vw - 60);
      c.strokeStyle = 'rgba(3,6,10,.75)'; c.strokeText(txt, tx, ty); c.fillStyle = 'rgba(232,238,240,.9)'; c.fillText(txt, tx, ty);
    }
    c.restore();
  },
  drawHitMark(c, vi, u, pv) {
    const D = pv.rel ? u.byId(pv.rel) : null, at = pv.pts[pv.pts.length - 1], P = D ? V.add(D.p, at) : at, sp = App.renderer.project(vi, P); if (!sp.visible) return;
    const good = this.readout().tone === 'good';
    c.save(); c.strokeStyle = good ? '#8fe0cc' : '#ffb27a'; c.lineWidth = 2; c.lineCap = 'round';
    c.beginPath(); c.moveTo(sp.x - 6, sp.y - 6); c.lineTo(sp.x + 6, sp.y + 6); c.moveTo(sp.x + 6, sp.y - 6); c.lineTo(sp.x - 6, sp.y + 6); c.stroke();
    c.restore();
  },
  // the arrow of a planned launch or push, from the body (or from the ◆ for a push waiting there), as long as the drag
  // that would give this speed
  drawArrow(c, vi, u, p) {
    const an = this.anchor(p); if (!an) return;
    const a = App.renderer.project(vi, an.w); if (!a.visible) return;
    const b = u.byId(p.bid), sc = !p.sched && b ? vi.screen.get(b.id) : null, rB = sc && sc.visible ? sc.r : 0;
    let tx, ty;
    if (p.drag && p.dir) { tx = p.tx != null ? p.tx : p.x; ty = p.ty != null ? p.ty : p.y; }
    else if (p.dir) {
      const q = App.renderer.project(vi, V.addmul(an.w, p.dir, vi.dist * 0.05)); if (!q.visible) return;
      let dx = q.x - a.x, dy = q.y - a.y; const l = Math.hypot(dx, dy); if (!(l > 1e-6)) return; dx /= l; dy /= l;
      const L = Math.max(30, this.dragMax() * this.kOf(p.t, p.speed)), base = rB > 24 ? Math.min(rB, 160) : 0;
      tx = a.x + dx * (base + L); ty = a.y + dy * (base + L);
    } else return;
    const x0 = a.x, y0 = a.y, ang = Math.atan2(ty - y0, tx - x0), len = Math.hypot(tx - x0, ty - y0);
    c.save();

    if (p.drag) { c.setLineDash([2, 6]); c.strokeStyle = 'rgba(227,185,124,.45)'; c.lineWidth = 1; c.beginPath(); c.arc(x0, y0, this.dragMax(), 0, TAU); c.stroke(); c.setLineDash([]); }
    // a push already scheduled at the ◆ takes the ◆'s colour
    const ink = p.booked ? '#e3b97c' : '#f3ead9';
    c.strokeStyle = ink; c.fillStyle = ink; c.lineWidth = 2.2; c.lineCap = 'round';
    const st = p.drag ? Math.min(Math.min(rB, 160) + 3, len * 0.4) : Math.min(Math.min(rB, 160) + 3, Math.max(0, len - 26));
    c.beginPath(); c.moveTo(x0 + Math.cos(ang) * st, y0 + Math.sin(ang) * st); c.lineTo(tx, ty); c.stroke();
    if (len > 14) { c.beginPath(); c.moveTo(tx + Math.cos(ang) * 3, ty + Math.sin(ang) * 3); c.lineTo(tx - 12 * Math.cos(ang - 0.42), ty - 12 * Math.sin(ang - 0.42)); c.lineTo(tx - 12 * Math.cos(ang + 0.42), ty - 12 * Math.sin(ang + 0.42)); c.closePath(); c.fill(); }
    const txt = chSpeed(p.speed, p.t.vstep) + (p.snap ? '  ' + T('snap_' + p.snap) : '');
    c.font = '500 12.5px ' + App.uiFont(); c.textBaseline = 'middle'; c.textAlign = 'left';
    const tw = c.measureText(txt).width;
    let bx, by;
    if (p.drag) { bx = tx + (Math.cos(ang) >= 0 ? 14 : -14 - tw - 16); by = ty - 20; }      // beside the finger
    else {

  // a planet waiting to be placed: a marker where it goes and the circle it would follow

  key(e) {

// a small picture of a body for lists: vis = catalog entry (optionally merged with a body's overrides)
function orbEl(vis) {
  const e = h('div', { class: 'orb', 'aria-hidden': 'true' }), st = e.style, css = (c) => 'rgb(' + c.map(x => Math.round(clamp(x, 0, 1) * 255)).join(',') + ')';

// masses in everyday words for the library cards: "318 個地球"
function fmtMassWords(kg) {
  const a = Math.abs(kg);
  if (a >= 0.05 * M_SUN) return T('mw_sun', { n: sig(kg / M_SUN, 3) });
  if (a >= 1e-4 * M_EARTH) return T('mw_earth', { n: sig(kg / M_EARTH, 3) });
  return sig(kg, 2) + ' kg';
}

    const grid = h('div', { class: 'libgrid' });
    const item = (spec, vis, name, sub, onDelete) => {
      const on = cur && cur.spec.key === spec.key && (cur.spec.name || null) === (spec.name || null);
      const b = h('button', { class: 'lib' + (on ? ' on' : ''), onclick: () => this.pick(spec) }, orbEl(vis), h('b', { text: name }), h('span', { text: sub }));
      if (!onDelete) return b;
      return h('div', { class: 'libwrap' }, b, h('button', { class: 'libdel', 'aria-label': T('del'), title: T('del'), onclick: onDelete }, icon('close')));
    };
    for (const key of CATALOG_ORDER) {
      const c = CATALOG[key]; if (c.grp !== this.group) continue;
      grid.append(item({ key }, c, catName(key), c.m > 0 ? fmtMassWords(c.m) : T('lib_massless')));
    }
    if (this.group === 'custom') {
      Store.customBodies().forEach((c, i) => {
        const vis = c.vo ? Object.assign({}, CATALOG[c.key], c.vo, { vo: c.vo }) : CATALOG[c.key];

        grid.append(item(spec, vis, c.name || catName(c.key), fmtMassWords(c.m), async () => { if (await confirmDlg({ title: T('lib_del_q', { name: c.name || catName(c.key) }), ok: T('del'), danger: true })) { Store.removeCustomBody(i); Win.render('library'); } }));
      });

// ---- 63_probecam.js ----
// ============================================================================
// Probe cameras — six live pictures from a probe: what it sees ahead, behind, to
// either side, above and below; or the probe itself seen from those six sides.
// A tray of its own. Its boxes are holes the renderer paints each picture into.
// Tap a picture to make it large; there it can be turned, zoomed and reset.
// ============================================================================
const PC_DIRS = ['f', 'b', 'l', 'r', 'u', 'd'];
const ProbeCam = {
  id: null, tag: 'A', mode: 'out', one: null, look: null, auto: true, lost: false, slots: {}, _noise: null,

  isProbe(b) { return !!b && visOf(b).vis === 'probe'; },
  uni() { const s = App.session; return !s ? null : this.tag === 'B' && s.B ? s.B : s.A; },
  body() { const u = this.uni(); return u && this.id ? u.byId(this.id) : null; },
  resetLook() { this.look = { yaw: 0, pitch: 0, zoom: 1 }; },
  // point the cameras at a probe and show them
  open(id, tag) {
    const s = App.session; if (!s) return;
    const tg = tag === 'B' && s.B ? 'B' : 'A', u = tg === 'B' ? s.B : s.A, b = u.byId(id);
    if (!this.isProbe(b)) return;
    if (this.id !== id || this.tag !== tg) { this.resetLook(); this.lost = false; }
    this.id = id; this.tag = tg; this.auto = true;
    if (!this.look) this.resetLook();
    if (Win.isOpen('pcam')) { Win.render('pcam'); if (Win.isMin('pcam')) Win.restore('pcam'); if (Win.isFolded('pcam')) Win.fold('pcam', false); Win.raise('pcam'); }
    else Win.show('pcam', null, { unfold: true });
  },
  // the × on the tray: put the cameras away, and stop opening them by themselves
  close() { this.auto = false; Win.hide('pcam'); },
  closed() { this.id = null; this.one = null; this.slots = {}; this.lost = false; },
  // a new universe, a new start
  reset() { this.id = null; this.one = null; this.mode = 'out'; this.auto = true; this.lost = false; this.slots = {}; this.resetLook(); },
  setMode(m) { if (m === this.mode) return; this.mode = m; this.resetLook(); Sound.ui('tick'); Win.render('pcam'); },
  setOne(k) { this.one = k; this.resetLook(); Sound.ui(k ? 'pick' : 'tick'); Win.render('pcam'); },

  // ---- what the renderer draws -------------------------------------------------------------------------------------
  // where camera k sits and looks, for probe b; the large picture adds the player's own turn and zoom
  pose(k, b, att, dirs) {
    const ext = this.mode === 'ext', d = dirs[k], up = k === 'u' || k === 'd' ? att.f : att.up;
    const lk = this.one === k ? this.look : null, zoom = lk ? lk.zoom : 1;
    let f = ext ? V.mul(d, -1) : V.copy(d);
    if (lk && (lk.yaw || lk.pitch)) {
      f = V.norm(rotateAbout(f, up, lk.yaw));
      const rt = V.norm(V.cross(f, up)); if (V.len(rt) > 0) f = V.norm(rotateAbout(f, rt, lk.pitch));
    }
    if (ext) {
      const D = b.r * 2.8 / zoom;
      return { eye: V.addmul(b.p, f, -D), f, up, fov: 40 * DEG, unit: D, hide: null, lens: !!lk, labels: !!lk, key: 'pc' };
    }
    return { eye: V.copy(b.p), f, up, fov: clamp(74 / zoom, 8, 110) * DEG, unit: Math.max(b.r * 2, 1), hide: b.id, lens: !!lk, labels: !!lk, key: 'pc' };
  },
  entries() {
    const w = Win.get('pcam'); if (!w || w.folded || !this.id || document.body.classList.contains('clean')) return [];
    const u = this.uni(); if (!u) return [];
    const b = u.byId(this.id);
    if (!b) { this.setLost(true); return []; }
    if (this.lost) this.setLost(false);
    const att = CraftAtt.of(u, b, this.tag + ':' + b.id), dirs = CraftAtt.dirs(att);
    // waiting in the dock: one small live picture (the camera that was large, or the front one)
    if (w.min) {
      const r = Win.dockRect('pcam'); if (!r) return [];
      const k = this.one || 'f', save = this.one; this.one = null;
      const cam = this.pose(k, b, att, dirs); this.one = save;
      return [{ rect: r, clip: r, u, tag: this.tag, pip: true, cam }];
    }
    const cr = App.canvas.getBoundingClientRect(), wr = w.el.getBoundingClientRect(), out = [];
    const clip = { x: wr.left - cr.left + 1, y: wr.top - cr.top + 1, w: wr.width - 2, h: wr.height - 2 };
    for (const k of (this.one ? [this.one] : PC_DIRS)) {
      const el = this.slots[k]; if (!el || !el.isConnected) continue;
      const r = el.getBoundingClientRect(); if (r.width < 8 || r.height < 8) continue;
      out.push({ rect: { x: r.left - cr.left, y: r.top - cr.top, w: r.width, h: r.height }, clip, u, tag: this.tag, pip: true, cam: this.pose(k, b, att, dirs) });
    }
    return out;
  },
  // the probe is gone: the pictures turn to static
  setLost(on) {
    if (this.lost === on) return; this.lost = on;
    const w = Win.get('pcam'); if (!w) return;
    w.el.classList.toggle('lost', on);
    this.refresh();
    if (on) Sound.ui('trash', 0.35);
  },
  primaryName() { const u = this.uni(), b = this.body(); if (!b) return ''; const att = CraftAtt.of(u, b, this.tag + ':' + b.id), P = att.primary ? u.byId(att.primary) : null; return P ? bodyName(P) : ''; },
  noteText() { if (this.lost) return T('pc_lost_note'); const P = this.primaryName(); return this.mode === 'ext' ? T('pc_note_ext') : P ? T('pc_note', { name: P }) : T('pc_note_free'); },

  // ---- the tray ------------------------------------------------------------------------------------------------------
  noiseUrl() {
    if (this._noise) return this._noise;
    try {
      const c = document.createElement('canvas'); c.width = c.height = 96; const g = c.getContext('2d'), im = g.createImageData(96, 96);
      for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() < 0.08 ? 230 : 40 + Math.random() * 120; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
      g.putImageData(im, 0, 0); this._noise = c.toDataURL('image/png');
    } catch (e) { this._noise = ''; }
    return this._noise;
  },
  build(hd, bd, w) {
    const b = this.body(), name = b ? bodyName(b) : T('pc_probe');
    hd.append(Win.header(T('pc_title'), name));
    w.el.classList.toggle('lost', this.lost); w.el.classList.toggle('one', !!this.one);
    w.el.style.setProperty('--pc-noise', 'url(' + this.noiseUrl() + ')');
    this.slots = {};
    const grid = h('div', { class: 'pc-grid' + (this.one ? ' one' : '') });
    for (const k of (this.one ? [this.one] : PC_DIRS)) {
      const el = h('div', { class: 'pc-slot', data: { k }, role: this.one ? 'img' : 'button', tabindex: this.one ? null : '0', 'aria-label': T('pc_' + k) },
        h('span', { class: 'pc-lab', text: T('pc_' + k) }));
      if (this.one) this.bindLook(el);
      else { el.addEventListener('click', () => this.setOne(k)); el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.setOne(k); } }); }
      this.slots[k] = el; grid.append(el);
    }
    grid.append(h('div', { class: 'pc-lostmsg' }, h('b', { text: T('pc_lost') }), h('span', { text: T('pc_lost_d', { name }) })));
    const foot = h('div', { class: 'pc-foot' });
    if (this.one) {
      const row = h('div', { class: 'pc-dirs' });
      row.append(h('button', { class: 'chip pc-all', 'aria-label': T('pc_all'), title: T('pc_all'), onclick: () => this.setOne(null) }, icon('grid6'), h('span', { text: T('pc_all') })));
      for (const k of PC_DIRS) row.append(h('button', { class: 'chip' + (k === this.one ? ' on' : ''), text: T('pc_' + k), onclick: () => this.setOne(k) }));
      foot.append(row);
    }
    // which cameras: the probe's own, or the probe seen from outside; and a line on which way is which
    this._note = h('div', { class: 'pc-note', text: this.one ? T('pc_hint_one') : this.noteText() });
    foot.append(h('div', { class: 'pc-row' }, segEl([['out', T('pc_out')], ['ext', T('pc_ext')]], this.mode, (m) => this.setMode(m)), this._note));
    bd.append(grid, foot);
    this.fit(w);

// ---- 66_blocks_ui.js ----
// ============================================================================
// Block editor — drag blocks out of the palette and snap them together.
//   mouse: drag straight away.   touch: pull a palette block out of the strip,
//   or hold a workspace block for a moment to lift it (a quick swipe scrolls).
// The model (session.program) is the source of truth; the DOM is rebuilt after
// every change, so there is no hidden editor state to get out of sync.
// ============================================================================
const HAT_GIVES_IT = { ev_dist: 1, ev_touch: 1, ev_orbit: 1, ev_recv: 1 };
const BlocksUI = {
  cat: 'event', undoStack: [], drag: null, cand: null, root: null, ws: null, canvas: null, pal: null, vals: [], _sig: '', adv: false,

  prog() { return App.session.program; },

  // ---- panel -----------------------------------------------------------------
  build(head, body) {
    this.undoBtn = iconBtn('undo', T('bk_undo'), () => this.undo());
    head.append(Win.header(T('bk_title'), null, [btn(T('bk_ideas'), () => this.ideas(), 'small'), this.undoBtn, iconBtn('help', T('bk_help'), () => this.help())]));
    this.ws = h('div', { class: 'bk-ws' }); this.canvas = h('div', { class: 'bk-canvas' }); this.ws.append(this.canvas);
    this.pal = h('div', { class: 'bk-pal', data: { trash: T('bk_trash') } });
    this.cats = h('div', { class: 'bk-cats', role: 'tablist' });
    this.root = h('div', { class: 'bk-editor' }, this.ws, this.pal, this.cats);
    body.append(this.root);
    this.adv = Store.prefs().bkAdv === true;
    if (!this.adv && this.catAdv(this.cat)) this.cat = 'event';
    this.bind(this.root);
    this.renderCats(); this.renderPalette(); this.renderWorkspace();
  },
  onClose() { this.cancelDrag(); },
  // in a wide tray the palette wraps and scrolls up and down; in a narrow one it is a single strip that scrolls sideways
  roomyPalette() { const w = this.root && this.root.closest('.win'); return !!(w && w.classList.contains('w-lg')); },
  refresh() {
    // live values next to loose reporter blocks
    if (this.vals.length && !this.drag) {
      const s = App.session, u = App.U(), cx = { u, prog: s.program, tag: s.active, th: null, fx: [] };
      for (const v of this.vals) {
        let txt = '';
        try {
          const d = BLOCKS[v.blk.op], x = d.ev(cx, v.blk.a, v.blk);
          if (d.shape === 'bool') txt = x ? T('bk_true') : T('bk_false');
          else if (d.shape === 'bref') { const b = typeof x === 'string' ? u.byId(x) : null; txt = b ? bodyName(b) : '—'; }
          else txt = sig(isNum(x) ? x : 0, 4);
        } catch (e) { txt = '—'; }
        if (v.el.textContent !== '= ' + txt) v.el.textContent = '= ' + txt;
      }
    }
    // body names in the drop-downs follow the universe
    const now = performance.now();
    if (now - (this._sigAt || 0) > 900 && !this.drag) {
      this._sigAt = now;
      const sig2 = this.bodySig();
      if (sig2 !== this._sig) { const a = document.activeElement; if (!(a && this.root && this.root.contains(a) && /INPUT|SELECT/.test(a.tagName))) this.renderWorkspace(); }
    }
  },
  bodySig() { const s = App.session; let x = s.active + (s.B ? 'B' : ''); for (const b of App.U().bodies) if (!b.debris) x += '|' + b.id + bodyName(b); return x; },      // fragments are not offered in the menus
  help() {
    const row = (ic, a, b) => h('div', null, icon(ic), h('div', null, h('b', { text: a }), h('span', { text: b })));
    Modal.open(h('div', { class: 'dlg', role: 'dialog', 'aria-modal': 'true' }, h('h2', { text: T('bk_help') }),
      h('div', { class: 'steps' }, row('flag', T('bkh_1'), T('bkh_1d')), row('blocks', T('bkh_2'), T('bkh_2d')), row('edit', T('bkh_3'), T('bkh_3d')), row('trash', T('bkh_4'), T('bkh_4d')), row('split', T('bkh_5'), T('bkh_5d')), row('flask', T('bkh_6'), T('bkh_6d'))),
      h('div', { class: 'acts' }, btn(T('ok'), () => Modal.close(), 'primary'))));
  },

  // ---- rendering ------------------------------------------------------------------
  // ---- the advanced layer: one switch; the same language, more blocks and four more categories ------------------
  catAdv(c) { const e = BLOCK_CATS.find(x => x[0] === c); return !!(e && e[2]); },
  setAdv(on) {
    this.adv = !!on; Store.setPref('bkAdv', this.adv);
    if (!this.adv && this.catAdv(this.cat)) this.cat = 'event';
    this.renderCats(); this.renderPalette(); this.renderWorkspace(); Sound.ui('tick');
    if (this.adv && !Store.prefs().bkAdvSeen) { Store.setPref('bkAdvSeen', true); Toast.show(T('bk_adv_on'), { ms: 6500, key: 'bka' }); }
  },
  renderCats() {
    clear(this.cats);
    const sw = h('button', { class: 'bk-advsw' + (this.adv ? ' on' : ''), role: 'switch', 'aria-checked': String(this.adv), title: T('bk_adv_tip'), onclick: () => this.setAdv(!this.adv) }, h('i'), T('bk_adv'));
    this.cats.append(sw);
    for (const [c, label, adv] of BLOCK_CATS) {
      if (adv && !this.adv) continue;
      const b = h('button', { class: 'bk-cat' + (c === this.cat ? ' on' : '') + (adv ? ' adv' : ''), role: 'tab', onclick: () => { this.cat = c; this.renderCats(); this.renderPalette(); this.pal.scrollLeft = 0; this.pal.scrollTop = 0; } }, h('i'), pickLang(label));
      b.style.setProperty('--c', 'var(--bk-' + c + ')'); this.cats.append(b);
    }
  },
  palBlock(op, ov) {
    const el = this.renderBlock(newBlock(op, Object.assign(this.defaults(op), ov || {})), { pal: true });
    el.dataset.op = op; if (ov) el.dataset.ov = JSON.stringify(ov);
    this.pal.append(el);
  },
  renderPalette() {
    clear(this.pal);
    const p = this.prog(), lists = p.lists || [], procs = p.procs || [];
    const tool = (text, fn, title) => this.pal.append(h('button', { class: 'bk-varbtn', text, title: title || text, onclick: fn }));
    const note = (text) => this.pal.append(h('span', { class: 'note', text }));
    if (this.cat === 'var') {
      tool(T('bk_newvar'), () => this.newVar());
      for (const v of p.vars) tool('✕ ' + v, () => this.delVar(v), T('bk_delvar'));
      if (!p.vars.length) { note(T('bk_var_hint')); return; }
    }
    if (this.cat === 'my') {
      tool(T('bk_newproc'), () => this.editProc(null));
      for (const pr of procs) this.palBlock('p_call', { proc: pr.id });
      if (!procs.length) note(T('bk_proc_hint'));
      for (const op of BLOCK_PALETTE_ADV.my) this.palBlock(op);
      return;
    }
    if (this.cat === 'data') {
      this.pal.append(h('button', { class: 'bk-varbtn solid', onclick: () => DataView.open() }, icon('chart'), T('dv_open')));
      tool(T('bk_newlist'), () => this.newList());
      for (const l of lists) tool('✕ ' + l, () => this.delList(l), T('bk_dellist'));
      if (lists.length) for (const op of BLOCK_PALETTE_ADV.dataList) this.palBlock(op);
      for (const op of BLOCK_PALETTE_ADV.data) this.palBlock(op);
      return;
    }
    const base = BLOCK_PALETTE[this.cat] || [], extra = this.adv ? (BLOCK_PALETTE_ADV[this.cat] || []) : [];
    for (const op of base) this.palBlock(op);
    if (extra.length) {
      if (base.length) this.pal.append(h('div', { class: 'bk-pdiv' }, h('span', { text: T('bk_adv') })));
      for (const op of extra) this.palBlock(op);
    }
  },
  renderWorkspace() {
    if (!this.canvas) return;
    const prog = this.prog(), keepX = this.ws.scrollLeft, keepY = this.ws.scrollTop;
    clear(this.canvas); this.vals = []; this._sig = this.bodySig();
    if (!prog.scripts.length) {
      this.canvas.append(h('div', { class: 'bk-empty' }, h('b', { text: T('bk_empty') }), T('bk_empty_d'),
        h('div', { style: { marginTop: '12px' } }, btn(T('bk_example'), () => this.ideas(), 'small primary'))));
    }
    for (const s of prog.scripts) {
      const def = s.hat && s.hat.op === 'p_def';
      const el = h('div', { class: 'bk-script' + (!s.hat ? ' loose' : '') + (s.off ? ' off' : '') + (def ? ' def' : ''), data: { sid: s.id } });
      const cx = { script: s, proc: def ? procOf(prog, s.hat.a.proc) : null };
      if (s.expr) {
        const val = h('span', { class: 'bk-val' });
        el.append(h('div', { style: { display: 'flex', alignItems: 'center', gap: '10px' } }, this.renderBlock(s.expr, cx), val));
        if (!this.hasRandom(s.expr)) this.vals.push({ blk: s.expr, el: val });
      } else {
        if (s.hat) el.append(this.renderBlock(s.hat, cx));
        const list = h('div', { class: 'bk-list', data: { sid: s.id } });
        for (const b of s.body) list.append(this.renderBlock(b, cx));
        el.append(list);
        if (!s.hat) el.append(h('div', { class: 'bk-loose-note', text: T('bk_loose') }));
      }
      this.canvas.append(el);
    }
    this.ws.scrollLeft = keepX; this.ws.scrollTop = keepY;
    if (this.undoBtn) this.undoBtn.disabled = !this.undoStack.length;
    this.refresh();
  },
  hasRandom(b) { if (!b || typeof b !== 'object') return false; if (b.op === 'v_rand' || b.op === 'r_rand') return true; for (const k in b.a) if (this.hasRandom(b.a[k])) return true; return false; },
  shapeClass(shape) { return shape === 'c' || shape === 'c2' ? 'cblock' : shape; },
  renderBlock(blk, cx) {
    const d = BLOCKS[blk.op], prog = this.prog();
    const el = h('div', { class: 'bk ' + this.shapeClass(d.shape) + (d.adv ? ' adv' : ''), data: { id: blk.id, cat: d.cat } });
    const row = h('div', { class: 'bk-row' });
    this.fillRow(row, d.labelFor ? d.labelFor(blk, prog) : pickLang(d.label), blk, d, cx);
    // your own blocks: the definition hat offers its arguments as little blocks to drag into the script below it
    if (blk.op === 'p_def') { const pr = procOf(prog, blk.a.proc); if (pr) pr.params.forEach((q, i) => row.append(this.argChip(pr, q, i))); }
    if ((blk.op === 'p_call' || blk.op === 'p_def') && !procOf(prog, blk.a.proc)) el.classList.add('missing');
    if ((blk.op === 'p_arg' || blk.op === 'p_argb') && !cx.pal) {
      const pr = procOf(prog, blk.a.proc), q = pr && pr.params[blk.a.i];
      if (!q || (q.t === 'body') !== (blk.op === 'p_argb') || !cx.proc || cx.proc.id !== blk.a.proc) el.classList.add('missing');
    }

    return withY ? { index, y: ly } : index;
  },
  cancelDrag() {
    const d = this.drag; if (!d) return;
    cancelAnimationFrame(d.raf); d.ghost.remove(); for (const e2 of d.els) e2.style.opacity = '';
    this.clearMarks(); this.drag = null;
  },
  drop(x, y) {
    const d = this.drag; if (!d) return;
    this.dragMove(x, y);
    const target = d.target;
    cancelAnimationFrame(d.raf); d.ghost.remove(); this.clearMarks(); this.drag = null;
    if (!target || (target.into === 'trash' && d.pal)) { for (const e2 of d.els) e2.style.opacity = ''; return; }
    Sound.ui(target.into === 'trash' ? 'trash' : 'snap');
    let newId = null;
    this.mutate(() => {
      const pay = d.pal ? this.payloadFromPalette(d.op, d.ov) : this.take(d.id);
      if (!pay) return;
      if (target.into === 'trash') return;
      newId = pay.type === 'hat' ? pay.script.hat.id : pay.blocks[0].id;
      if (!this.place(pay, target)) this.place(pay, { into: 'new' });
    });
    if (newId && d.pal) this.reveal(newId);
  },
};

// ============================================================================
// Measurements — the curves and lists that "measure" blocks fill, drawn live.
// One small chart per curve (each with its own scale): a curve over time, or an x–y
// chart kept to equal scales so an orbit looks like an orbit. With a parallel universe
// both sides are drawn, B dashed. Points beyond what a chart can show are thinned by
// the universe itself (26_blocks_adv.js), so drawing stays cheap.
// ============================================================================
const DataView = {
  panels: [], lists: [], _key: '', _drawAt: 0,
  open() {
    if (Win.isOpen('data')) { if (Win.isMin('data')) Win.restore('data'); if (Win.isFolded('data')) Win.fold('data', false); Win.raise('data'); Win.render('data'); }
    else Win.show('data', null, { unfold: true });
  },
  // a script drew its first point on a new curve: show the charts (once a session, never over a level)
  onFx(f) {
    const s = App.session; if (!s || s.challenge) return;
    if (f.type === 'dataview') { this.open(); return; }
    if (Win.isOpen('data')) { Win.render('data'); return; }
    if (!s._dvShown) { s._dvShown = true; this.open(); }
  },
  key() {
    const s = App.session, us = s.universes();
    return us.map(u => Object.keys(u.plots).map(k => k + ':' + u.plots[k].k).join(',')).join('|') + '#' + (s.program.lists || []).join(',');
  },
  build(head, body) {
    head.append(Win.header(T('dv_title'), null, [iconBtn('download', T('dv_csv'), () => this.csv()), iconBtn('trash', T('dv_clear'), () => this.clearAll())]));
    this.body = body; this.render();
  },
  render() {
    const s = App.session, body = this.body; if (!body || !s) return;
    clear(body); this.panels = []; this.lists = []; this._key = this.key();
    const names = [];
    for (const u of s.universes()) for (const k in u.plots) if (names.indexOf(k) < 0) names.push(k);
    const lists = s.program.lists || [];
    if (!names.length && !lists.length) {
      body.append(h('div', { class: 'dv-empty' }, h('b', { text: T('dv_empty') }), h('p', { text: T('dv_empty_d') }),
        btn(T('dv_toblocks'), () => this.toBlocks(), 'small primary', 'blocks')));
      return;
    }
    if (s.B) body.append(h('div', { class: 'legend dv-leg' }, h('span', null, h('i', { style: { background: COL_A } }), T('dv_a')), h('span', null, h('i', { class: 'dash', style: { background: COL_B } }), T('dv_b'))));
    for (const n of names) {
      const kind = (s.A.plots[n] || (s.B && s.B.plots[n]) || {}).k || 't';
      const val = h('span', { class: 'dv-val' }), cv = h('canvas', { class: 'chart dv-chart' + (kind === 'xy' ? ' xy' : ''), role: 'img', 'aria-label': n });
      body.append(h('div', { class: 'dv-panel' }, h('div', { class: 'dv-head' }, h('b', { text: n }), h('span', { class: 'dv-kind', text: T(kind === 'xy' ? 'dv_xy' : 'dv_t') }), val), cv));
      this.panels.push({ name: n, kind, cv, val });
    }
    if (lists.length) {
      const box = h('div', { class: 'dv-lists' }, h('h3', { text: T('dv_lists') }));
      for (const l of lists) { const len = h('span', { class: 'dv-len' }), tail = h('span', { class: 'dv-tail' }); box.append(h('div', { class: 'dv-list' }, h('b', { text: l }), len, tail)); this.lists.push({ name: l, len, tail }); }
      body.append(box);
    }
    this.draw();
  },
  // the editor, on the Measure blocks (switching the advanced layer on if it is off)
  toBlocks() {
    BlocksUI.cat = 'data';
    if (Win.isOpen('blocks') && BlocksUI.cats) { if (!BlocksUI.adv) BlocksUI.setAdv(true); else { BlocksUI.renderCats(); BlocksUI.renderPalette(); } }
    else Store.setPref('bkAdv', true);
    Win.show('blocks', null, { unfold: true });
  },
  refresh() {

          compared: { body: name(s.compare.body), reference: name(s.compare.ref) }, series: s.compare.series, A: side(s.A), B: side(s.B),
          notes: 'Newtonian point-mass gravity with softened contact; no collisions, tides or relativity. Series: separation = distance between the same body in A and B.' };

// ============================================================================
// Rewind — scrub back through the recent past of this universe. Nothing is
// thrown away until you choose "continue from here"; that choice can be undone.
// ============================================================================
const Rewind = {
  active: false, el: null, base: null, idx: 0, n: 0, wasRunning: false,

  open() {
    const s = App.session; if (!s || this.active || App.aim) return;
    this.wasRunning = s.running; s.pause(); if (!this.wasRunning) s.snapshot('auto');
    if (s.history.length < 2) { Toast.show(T('rw_none'), { key: 'rw' }); if (this.wasRunning) s.play(); return; }
    this.active = true; this.base = s.capture(); this.vm = s.viewMode; this.act = s.active; this.n = s.history.length; this.idx = this.n - 1;
    Pop.close(); App.setMode(null);
    this.lab = h('b'); this.sub = h('span');
    this.range = h('input', { type: 'range', min: 0, max: this.n - 1, step: 1, value: this.n - 1, 'aria-label': T('rewind') });
    this.range.addEventListener('input', () => this.preview(+this.range.value));
    const ago = (sec, label) => h('button', { class: 'chip', text: label, onclick: () => { const i = s.historyIndexAgo(sec); if (i >= 0) { this.range.value = i; this.preview(i); } } });
    this.goBtn = btn(T('rw_go'), () => this.commit(), 'small brass');
    this.el = h('div', { id: 'rewind', role: 'dialog', 'aria-label': T('rewind') },
      h('div', { class: 'top' }, this.lab, this.sub), this.range,
      h('div', { class: 'acts' }, ago(10, T('rw_10')), ago(30, T('rw_30')), ago(60, T('rw_60')), ago(180, T('rw_180')), h('span', { class: 'sp' }), btn(T('cancel'), () => this.cancel(), 'small quiet'), this.goBtn));
    HUD.host.append(this.el);
    document.body.classList.add('rewinding');
    this.label(); HUD.tick(performance.now());
  },
  label() {
    const s = App.session, hh = s.history[this.idx], last = this.idx >= this.n - 1;
    this.lab.textContent = fmtTime(hh.t);
    this.sub.textContent = last ? T('rw_now') : T('rw_ago', { s: Math.max(1, Math.round(s.wall - hh.wall)) }) + (hh.kind === 'edit' ? T('rw_edit') : '');
    this.goBtn.disabled = last;
  },
  preview(i) {
    const s = App.session; this.idx = clamp(i, 0, this.n - 1);
    s.restoreState(s.history[this.idx]);
    if (App.sel && !App.U().byId(App.sel)) App.sel = null;
    if (App.cam.follow && !App.U().byId(App.cam.follow)) App.cam.detach(App.U(), performance.now());
    this.label(); HUD.syncViews(); HUD.layout();
  },
  close() {
    if (this.el) this.el.remove(); this.el = null; this.active = false; this.base = null;
    document.body.classList.remove('rewinding');
  },
  cancel() {
    if (!this.active) return;
    const s = App.session; s.restoreState(this.base);
    if (s.B) { s.viewMode = this.vm; s.active = this.act; }
    const run = this.wasRunning; this.close(); HUD.refresh();
    if (run) { s.play(); HUD.refresh(); }
  },
  commit() {
    if (!this.active) return;
    const s = App.session, i = this.idx;
    if (i >= this.n - 1) { this.cancel(); return; }
    s.restoreState(this.base); if (s.B) { s.viewMode = this.vm; s.active = this.act; }
    s.rewindTo(i);
    this.close(); App.afterRestore(true);
    Toast.show(T('rw_done'), { key: 'rw', ms: 6000, action: { label: T('rw_undo'), fn: () => { if (s.undoRewind()) App.afterRestore(false); } } });
  },
};

const Capture = {
  rec: null,
  stamp() { const d = new Date(), p = (n) => String(n).padStart(2, '0'); return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()); },
  photo() {
    if (!App.glOk || !App.session) { Toast.show(T('cap_fail')); return; }
    const now = performance.now();
    let c;
    try {
      // the drawing buffer is only valid right after a render, so render and copy in the same task
      App.renderFrame(now, 0); App.drawOverlay(now);
      const va = App.viewArea(), d = App.renderer.dpr, sw = Math.round(va.w * d), sh = Math.round(va.h * d);
      c = document.createElement('canvas'); c.width = sw; c.height = sh;
      const g = c.getContext('2d');
      g.drawImage(App.canvas, Math.round(va.x * d), Math.round(va.y * d), sw, sh, 0, 0, sw, sh);
      if (!document.body.classList.contains('clean')) g.drawImage(App.ov, va.x * App.ovSx, va.y * App.ovSy, va.w * App.ovSx, va.h * App.ovSy, 0, 0, sw, sh);
    } catch (e) { Toast.show(T('cap_fail')); return; }
    const name = 'gravitylab-' + this.stamp() + '.png';
    let url; try { url = c.toDataURL('image/jpeg', 0.9); } catch (e) { Toast.show(T('cap_fail')); return; }
    // one save at a time: encoding the PNG can take a moment, and the host shows one dialog at a time
    let busy = false;
    const idle = () => { busy = false; saveBtn.disabled = false; };
    const save = () => {
      if (busy) return;
      busy = true; saveBtn.disabled = true;
      try {
        c.toBlob(async (blob) => {
          try {
            if (!blob) { Toast.show(T('cap_fail')); return; }
            const r = await Files.save(name, blob, 'image/png');
            if (r === 'saved') { Modal.close(); Toast.show(T('exp_saved', { f: name })); }
            else if (r === 'busy') Toast.show(T('exp_busy'));
            else if (r === 'failed') Toast.show(T('cap_hold'), { ms: 6000 });
          } finally { idle(); }
        }, 'image/png');
      } catch (e) { idle(); Toast.show(T('cap_fail')); }
    };
    const saveBtn = btn(T('cap_save'), save, 'primary', 'download');
    Modal.open(h('div', { class: 'dlg wide', role: 'dialog', 'aria-modal': 'true' }, h('h2', { text: T('tl_photo') }), h('img', { src: url, alt: T('tl_photo') }),
      h('div', { class: 'acts' }, btn(T('close'), () => Modal.close(), 'quiet'), saveBtn)));
  },
  toggleVideo() { if (this.rec) this.stopVideo(); else this.startVideo(); },
  startVideo() {
    const canvas = App.canvas;
    if (!App.glOk || !canvas.captureStream || typeof MediaRecorder === 'undefined') { Toast.show(T('rec_unsupported'), { ms: 5000 }); return; }
    const types = ['video/mp4;codecs=avc1.42E01E', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
    const mime = types.find(t => { try { return MediaRecorder.isTypeSupported(t); } catch (e) { return false; } });
    let stream, rec;
    try { stream = canvas.captureStream(30); rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 8e6 } : undefined); }
    catch (e) { Toast.show(T('rec_unsupported'), { ms: 5000 }); return; }
    const chunks = [], type = (mime || rec.mimeType || 'video/webm').split(';')[0], ext = type.indexOf('mp4') >= 0 ? 'mp4' : 'webm';
    rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onerror = () => { this.cleanup(); Toast.show(T('cap_fail')); };
    rec.onstop = () => {
      for (const tr of stream.getTracks()) tr.stop();
      const st = this.rec; this.cleanup();
      if (!chunks.length) { Toast.show(T('cap_fail')); return; }
      this.finish(new Blob(chunks, { type }), ext, st ? (performance.now() - st.t0) / 1000 : 0);
    };
    const time = h('span', { text: '0:00' });
    const badge = h('div', { id: 'recBadge', role: 'status' }, h('i'), time, btn(T('rec_stop'), () => this.stopVideo(), 'small'));
    HUD.host.append(badge);
    this.rec = { rec, t0: performance.now(), badge,
      timer: setInterval(() => { const sec = Math.floor((performance.now() - this.rec.t0) / 1000); time.textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }, 500),
      limit: setTimeout(() => this.stopVideo(), 90000), wasClean: document.body.classList.contains('clean') };
    HUD.setClean(true);
    try { rec.start(500); } catch (e) { this.cleanup(); Toast.show(T('rec_unsupported')); }
  },
  stopVideo() { const r = this.rec; if (!r) return; try { if (r.rec.state !== 'inactive') r.rec.stop(); else this.cleanup(); } catch (e) { this.cleanup(); } },
  cleanup() {
    const r = this.rec; if (!r) return;
    clearInterval(r.timer); clearTimeout(r.limit); r.badge.remove(); this.rec = null;
    if (!r.wasClean) HUD.setClean(false);
  },
  finish(blob, ext, seconds) {
    const name = 'gravitylab-' + this.stamp() + '.' + ext;
    let url = null; try { url = URL.createObjectURL(blob); } catch (e) { url = null; }
    const vid = url ? h('video', { src: url, controls: true, playsInline: true, muted: true, style: { width: '100%', borderRadius: '12px', margin: '10px 0', background: '#000' } }) : null;
    let busy = false;
    const save = async () => {
      if (busy) return;
      busy = true; saveBtn.disabled = true;
      try {
        const r = await Files.save(name, blob, blob.type);
        if (r === 'saved') { Modal.close(); Toast.show(T('exp_saved', { f: name })); }
        else if (r === 'busy') Toast.show(T('exp_busy'));
        else if (r === 'failed') Toast.show(T('cap_nosave'), { ms: 6000 });
      } finally { busy = false; saveBtn.disabled = false; }
    };
    const saveBtn = btn(T('cap_save_v'), save, 'primary', 'download');
    Modal.open(h('div', { class: 'dlg wide', role: 'dialog', 'aria-modal': 'true' }, h('h2', { text: T('tl_video') }), vid,
      h('p', { class: 'note', text: T('rec_info', { s: Math.round(seconds), size: blob.size < 1048576 ? Math.max(1, Math.round(blob.size / 1024)) + ' KB' : (blob.size / 1048576).toFixed(1) + ' MB', ext: ext.toUpperCase() }) }),
      h('div', { class: 'acts' }, btn(T('close'), () => Modal.close(), 'quiet'), saveBtn)),
      () => { if (url) setTimeout(() => URL.revokeObjectURL(url), 1000); });
  },
};

const LIMITS = [
  ['引力是牛頓萬有引力。沒有相對論效應，所以不會有水星近日點進動那一類現象；黑洞附近的軌道也照牛頓算。', 'Gravity is Newtonian. There are no relativistic orbit effects, even close to a black hole.', '重力はニュートン力学。相対論的な軌道効果はなく、ブラックホール近傍もニュートンで計算します。'],
  ['天體真的會相撞。預設的「真實」規則看撞擊的能量：輕碰合併，猛撞噴出碎片或粉碎，高速擦邊各自飛走；黑洞碰到什麼就吞什麼，探測器撞上就沒了。這是把行星碰撞研究的經驗公式（Leinhardt & Stewart 2012；Genda、Kokubo、Ida 2012）套在均勻的球上，碎片只用十來塊代表，沒有算熔化、蒸發和自轉。規則可以在「更多 → 物理」換；你的積木會比規則先動手。', 'Bodies really collide. The default “Real” rule looks at the energy of the impact: gentle ones merge, hard ones throw off fragments or shatter, fast glancing ones part again; a black hole swallows whatever touches it and a probe is lost on impact. It applies empirical laws from planet-collision research (Leinhardt & Stewart 2012; Genda, Kokubo & Ida 2012) to uniform spheres, lets a dozen pieces stand in for the debris, and leaves out melting, vapour and spin. Pick another rule under More → Physics; your blocks act before the rule does.', '天体は実際に衝突します。既定の「現実」ルールは衝突のエネルギーで決まります：穏やかなら合体、激しければ破片を飛ばすか砕け、高速でかすめた場合は離れていきます。ブラックホールは触れたものを飲み込み、探査機は衝突で失われます。惑星衝突研究の経験則（Leinhardt & Stewart 2012、Genda・Kokubo・Ida 2012）を一様な球に当てはめ、破片は十数個で代表し、融解・蒸発・自転は扱いません。ルールは「その他 → 物理」で変更でき、ブロックはルールより先に働きます。'],
  ['洛希極限：只靠自身引力維持形狀的天體（半徑 200 km 以上，黑洞和中子星除外），待在另一個天體的「2.44 × 自己的半徑 × 質量比的立方根」以內，就會被潮汐一對一對地剝成碎片。快速掠過可以全身而退，或只掉一部分。更小的天體當作靠材料強度撐著，不會碎（真實的碎石堆小行星其實會）。碎片不會再被撕，而且只有在極限外面慢慢碰上時才會黏回去。', 'Roche limit: a body that only its own gravity holds together (over 200 km in radius; black holes and neutron stars excepted) and that stays within 2.44 × its own radius × the cube root of the mass ratio of another body is peeled into fragments, a pair at a time. A quick pass can be survived whole or in part. Smaller bodies are treated as held by material strength and never break (real rubble-pile asteroids would). Fragments are not torn again, and stick back together only outside the limit and only when they meet gently.', 'ロッシュ限界：自己重力だけで形を保つ天体（半径200km以上。ブラックホールと中性子星を除く）が、別の天体から「2.44 × 自分の半径 × 質量比の立方根」以内にとどまると、潮汐で一対ずつ破片に剥がされます。素早い通過なら無傷か一部を失うだけで済みます。より小さい天体は材料強度で保たれるとみなし、砕けません（実際のラブルパイル小惑星は砕けます）。破片は再び引き裂かれず、限界の外で穏やかに触れたときだけ再びくっつきます。'],
  ['沒有恆星演化、大氣阻力、潮汐加熱或潮汐鎖定，自轉也不影響軌道；潮汐只做「洛希極限內把天體撕開」這一件事。除了碰撞和潮汐撕裂，質量會變，只因為你或你的積木改了它。', 'No stellar evolution, drag, tidal heating or tidal locking, and spin does not affect orbits; tides do one thing only, pulling bodies apart inside a Roche limit. Apart from collisions and tidal break-up, mass changes only when you or your blocks change it.', '恒星進化・抵抗・潮汐加熱・潮汐固定はなく、自転も軌道に影響しません。潮汐が行うのはロッシュ限界内で天体を引き裂くことだけです。衝突と潮汐破壊を除き、質量が変わるのはあなたやブロックが変えたときだけです。'],
  ['行星的起始位置由平均軌道根數算出，接近今天的實際位置，但不是精密星曆。', 'Starting positions come from mean orbital elements: close to today\'s real positions, not a precision ephemeris.', '惑星の初期位置は平均軌道要素から計算。今日の実際の位置に近いですが精密暦ではありません。'],

  hp_look: ['看', 'Look around', '見る'], hp_look_d: ['一指拖曳轉視角，兩指縮放（滑鼠用滾輪）。點天體選取它，點兩下飛過去。', 'Drag with one finger to turn, pinch to zoom (mouse wheel on desktop). Tap a body to select it, tap twice to fly there.', '1本指で回転、ピンチで拡大縮小（マウスはホイール）。天体をタップで選択、2回タップで接近。'],
  hp_cam: ['探測器鏡頭', 'Probe cameras', '探査機カメラ'], hp_cam_d: ['點一下探測器，就能看它的六個鏡頭：前後左右上下（前＝飛行方向，下＝它繞著的那顆星）。切到「外觀」可以從六個方向看探測器本身；點任一格放大，拖曳轉動、雙指縮放。', 'Tap a probe to see through its six cameras: front, back, left, right, up and down (front is the way it flies, down is towards what it falls around). Switch to Exterior to see the probe itself from six sides; tap a picture to enlarge it, drag to turn, pinch to zoom.', '探査機をタップすると6台のカメラ（前後左右上下）が見られます（前＝進行方向、下＝周回している天体の側）。「外観」に切り替えると探査機そのものを6方向から見られます。1つをタップで拡大、ドラッグで回転、ピンチでズーム。'],
  hp_add: ['放', 'Add', '置く'], hp_add_d: ['「天體」選一顆，再點宇宙裡的位置：點一下自動走圓軌道，按住拖曳就是自己丟；把箭頭拖到另一顆天體上，會自動瞄準它。拖的時候時間會停，虛線是預測路線，會撞上什麼也會先告訴你。', 'Pick something under Bodies, then tap in space: a tap gives a circular orbit, a drag throws it yourself; drag the arrow onto another body and the throw is aimed at it. Time stops while you drag; the dashed line predicts the path and says what it will hit.', '「天体」で選び、宇宙をタップ。タップは円軌道、ドラッグは自分で投げる。矢印を別の天体の上まで引くと、そこを狙います。ドラッグ中は時間が止まり、点線が予測進路と衝突相手を示します。'],
  hp_edit: ['改', 'Change', '変える'], hp_edit_d: ['選取天體後可以改質量、速度、種類，也能釘住、移動、從它身上發射東西。每一步都能復原。', 'With a body selected, change its mass, speed or kind; pin it, move it, launch things from it. Every step can be undone.', '天体を選ぶと質量・速さ・種類を変更、固定、移動、発射ができます。すべて元に戻せます。'],
  hp_time: ['時間', 'Time', '時間'], hp_time_d: ['金色的圓鈕是開始和暫停。點它旁邊的速度，可以決定每秒過多久。↺ 可以把時間倒回去，從過去重新來。', 'The brass dial starts and pauses. Tap the speed beside it to set how much time passes per second. ↺ scrubs back so you can replay from the past.', '金色の丸ボタンで開始・停止。となりの速度をタップして1秒に進む時間を決めます。↺で過去に戻ってやり直せます。'],
  hp_hit: ['相撞', 'Collisions', '衝突'], hp_hit_d: ['天體碰到就會照物理相撞：合併、噴出碎片，或雙雙粉碎；太靠近大天體還會被潮汐撕碎（洛希極限）。想換規則，到「更多 → 物理」。', 'Bodies that touch collide for real: they merge, throw off fragments or shatter. Too close to a big one, and tides pull them apart (the Roche limit). To change the rule, go to More → Physics.', '天体は触れると本当に衝突します：合体、破片の飛散、あるいは粉砕。大きな天体に近づきすぎると潮汐で引き裂かれます（ロッシュ限界）。ルールは「その他 → 物理」で変えられます。'],
  hp_blocks: ['積木', 'Blocks', 'ブロック'], hp_blocks_d: ['用積木寫下規則：什麼時候，發生什麼。例如「當月球與地球的距離小於 2 萬公里 → 把時間放慢、顯示訊息」。打開積木視窗下方的「進階」還有更多：一次對所有恆星下規則、自訂物理定律（1/r³ 引力、空間膨脹、引擎）、自己做積木、即時曲線圖。', 'Write rules with blocks: when something happens, do something. For example “when the Moon gets closer than 20,000 km to Earth → slow time down and show a message”. Switch on Advanced at the bottom of the editor for more: rules for every star at once, your own laws of physics (gravity as 1/r³, expanding space, engines), blocks of your own, and live charts.', 'ブロックでルールを書く：いつ、何が起こるか。例「月と地球の距離が2万kmより近くなったら → 時間を遅くしてメッセージを表示」。エディター下の「上級」をオンにすると、すべての恒星に一度にルールを書いたり、独自の物理法則（1/r³ の重力、空間の膨張、エンジン）、マイブロック、リアルタイムのグラフが使えます。'],
  hp_par: ['平行宇宙', 'Parallel universe', '並行宇宙'], hp_par_d: ['分出一模一樣的宇宙 B，只改其中一邊，兩邊同時跑，看差在哪。另一個宇宙可以並排看，也可以變成能拖的小視窗。', 'Split off an identical universe B, change one side only, run both and see what differs. Watch the other one side by side, or as a small view you can drag around.', 'そっくりな宇宙Bを分け、片方だけ変えて同時に動かし、違いを見る。もう一方は並べても、ドラッグできる小窓にしても見られます。'],
  hp_win: ['視窗', 'Windows', 'ウィンドウ'], hp_win_d: ['每個面板都是視窗：抓著最上面那一條拖到任何地方；拉左右兩邊、下緣或下面兩個角改大小（手機上也可以兩指在標題列上捏開捏合）。⌄ 收成一條，– 縮到畫面左邊的小格子（點一下就回來），⤢ 全螢幕，✕ 關掉。', 'Every panel is a window: hold its bar to drag it anywhere; pull either side, the bottom edge or a bottom corner to resize it (on a phone you can also pinch on its bar). ⌄ folds it down to the bar, – sends it to the dock on the left (tap it there to bring it back), ⤢ fills the screen, ✕ closes it.', 'パネルはすべてウィンドウです。上のバーをつかんで好きな所へ。左右の端・下の端・下の角を引いてサイズ変更（スマホではバーをピンチしても）。⌄ でバーだけにたたみ、– で画面左のドックへ（タップで戻る）、⤢ で全画面、✕ で閉じる。'],
  hp_keys: ['鍵盤：空白鍵 開始／暫停，[ ] 調時間速度，F 飛到選取的天體，H 看全部，Ctrl＋Z 復原，Delete 移除，Esc 離開目前的模式或關掉最上面的視窗。', 'Keyboard: Space play/pause, [ ] time speed, F fly to selection, H see everything, Ctrl+Z undo, Delete remove, Esc leave the current mode or close the front window.', 'キーボード：Space 再生/停止、[ ] 速度、F 選択へ、H 全体、Ctrl+Z 元に戻す、Delete 除去、Esc モード終了／手前のウィンドウを閉じる。'],
  cr_limits: ['這個模型算什麼、不算什麼', 'What this model does and does not compute', 'このモデルが計算すること・しないこと'], cr_sources: ['素材來源', 'Sources', '出典'],
  cr_note: ['觀測影像、重建影像和藝術示意在每個天體的面板裡都有標明。', 'Each body\'s panel says whether its surface is observed, reconstructed or artistic.', '各天体のパネルに、観測・再構成・想像図の区別を表示しています。'],
  no_gl: ['這個裝置或瀏覽器無法啟動 WebGL2，宇宙畫面顯示不出來。', 'WebGL2 could not start on this device or browser, so the universe cannot be drawn.', 'この端末／ブラウザでは WebGL2 を起動できず、宇宙を描画できません。'],
  fatal: ['啟動時出了問題', 'Something went wrong while starting', '起動中に問題が発生しました'],
});

(function start() {
  const fatal = (e) => {
    if (document.getElementById('fatal')) return;
    document.body.append(h('div', { id: 'fatal' }, h('div', null, h('h2', { text: T('fatal') }), h('p', { class: 'note', text: String(e && e.message || e).slice(0, 300) }))));
  };
  const go = () => {
    if (/[#&]debug\b/.test(location.hash)) { window.__gl = { App, HUD, Win, Pop, Toast, Store, Title, Home, BlocksUI, Rewind, Parallel, Interp, CATALOG, M3, V, bodyRotation, spinAngle, makeBody, Sound, ChallengeUI, ChallengeRun, CHALLENGES, CHALLENGE_ORDER, chDir, ProbeCam, CraftAtt, Inspector, DataView, BLOCKS, BLOCK_PALETTE_ADV, newBlock, newScript, procOf }; if (/still/.test(location.hash)) Title._init = true, Title.paused = true; }
    try { App.boot(); } catch (e) { if (window.console) console.error(e); fatal(e); }
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', go); else go();
  window.addEventListener('unhandledrejection', (e) => { if (window.console) console.warn('unhandled', e.reason); });
})();

})();
</script>
